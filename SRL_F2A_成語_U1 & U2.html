<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRL F2 上學期 UT & EXAM《中二成語名言警句手冊》</title>
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; --card: #ffffff; --success: #34c759; --error: #ff3b30; --meaning: #e67e22; --example: #27ae60; --highlight: #ff9500; --purple: #af52de; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); display: flex; justify-content: center; height: 100vh; overflow: hidden; }
        .app { width: 100%; max-width: 500px; display: flex; flex-direction: column; }
        .screen { flex: 1; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto; }
        .hidden { display: none !important; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; margin-bottom: 15px; border: 1px solid rgba(0,0,0,0.05); }
        .btn { background: var(--primary); color: white; border: none; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 600; margin: 8px 0; cursor: pointer; width: 100%; -webkit-tap-highlight-color: transparent; }
        .btn-exam { background: var(--highlight); }
        .btn-purple { background: var(--purple); }
        .btn-l0 { background: #5856d6; }
        .btn-l4 { background: #1c1c1e; }
        .btn-outline { background: none; color: var(--primary); border: 2px solid var(--primary); }
        .toolbar { display: flex; justify-content: space-between; padding: 10px 20px; align-items: center; background: white; border-bottom: 1px solid #ddd; }
        .back-link { color: var(--primary); background: none; border: none; font-size: 17px; font-weight: 600; cursor: pointer; padding: 10px 0; }
        .list-item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
        .word-row { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; flex-wrap: wrap; }
        .char-btn { border: 1.5px solid #d1d1d6; background: #fff; border-radius: 6px; padding: 4px 8px; font-size: 1.2rem; cursor: pointer; color: #003366; font-weight: bold; }
        .char-btn:active { background: #007aff; color: #fff; }
        .exp-text { color: var(--meaning); font-size: 1rem; font-weight: 600; margin-bottom: 5px; }
        .ex-text { color: var(--example); font-size: 0.9rem; line-height: 1.5; }
        .speak-btn { background: #f2f2f7; border: none; border-radius: 50%; cursor: pointer; font-size: 1.1rem; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
        input { width: 100%; padding: 15px; font-size: 1.4rem; border-radius: 15px; border: 2px solid #ccc; text-align: center; box-sizing: border-box; }
        .feedback-area { margin-top: 15px; min-height: 40px; font-weight: bold; font-size: 1.1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="app">
        <div class="toolbar">
            <span style="font-weight:700;">SRL F2《中二成語名言警句手冊》</span>
            <button onclick="toggleGlobalSnd()" id="snd-btn" style="border:none; background:none; font-size:22px;">🔊</button>
        </div>

        <div id="sc-cover" class="screen">
            <div class="card" style="background: #fff9f0;">
                <h3 style="margin:0 0 10px 0; color:#e67e22;">🔥 上學期 UT 必考範圍</h3>
                <button class="btn btn-exam" onclick="openChapterMenu('單元一')">單元一：人情世故 (11個成語 + 3個名言)</button>
                <button class="btn btn-exam" onclick="openChapterMenu('單元二')">單元二：風物彩繪 (10個成語 + 5個名言)</button>
                <button class="btn btn-exam" onclick="openChapterMenu('校本價值教育')">校本價值教育名句 (1-9 忠誠)</button>
            </div>

            <div class="card" style="background: #f0f8ff;">
                <h3 style="margin:0 0 10px 0; color:#007aff;">✨ 上學期 EXAM 必考範圍 (~DEC)</h3>
                <button class="btn" onclick="openChapterMenu('單元三《愛蓮說》')">單元三：《愛蓮說》(8個成語 + 3個名言)</button>
                <button class="btn" onclick="openChapterMenu('單元三《陋室銘》')">單元三：《陋室銘》(11個成語 + 2個名言)</button>
                <button class="btn" onclick="openChapterMenu('單元四《詞兩首》')">單元四：詞兩首 (9個成語 + 3個名言)</button>
                <button class="btn" onclick="openChapterMenu('單元四《曲兩首》')">單元四：曲兩首 (8個成語 + 2個名言)</button>
            </div>
        </div>

        <div id="sc-level" class="screen hidden">
            <button class="back-link" onclick="showScreen('sc-cover')">← 返回主頁</button>
            <div class="card"><h2 id="chapter-title" style="margin:0; color: var(--primary);"></h2></div>
            <button class="btn btn-l0" onclick="showLevel0()">1. Level 0 (點字溫習)</button>
            <button class="btn" onclick="startGame(1)">2. Level 1 (意思填充)</button>
            <button class="btn btn-purple" onclick="startGame(2)">3. Level 2 (應用挑戰)</button>
            <button class="btn btn-l4" onclick="startGame(4)">🏆 Level 4 (聽音默寫 - 無字)</button>
        </div>

        <div id="sc-l0-list" class="screen hidden">
            <button class="back-link" onclick="showScreen('sc-level')">← 返回</button>
            <div id="l0-content"></div>
        </div>

        <div id="sc-game" class="screen hidden">
            <button class="back-link" onclick="confirmExit()">← 放棄練習</button>
            <div id="game-info" style="text-align:center; color:#8e8e93; margin-bottom:10px;"></div>
            <div id="q-card" class="card">
                <div id="q-text" style="font-size:1.15rem; line-height:1.6; padding: 10px 0;"></div>
                <button id="q-speak" class="btn btn-outline" style="padding:8px; font-size:0.9rem;" onclick="speakCurrentQ()">🔊 朗讀題目</button>
            </div>
            <div id="q-hint" style="text-align:center; letter-spacing:4px; font-size:1.2rem; font-weight:bold; margin:15px 0; background:#eee; padding:12px; border-radius:10px;"></div>
            <input type="text" id="ans-in" placeholder="請輸入答案" autocomplete="off">
            <div id="fb-area" class="feedback-area"></div>
            <div id="action-area" class="hidden"><button class="btn" onclick="nextQuestion()">下一題</button></div>
            <button id="submit-btn" class="btn" onclick="checkAnswer()">提交</button>
        </div>

        <div id="sc-res" class="screen hidden">
            <div class="card" style="margin-top:40px;"><h1 id="res-score" style="font-size:3.5rem;"></h1><p id="res-msg"></p></div>
            <button class="btn" onclick="showScreen('sc-cover')">完成溫習</button>
        </div>
    </div>

<script>
    const bank = [
        // ==================== UT 必考範圍 ====================
        // 中二單元一：人情世故
        { ch: "單元一", w: "猶豫不決", exp: "遲疑不決，沒法拿定主意。", l1: "比賽截止報名日期快到了，一心仍______，不知道跟嘉穎還是芯諾一起參加合唱項目。", l2: "姐姐對於繼續升學，還是投身社會工作，一直______。但她聽了舅舅的一番話後，終於有了決定。" },
        { ch: "單元一", w: "才高八斗", exp: "斗，容量的單位。形容才學淵博、文才極高。本作「八斗之才」，是讚譽曹植的文才有八斗那麼多。", l1: "他______，琴棋書畫都難不倒他。", l2: "張教授學貫中西、創作豐富，在文學界享有______的美譽。" },
        { ch: "單元一", w: "鋒芒畢露", exp: "鋒芒，指刀劍的刃口和尖端。比喻人的銳氣、才幹。畢，全部。鋒芒畢露，比喻人的傲氣、銳氣、才幹完全顯露出來，也形容人高傲自大、喜歡表現自己的才幹。", l1: "他聰明機智，加上年少得志，使他處處______，不懂謙遜。", l2: "那位年輕的新員工在會議上______，雖然展現了絕佳才能，但也招致不少資深同仁的嫉妒。" },
        { ch: "單元一", w: "目空一切", exp: "一切都不放在眼裏。形容狂妄自大、高傲自大的人。", l1: "她從沒有嘗過失敗的滋味，加上年少氣盛，難免會______。", l2: "他自恃有點小聰明，就______，怎會願意接受別人的勸告呢？" },
        { ch: "單元一", w: "叱咤風雲", exp: "叱咤，高聲呼喝。高聲呼喝一聲，可使風雲變色。形容威風凜凜、聲勢力量極大，足以支配局勢。", l1: "這名演員在劇中扮演______的一代名將，威風凜凜，舉手投足都充滿英雄氣概。", l2: "這位在商界______的慈善家，用企業的部分收益成立慈善基金，幫助社會上有需要的人。" },
        { ch: "單元一", w: "趾高氣揚", exp: "走路時腳抬得高高的，神氣十足。形容自滿驕傲，得意忘形。", l1: "他在校際鋼琴比賽勝出後，就______，誰都不放在眼裏。", l2: "贏得一場小比賽就如此______，這種驕傲自滿的態度終究會阻礙他取得更大的成就。" },
        { ch: "單元一", w: "出類拔萃", exp: "語出自《孟子·公孫丑上》「出於其類，拔乎其萃。」拔，超出。萃，本指草叢，引申指人或物的聚集。形容人的才學品德超群出眾。", l1: "他雖然年紀輕輕，但才華橫溢，______，一定能勝任這份工作。", l2: "經過多年的苦練，她終於在眾多世界級選手中脫穎而出，成為______的舞蹈家。" },
        { ch: "單元一", w: "妄自尊大", exp: "自高自大。", l1: "你不要______，要知道「人外有人，天外有天」，我勸你還是學會謙遜一點，否則遲早會吃虧的。", l2: "我們必須保持謙虛學習的心態，絕不能盲目自滿、______，否則終將被時代淘汰。" },
        { ch: "單元一", w: "三思而行", exp: "反覆考慮才行動。", l1: "我們做事必須______，不能草率行事。", l2: "哥哥做事魯莽衝動，闖過不少禍，所以媽媽常常叮囑他凡事要______。" },
        { ch: "單元一", w: "笑裏藏刀", exp: "形容人表面和善但內心陰險狠毒。", l1: "她平日笑容可掬，卻是個______的人，你要小心提防她。", l2: "他平日笑容滿面，原來是______，所以大家都不想跟交朋友。" },
        { ch: "單元一", w: "胸有成竹", exp: "在下筆畫竹前，心中早已有了竹子的形象。比喻做事前早已有了全面的考慮和打算，有把握把事情做好。也作「成竹在胸」。", l1: "允行訓練有素，對於在比賽時應採取甚麼致勝的策略，可謂______。", l2: "弟弟______地跟媽媽說：「我一定會在這次測驗拿到一百分。」" },
        { ch: "單元一", w: "滿招損,謙受益", exp: "出自《尚書·大禹謨》，指自滿會招來損害、失敗；謙虛會得到好處、教益。", l1: "我們不要因一時的成功而驕傲自滿，要謹記「______」，才能繼續進步。", l2: "她連續奪得三屆音樂比賽的冠軍後，漸漸變得自滿，疏於練習。直至她在這次比賽中落敗，才明白「______」的道理。" },
        { ch: "單元一", w: "識時務者為俊傑", exp: "出自《三國志·諸葛亮傳》，形容能認清時代的形勢和潮流的人，才稱得上是英雄豪傑。多用來勸導他人改變目前的立場或歸順。", l1: "你口中雖說「______」，但事實是要我與你一起做壞事，我才不會答應呢！", l2: "「______」，難道你還未看清現在的情況嗎？快點投靠明主吧！" },
        { ch: "單元一", w: "明槍易躲,暗箭難防", exp: "出自小說《平妖傳》，指從明處來的槍容易躲避，暗中射來的箭則難以防範。比喻公開的攻擊和傷害容易對付，而暗中的、隱閉的傷害和中傷則難以提防。", l1: "所謂「______」！他思想單純，沒有提防身邊的陰險小人，才會遭人陷害。", l2: "商場上競爭激烈，公開談判容易應對，但面對背後的謠言誹謗，真是讓人感歎「______」。" },

        // 中二單元二：風物彩繪
        { ch: "單元二", w: "措手不及", exp: "事情發生太快，來不及應付。", l1: "今天的突擊測驗，令全班同學都______。", l2: "面對突如其來的暴風雨，戶外運動會的籌備人員頓時感到______。" },
        { ch: "單元二", w: "岌岌可危", exp: "形容非常危險。", l1: "那座大廈經歷過這次地震，牆身出現多條裂縫，已到了______的地步！", l2: "這家老字號店舖因經營不善而面臨破產，前景可謂______。" },
        { ch: "單元二", w: "翻騰不息", exp: "指不斷上下翻動。", l1: "狂風暴雨時，海面上就會出現一個個巨浪，______。", l2: "站在山頂俯瞰，只見雲海在腳下______，氣象萬千。" },
        { ch: "單元二", w: "波濤洶湧", exp: "形容波浪又大又急的樣子。", l1: "現在海面______，十分危險，你們還是不要出海了。", l2: "輪船在______的大海中艱難前行，乘客們都緊緊抓牢扶手。" },
        { ch: "單元二", w: "風吹雨打", exp: "本來指花木被風雨摧殘，後來用作比喻遭受鍛鍊或考驗。", l1: "公園裏這棵百年大樹經歷多年的______，仍然屹立不倒。", l2: "這座古老的石橋歷經數百年______，依然完好無損。" },
        { ch: "單元二", w: "風平浪靜", exp: "無風無浪，比喻平靜或形勢穩定。", l1: "今天海面______，是啟航的好日子。", l2: "經歷了這場商業風波後，公司業務終於恢復______。" },
        { ch: "單元二", w: "乘風破浪", exp: "順著風，破浪向前進，比喻不畏艱難，勇往直前。", l1: "你還年輕，理應抱著______的壯志創一番事業，不應無所事事。", l2: "青年人應有______的勇氣，在逆境中創造屬於自己的未來。" },
        { ch: "單元二", w: "步步為營", exp: "步，古時五尺為步。步步，表示距離不遠。營，軍事營壘。步步為營，指軍隊每前進一步就設下營壘，以防敵人攻擊，形容行動謹慎，防備周全。", l1: "在這條泥濘不堪的道路上行走，大家都要______。", l2: "這項投資風險極高，我們必須______，切勿急功近利。" },
        { ch: "單元二", w: "安然無恙", exp: "平安無事，沒有遭到損害。", l1: "雖然輪船在出海期間遇到風浪，但船員全都______。", l2: "經過醫生徹夜搶救，受傷的司機終於脫離險境，______。" },
        { ch: "單元二", w: "驚心動魄", exp: "形容事物的驚險或巨大的刺激，令人內心受到極大的震動。", l1: "這場高空彈跳表演，過程真是______。", l2: "這部探險電影劇情跌宕起伏，情節險象環生，真令人______。" },
        { ch: "單元二", w: "疾風知勁草", exp: "出自《後漢書·王霸傳》。疾風，猛烈的大風；勁，堅韌。句子的意思是，被猛烈的大風吹襲，才知道草的堅韌。用來比喻在艱苦的環境下，才能考驗人的堅強意志。", l1: "有道是「______」，經過移山一事，大家總算見識到愚公堅毅和不畏艱辛的一面。", l2: "面對公司最嚴重的財務危機，他展現出不屈不撓的精神，真可謂「______」。" },
        { ch: "單元二", w: "行到水窮處,坐看雲起時", exp: "出自王維《終南別業》。全句意思是走到水的盡頭，坐看雲霧的千變萬化。此句多用來勉勵人們遇到困難時，暫時把得失放下。", l1: "有言「______」，這個難題既然不能馬上解決，你不如先休息一段日子，或許會有轉機出現。", l2: "人生陷入低谷時不妨保持平常心，體會「______」的豁達處事態度。" },
        { ch: "單元二", w: "野火燒不盡,春風吹又生", exp: "出自白居易《賦得古原草送別》。全句的意思是野火不能把青草燒殺乾淨，春風一吹它又恢復了生命。比喻不屈不撓、生命力頑強的精神。", l1: "我們上星期才清理花園的野草，今天它們已生根發芽，真是「______」，野草的生命力教人佩服。", l2: "儘管經歷多次挫折，他依然展現出「______」的頑強意志，重新站立起來。" },
        { ch: "單元二", w: "安得廣廈千萬間,大庇天下寒士俱歡顏,風雨不動安如山!", exp: "出自杜甫《茅屋為秋風所破歌》。這首詩寫杜甫居住的草堂被狂風大雨摧毀，杜甫面對困境，不只是想到自己的難處，還顧念其他生活困苦的人們，發出期望，表現了他推己及人的可貴精神。", l1: "這間餐廳近日面臨經營困難，但店主堅持每天派發免費飯盒給基層市民，真有「______」的精神。", l2: "社工們致力於為無家可歸者尋找庇護所，體現了「______」的人道關懷。" },
        { ch: "單元二", w: "春風又綠江南岸,明月何時照我還", exp: "出自王安石《泊船瓜洲》。描繪春風再度吹綠江南兩岸的生機景色，並藉著明月寄託對家鄉的濃厚思念與歸心似箭的情懷。", l1: "遠赴外地求學的他，每逢中秋夜仰望明月，心中總會浮現「______」的思鄉之情。", l2: "王安石的名句「______」巧妙運用「綠」字，把江南春景與歸鄉情懷表現得極為生動。" },

        // 校本價值教育名句
        { ch: "校本價值教育", w: "風聲雨聲讀書聲,聲聲入耳;家事國事天下事,事事關心", exp: "顧憲成《題東林書院》。細聽四周的風聲、雨聲和讀書聲，把不同聲音都聽進耳裏；要關心家事、國事和天下事，把這些事情都放在心上。提醒我們在做好本分時也要關懷社會與國家。", l1: "顧憲成名句「______」提醒我們，學生除了求取知識，更要主動關心社會與國家發展。", l2: "作為青年學者，不能只窩在實驗室裡做研究，應秉持「______」的精神，將所學投入解決氣候變遷等全球議題。" },
        { ch: "校本價值教育", w: "過則勿憚改", exp: "《論語．學而》。有過錯不要怕改正。知錯能改並在錯誤中學習，是對自己負責任的表現。", l1: "古語云「______」，當我們發現自己的決定有偏差時，應勇於承認並及時糾正。", l2: "做錯事並不可怕，重要的是抱持「______」的態度，主動承擔責任並改進自我。" },
        { ch: "校本價值教育", w: "明日復明日,明日何其多!我生待明日,萬事成蹉跎", exp: "錢福《明日歌》。明天之後還有明天，如果一生甚麼事情都等待明天才去做，結果只會一事無成，虛度光陰。", l1: "錢福在《明日歌》中寫道「______」，告誡我們要把握當下，切勿拖延時間。", l2: "如果你總是把今天該完成的功課拖延到明天，恐怕很快就會體會到「______」的遺憾了。" },
        { ch: "校本價值教育", w: "君子用世,隨大隨小,皆全力赴之", exp: "魏源《默觚．治篇》。君子做事積極投入，所做的事情無論是大事還是小事，都會竭盡全力，做到最好。", l1: "魏源強調「______」，無論我們在團隊中擔任什麼角色，都應全情投入完成任務。", l2: "即便只是一次小型的班級打掃，我們也應展現「______」的精神，認真把每個角落清理乾淨。" },
        { ch: "校本價值教育", w: "君子素其位而行,不願乎其外", exp: "《中庸》。君子安分守己，按照自己的本分行事，不貪圖本分以外的名利。指明白自身角色並勇於承擔相應職責。", l1: "古人主張「______」，意思是我們應該腳踏實地做好眼前的本分工作，不盲目追求虛名。", l2: "在團隊合作中，每個人若能「______」，各司其職、互相配合，整個團隊就能發揮最大效益。" },
        { ch: "校本價值教育", w: "律己足以服人,量寬足以得人,身先足以率人", exp: "林逋《省心錄》。嚴格要求自己能使人信服，肚量寬闊能贏得人心，身先士卒就能率領人。強調以身作則、樹立榜樣。", l1: "林逋在《省心錄》提到「______」，說明優秀的領導者必須以身作則並展現包容心。", l2: "身為班長，他深知「______」的道理，因此每次做志工服務時總是第一個到場，深得同學們信服。" },
        { ch: "校本價值教育", w: "士不可以不弘毅,任重而道遠", exp: "《論語．泰伯》。讀書人不可以沒有寬大的志向和堅忍的毅力，因為他們的責任重大，要走的路也漫長而遙遠。", l1: "《論語》有云「______」，青年人應樹立遠大志向，不怕艱辛地為社會進步作出貢獻。", l2: "面對改善貧困與環保等全球性難題，社會學家們秉持「______」的精神，持續投入研究與救援行動。" },
        { ch: "校本價值教育", w: "天時不如地利,地利不如人和", exp: "《孟子．公孫丑下》。佔有利的時機不如佔地理優勢，佔地理優勢又不如人心所向，上下團結。", l1: "孟子說「______」，這說明了團隊團結一致、人心所向才是取得成功的最關鍵要素。", l2: "雖然我們在設備和資源上不如對方，但只要全隊凝聚力強，古人說「______」，我們依然有機會勝出。" },
        { ch: "校本價值教育", w: "二人同心,其利斷金;同心之言,其臭如蘭", exp: "《周易．繫辭上》。二人同心協力，其銳利的程度可以截斷堅硬的金屬；同心同德的人發表一致的意見，容易讓人接受。", l1: "《周易》中「______」這句名言，生動地詮釋了夥伴之間心手相連、團結合作的巨大力量。", l2: "只要我們這個專案小組能團結互信，「______」，就沒有解決不了的難題。" },

        // ==================== EXAM 必考範圍 (~DEC) ====================
        // 單元三：《愛蓮說》
        { ch: "單元三《愛蓮說》", w: "不蔓不枝", exp: "蓮花的莖不纏繞著外物生長，不長出旁枝。後用來比喻文章簡潔流暢。", l1: "蓮花「中通外直，______」，象徵君子正直的品格。", l2: "這篇文章筆觸簡潔，______，感情自然真摯，難怪能奪得徵文比賽冠軍。" },
        { ch: "單元三《愛蓮說》", w: "高風亮節", exp: "高風，高尚的品格。亮節，堅貞的氣節和操守。形容品格高尚，節操堅貞。", l1: "形容品格高尚、節操堅貞的人，可用成語「______」。", l2: "歷史上許多______的英雄，即使面對嚴酷考驗，依然堅守原則，至今仍受人敬仰。" },
        { ch: "單元三《愛蓮說》", w: "明哲保身", exp: "原指明智的人能遠離危險，保全自己。後形容為了個人的安全或利益，不堅持原則的處世態度。", l1: "指明智的人能遠離危險，保全自己；後多指避開衝突的處世態度，稱為「______」。", l2: "班長這次犯錯連累卓賢，你卻勸我保全個人利益、避免惹事，要我______，我實在辦不到！" },
        { ch: "單元三《愛蓮說》", w: "隨波逐流", exp: "比喻沒有主見或堅定的立場，受到外界的影響，隨大多數人行動。", l1: "如果不不想被別人牽著鼻子走，做人必須要有主見，不要______。", l2: "她只會______，常常跟隨潮流買一些根本不適合自己的衣服。" },
        { ch: "單元三《愛蓮說》", w: "同流合污", exp: "流，流俗。污，污濁的世風。指言行跟污濁的世風相合，比喻跟隨壞人一起幹壞事。", l1: "比喻跟隨壞人一起幹壞事，稱為「______」。", l2: "你不要再遊說我，我絕不會和你______，捏造遲到的藉口。" },
        { ch: "單元三《愛蓮說》", w: "附庸風雅", exp: "形容缺乏文化修養的人，故意裝成文雅、有風度地從事有關文化的活動。", l1: "缺乏文化修養卻故意裝成文雅、從事文化活動，稱為「______」。", l2: "他根本不懂得欣賞藝術品，這次攜同太太出席藝術展覽，只是______。" },
        { ch: "單元三《愛蓮說》", w: "利慾薰心", exp: "貪圖名利和私慾蒙蔽了心智。", l1: "貪圖名利和私慾蒙蔽了心智，稱為「______」。", l2: "他自從賺取巨額利益後，開始被名利蒙蔽心智，______，漸漸變成一個惟利是圖的人。" },
        { ch: "單元三《愛蓮說》", w: "惟利是圖", exp: "只要有利益可圖，什麼事都幹得出來。", l1: "一心只追求利益，其他一概不顧，稱為「______」。", l2: "做商人要講求誠信與社會責任，不能做一個______的人。" },
        { ch: "單元三《愛蓮說》", w: "身正不怕影子斜", exp: "比喻為人正直，就不怕別人在背後誹謗或中傷。", l1: "只要我們行為光明磊落，所謂「______」，何必理會外界的流言蜚語？", l2: "面對不實的指控，他泰然處之，深信「______」，時間終會證明清白。" },
        { ch: "單元三《愛蓮說》", w: "寧為玉碎,不作瓦全", exp: "寧可做玉器被打碎，也不做完整的瓦片。比喻寧願為正義犧牲，也不願屈辱苟全。", l1: "比喻寧願為正義或氣節而死，也不願屈辱苟全的名句是「______」。", l2: "面對敵人的脅迫與嚴刑拷打，革命烈士們展現出「______」的高尚氣節。" },
        { ch: "單元三《愛蓮說》", w: "出淤泥而不染", exp: "意思是蓮花從池塘底沉積的污泥中長出來，卻不受沾染。比喻人不受不良環境影響，保持高潔操守。", l1: "周敦頤在《愛蓮說》中讚美蓮花「______」，代表君子身處濁世仍保持高潔。", l2: "在社會這個大染缸中，我們必須要有堅定的意志，拒絕不良誘惑，做到「______」。" },

        // 單元三：《陋室銘》
        { ch: "單元三《陋室銘》", w: "案牘勞形", exp: "案牘，官府公文。案牘勞形，指繁重的文書工作，使身心極為疲倦。", l1: "劉禹錫寫「無絲竹之亂耳，無______」，形容官務繁忙使人疲憊。", l2: "叔叔只顧工作，長期______，缺乏休息，身體終於響起了警號。" },
        { ch: "單元三《陋室銘》", w: "深居簡出", exp: "居住在偏僻的地方，很少出門。形容常常留在家中，甚少外出。", l1: "長期留在居所，極少公開露面或出外交往，稱為「______」。", l2: "他交遊廣闊，每天與朋友吃喝玩樂，生活多姿多彩，最近卻突然______，不知發生了甚麼事。" },
        { ch: "單元三《陋室銘》", w: "德高望重", exp: "品德高尚，在社會上享有很高的聲望。多用來稱頌年長的人士。", l1: "品德高尚，享有極高聲譽，常用以尊稱年長長者，稱為「______」。", l2: "張老先生向來熱心公益，______，深受同學們和老師尊重，所以校長才會邀請他擔任致辭嘉賓。" },
        { ch: "單元三《陋室銘》", w: "閒情逸致", exp: "悠閒的心情、輕鬆安逸的情趣。", l1: "悠閒安逸的心態與雅致的情趣，稱為「______」。", l2: "姨母只是患了小病，她卻整天憂心忡忡，實在談不上甚麼______。" },
        { ch: "單元三《陋室銘》", w: "芝蘭之室", exp: "出自《孔子家語》，比喻良好的環境，或與品格高尚的人相處。", l1: "比喻良好的薰陶環境或高尚人士聚居之所，稱為「______」。", l2: "與品德高尚的人交往，猶如進入______，久而久之身心也會受到良好滋養。" },
        { ch: "單元三《陋室銘》", w: "擇善固執", exp: "選擇好的、正確的，堅持不變。", l1: "選擇正確的道理或目標並堅持到底，稱為「______」。", l2: "哥哥在許多事情上都不肯妥協，大家都說他冥頑不靈，其實哥哥是______，只是別人不了解他。" },
        { ch: "單元三《陋室銘》", w: "玩世不恭", exp: "用嬉戲、不嚴肅的態度來對待生活。", l1: "對待人生或事業態度輕浮、不認真，稱為「______」。", l2: "舅父一直笑裏藏刀，每次外公問他何時才認真工作時，他的回答總是模稜兩可，態度______。" },
        { ch: "單元三《陋室銘》", w: "庸人自擾", exp: "平凡的人沒事找事，自尋煩惱。", l1: "自己找事折磨自己，無端產生的煩惱稱為「______」。", l2: "事情根本沒有你想得那麼糟糕，你整天胡思亂想，不過是______罷了。" },
        { ch: "單元三《陋室銘》", w: "聲名狼藉", exp: "形容名聲極壞、非常惡劣，名譽掃地。", l1: "形容名譽極為惡劣、名聲掃地，稱為「______」。", l2: "他自從染上不良嗜好後，經常向親友借錢不還，弄得______。" },
        { ch: "單元三《陋室銘》", w: "大智若愚", exp: "形容真正聰明、有學問的人，看起來很愚笨、不顯山露水。", l1: "外表看似平庸無奇，實則懷有大智慧的人，稱為「______」。", l2: "別看他呆呆的，當大家苦惱時，他總能提出有效的解決方法，實在是______。" },
        { ch: "單元三《陋室銘》", w: "學富五車", exp: "五車，指五車書。形容讀書很多，學識淵博。", l1: "形容人博覽群書、學問極為淵博，稱為「______」。", l2: "大家都稱他為「活字典」，因為他______，我們有甚麼問題都會請教他。" },
        { ch: "單元三《陋室銘》", w: "君子矜而不爭,群而不黨", exp: "出自《論語》。意思是君子莊重而不與人爭鬥；合群而不結黨營私。", l1: "《論語》指出君子為人的態度是「______」。", l2: "張老師常教育我們，與人相處要謙和合群，做到「______」，切勿結黨營私。" },
        { ch: "單元三《陋室銘》", w: "山不在高,有仙則名。水不在深,有龍則靈", exp: "出自劉禹錫《陋室銘》。說明名聲、靈氣都不在外觀而在於內涵，表達個人品質修養更為重要。", l1: "《陋室銘》開篇名句是「______」，強調內涵重於外在。" , l2: "這家小書店雖然隱蔽，但藏書豐富且氣氛極佳，正如「______」，吸引許多文人墨客前來。" },

        // 單元四：詞兩首《虞美人》、《水調歌頭》
        { ch: "單元四《詞兩首》", w: "不堪回首", exp: "形容人因回憶過去不好、不快樂的事情而痛苦，所以不忍回顧。", l1: "李煜《虞美人》：「小樓昨夜又東風，故國______月中。」", l2: "每個人的成功背後，往往有著刻苦奮鬥、不忍回顧的辛酸經歷與______歲月。" },
        { ch: "單元四《詞兩首》", w: "歷歷在目", exp: "歷歷，清楚、分明。形容對過去的事情印象深刻，彷彿清楚地重現眼前。", l1: "過去的事情或景象清晰呈現眼前，稱為「______」。", l2: "爸爸昔日冒雨趕到學校為我送上外套的情景，現在回想起來，仍______。" },
        { ch: "單元四《詞兩首》", w: "樂不思蜀", exp: "本指蜀後主劉禪投降魏國後快樂得不想念蜀國。後形容人因為在異地生活太快樂而不想返鄉。", l1: "劉禪在魏國回答「此間樂，不思蜀」，衍生出成語「______」。", l2: "他到了國外留學後，那裡生活豐富多彩，讓他玩得______，連家都不想回了。" },
        { ch: "單元四《詞兩首》", w: "人面桃花", exp: "出自崔護《題都城南莊》，形容景色依舊，人和事已有不同，表達懷念感傷。", l1: "形容景物依舊而人事已非的感傷狀況，稱為「______」。", l2: "我重返小學校園，看著四周熟悉的景物，想起昔日的人事已不見蹤影，不禁興起______的感歎。" },
        { ch: "單元四《詞兩首》", w: "愁眉不展", exp: "因憂愁而令眉毛不能舒張，形容憂愁到了極點。", l1: "雙眉緊鎖，無法舒展，形容極度憂慮不安，稱為「______」。", l2: "歌迷得知偶像在車禍中昏迷，都非常憂愁，紛紛______地趕到醫院外等候消息。" },
        { ch: "單元四《詞兩首》", w: "天各一方", exp: "形容人們分離後各居一地，相隔遙遠。", l1: "親友或戀人分隔兩地、相距遙遠，稱為「______」。", l2: "這對母子在一次戰亂中失散，自此分隔遙遠的兩地，______，直至多年後才能重逢。" },
        { ch: "單元四《詞兩首》", w: "一日三秋", exp: "出自《詩經》。形容分別時間雖短，但感覺漫長，比喻思念心切。", l1: "形容對人思念極為切迫，一日不見如隔三年的成語是「______」。", l2: "爸爸前往歐洲公幹，與我和媽媽分隔兩地已有半年了，感覺如度過了非常漫長的時間，真是______。" },
        { ch: "單元四《詞兩首》", w: "瓊樓玉宇", exp: "瓊，美玉。形容用美玉築成或精美華麗的樓閣殿宇。", l1: "蘇軾《水調歌頭》：「我欲乘風歸去，又恐______，高處不勝寒。」", l2: "這座古城從前到處都是建築精美的______，但因為日久失修，這些建築已變得殘破不堪。" },
        { ch: "單元四《詞兩首》", w: "悲歡離合", exp: "悲傷、歡樂、離散和團聚；泛指生活中各種經歷與感悟。", l1: "蘇軾《水調歌頭》：「人有______，月有陰晴圓缺，此事古難全。」", l2: "人生路上充滿了無數______，經歷過風霜後，大家才更懂得珍惜當下的相聚。" },
        { ch: "單元四《詞兩首》", w: "日中則昃,月盈則食", exp: "出自《易經》。太陽到了正中便向西斜，月亮圓滿後就開始虧缺，比喻事物發展到頂點就會走向反面。", l1: "說明世事盛極必衰、循環往復的名句是「______」。", l2: "今日我們的形勢雖然惡劣，但我相信「______」，我們之後必定會有光明的前景。" },
        { ch: "單元四《詞兩首》", w: "高處不勝寒", exp: "後比喻人因位高權重或擁有極高技藝，身居高位而感到孤單寂寞。", l1: "蘇軾《水調歌頭》：「我欲乘風歸去，又恐瓊樓玉宇，______。」", l2: "陳師傅的武術出神入化，卻一直找不到旗鼓相當的對手，可謂「______」。" },
        { ch: "單元四《詞兩首》", w: "天下無不散之筵席", exp: "指人不能永遠團聚，團聚後的分離是不可避免的。", l1: "表達世間聚散無常、分離不可避免的名句是「______」。", l2: "所謂「相聚後一定有離別」，只要想到我們共度的美好時光，離別也不只是剩傷感了，畢竟「______」。" },

        // 單元四：曲兩首《天淨沙·秋思》、《四塊玉·閒適》
        { ch: "單元四《曲兩首》", w: "一葉知秋", exp: "看見一片落葉就知道秋天到來。比喻從事物的微細跡象看出發展趨勢。", l1: "通過微小跡象預見事物整體趨勢，稱為「______」。", l2: "正所謂「______」，我從她日常的言行舉止，已預知她有今日的下場。" },
        { ch: "單元四《曲兩首》", w: "橙黃橘綠", exp: "出自蘇軾詩句，指代秋冬之交、豐收美好的時節景致。", l1: "描寫秋冬之際橘黃橙熟美好風光的成語是「______」。", l2: "秋風漸起，大地呈現出一派______的豐收景象，景色令人賞心悅目。" },
        { ch: "單元四《曲兩首》", w: "萍蹤浪跡", exp: "比喻人像浮萍、波浪般漂泊不定，居無定所。", l1: "比喻到處漂泊、四處為家的人生狀態，稱為「______」。", l2: "唐叔叔年輕時因為戰亂家破人亡，自此過着______的生活，直至中年時才在香城安定下來。" },
        { ch: "單元四《曲兩首》", w: "閒雲野鶴", exp: "比喻生活閒散或來去自如、無所羈絆的人。", l1: "形容來去自如、不受世俗約束的隱逸之人，稱為「______」。", l2: "哥哥大學畢業後，像______到處遊歷，在家的日子寥寥可數。" },
        { ch: "單元四《曲兩首》", w: "日薄西山", exp: "太陽快要落山。比喻人或事物已經衰敗，接近死亡。", l1: "比喻生命、勢力或事物走向衰亡沒落，稱為「______」。", l2: "這位老伯伯已______，只求有生之年能與外地的子孫團聚。" },
        { ch: "單元四《曲兩首》", w: "大快朵頤", exp: "朵，動；頤，面頰。形容張口大嚼，愉悅地享受美食。", l1: "痛快盡情地品嚐享受珍饈美味，稱為「______」。", l2: "這間餐廳的食物不單選擇多，而且非常美味，我保證能讓你們______。" },
        { ch: "單元四《曲兩首》", w: "觥籌交錯", exp: "觥，酒器；籌，酒令籌碼。形容酒席宴會上熱鬧歡樂的場面。", l1: "酒杯與酒籌錯雜交織，形容宴會歡飲熱鬧，稱為「______」。", l2: "我們自大學畢業以後便沒有見面，今晚難得聚首一堂，大家在______之間訴說這幾年的經歷。" },
        { ch: "單元四《曲兩首》", w: "其樂融融", exp: "形容快樂、歡樂和睦的場面。", l1: "形容大家相處極其和睦、歡樂融融，稱為「______」。", l2: "全家人圍坐在飯桌前吃團年飯，談笑風生，場面______。" },
        { ch: "單元四《曲兩首》", w: "父母在,不遠遊,遊必有方", exp: "出自《論語》。父母在世時不輕易遠行，如有遠行必須告知去處，是孝順的體現。", l1: "《論語》中告誡子女出門遠行要讓父母安心的名句是「______」。", l2: "修端堅信「______」的說法，所以他每次跟父母旅遊，都會細心安排行程，打點一切。" },
        { ch: "單元四《曲兩首》", w: "酒逢知己千杯少,話不投機半句多", exp: "指意氣相投的人暢飲談心嫌時間短，不投契的人多說半句也嫌多。", l1: "說明知音難得、交友貴在知心的名句是「______」。", l2: "所謂「______」，難得碰上志同道合的朋友，我們今晚非要暢談通宵不可！" }
    ];

    let currentCh = '', activeSet = [], qIdx = 0, score = 0, level = 1, sndOn = true;

    function speak(txt) { 
        if (!window.speechSynthesis || !sndOn) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'zh-HK'; msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }

    function toggleGlobalSnd() { 
        sndOn = !sndOn; 
        document.getElementById('snd-btn').innerText = sndOn ? "🔊" : "🔈"; 
        if(!sndOn && window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function showScreen(id) { 
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden')); 
        document.getElementById(id).classList.remove('hidden'); 
    }

    function openChapterMenu(ch) { 
        currentCh = ch; 
        document.getElementById('chapter-title').innerText = ch; 
        showScreen('sc-level'); 
    }

    function confirmExit() { 
        if(confirm("確定要放棄並回到主頁？")) showScreen('sc-cover'); 
    }

    function showLevel0() {
        const box = document.getElementById('l0-content');
        box.innerHTML = `<h3 style="text-align:center; color: var(--primary);">${currentCh} 溫習清單</h3>`;
        bank.filter(i => i.ch === currentCh).forEach((i, idx) => {
            const d = document.createElement('div');
            d.className = "list-item";
            const charBtns = i.w.split('').map(char => `<button class="char-btn" onclick="speak('${char}')">${char}</button>`).join('');
            d.innerHTML = `
                <div class="word-row"><b>${idx+1}.</b> ${charBtns} <button class="speak-btn" style="margin-left:auto" onclick="speak('${i.w}')">🔊</button></div>
                <div class="exp-text">【意思】：${i.exp}</div>
                <div class="ex-text">【例句】：${i.l2}</div>
            `;
            box.appendChild(d);
        });
        showScreen('sc-l0-list');
    }

    function startGame(lv) {
        level = lv; qIdx = 0; score = 0;
        activeSet = bank.filter(i => i.ch === currentCh).sort(() => Math.random() - 0.5);
        showScreen('sc-game');
        
        const qCard = document.getElementById('q-card');
        const qHint = document.getElementById('q-hint');
        if (lv === 4) {
            qCard.style.background = "#1c1c1e";
            document.getElementById('q-text').style.color = "#ffffff";
            document.getElementById('q-text').innerText = "🏆 聽音默寫模式 - 請點擊下方的按鈕聽音";
            qHint.innerText = "🔇 無字提示模式";
        } else {
            qCard.style.background = "var(--card)";
            document.getElementById('q-text').style.color = "#000000";
        }
        loadNextQ();
    }

    function loadNextQ() {
        if(qIdx >= activeSet.length) { finishGame(); return; }
        const q = activeSet[qIdx];
        document.getElementById('game-info').innerText = `題目 ${qIdx + 1} / ${activeSet.length}`;
        
        if (level === 4) {
            speak("請默寫：" + q.w);
        } else {
            const qText = (level === 2) ? q.l2 : q.l1;
            document.getElementById('q-text').innerText = qText;
            
            let h = q.w.split('').map(c => (Math.random() > 0.8 || ",，。·;；!！".includes(c)) ? c : "□");
            document.getElementById('q-hint').innerText = h.join('');
        }
        
        document.getElementById('ans-in').value = "";
        document.getElementById('fb-area').innerText = "";
        document.getElementById('action-area').classList.add('hidden');
        document.getElementById('submit-btn').classList.remove('hidden');
        document.getElementById('ans-in').focus();
    }

    function speakCurrentQ() {
        const q = activeSet[qIdx];
        if (level === 4) { 
            speak(q.w); 
        } else { 
            const qText = (level === 2) ? q.l2 : q.l1;
            speak(qText.replace('______', q.w)); 
        }
    }

    function checkAnswer() {
        const u = document.getElementById('ans-in').value.trim();
        const c = activeSet[qIdx].w;
        const fb = document.getElementById('fb-area');
        if(u === c) {
            score++; fb.style.color = "var(--success)"; fb.innerText = "正確！✓";
            speak("答對了。答案是" + c);
            setTimeout(() => { qIdx++; loadNextQ(); }, 1200);
        } else {
            fb.style.color = "var(--error)"; fb.innerText = `答錯了。正確答案：${c}`;
            speak("答錯了。正確答案是" + c);
            document.getElementById('submit-btn').classList.add('hidden');
            document.getElementById('action-area').classList.remove('hidden');
        }
    }

    function nextQuestion() { qIdx++; loadNextQ(); }

    function finishGame() {
        document.getElementById('res-score').innerText = `${score} / ${activeSet.length}`;
        document.getElementById('res-msg').innerText = score === activeSet.length ? "太強了！測考必勝！" : "再多溫習一下 Level 2 與 Level 4 吧！";
        showScreen('sc-res');
    }
    
    document.getElementById('ans-in').addEventListener('keypress', e => { if(e.key==='Enter') checkAnswer(); });
</script>
</body>
</html>
