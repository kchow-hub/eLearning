<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G3 音樂欣賞溫習</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff5f8 0%, #ffeef2 100%);
            --card-bg: #ffffff;
            --primary-color: #ff69b4;
            --primary-hover: #ff1493;
            --primary-light: #fff0f5;
            --text-color: #2c3e50;
            --sub-text: #7f8c8d;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
            --yt-red: #FF0000;
            --baroque-gold: #d4af37;
            --accent-purple: #9b59b6;
            --accent-orange: #e67e22;
        }
        .boy-theme {
            --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            --primary-color: #1976d2;
            --primary-hover: #0d47a1;
            --primary-light: #e8f0fe;
        }
        * { box-sizing: border-box; font-family: 'PingFang HK', 'Microsoft JhengHei', 'Heiti TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); color: var(--text-color); margin: 0; padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
        .game-container { width: 100%; max-width: 580px; text-align: center; }
        h1 { font-size: 22px; color: var(--primary-color); margin: 10px 0 15px; }
        .ui-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: left; }
        button { font-size: inherit; }

        .setup-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        input[type="text"] { width: 130px; padding: 6px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-weight: bold; font-size: 15px; }
        .theme-btn { padding: 5px 12px; border-radius: 12px; border: none; cursor: pointer; background: #eee; color: #4a4a4a; }
        .theme-btn.active { background: var(--primary-color); color: white; }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .menu-item-box { background: white; border-radius: 15px; margin-bottom: 12px; display: flex; overflow: hidden; }
        .menu-content { flex: 1; padding: 15px; cursor: pointer; text-align: left; }
        .menu-content:active { filter: brightness(0.96); }
        .yt-btn { width: 60px; background: var(--yt-red); display: flex; justify-content: center; align-items: center; color: white; font-size: 20px; text-decoration: none; }
        .menu-btn-title { font-size: 16px; font-weight: bold; display: block; }
        .menu-btn-sub { font-size: 12px; margin-top: 4px; display: block; font-weight: bold; }

        .header-box { font-size: 12px; color: var(--sub-text); border-bottom: 2px solid var(--primary-light); padding-bottom: 10px; margin-bottom: 12px; line-height: 1.4; font-weight: bold; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0; transition: width .3s; }
        .question-box { font-size: 18px; font-weight: bold; line-height: 1.6; padding: 15px; border-left: 5px solid var(--primary-color); background: #fafafa; margin-bottom: 15px; border-radius: 0 12px 12px 0; white-space: pre-line; }

        .q-img-box { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 15px; border: 1px solid #eee; }
        .q-img-box img { max-width: 100%; max-height: 220px; object-fit: contain; border-radius: 8px; cursor: zoom-in; min-width: 0; }
        .q-img-box.multi img { max-width: calc(50% - 5px); }
        .zoom-tip { font-size: 11px; color: var(--sub-text); text-align: center; margin: -10px 0 12px; }

        .option-btn { width: 100%; background: white; border: 2px solid #eee; border-radius: 12px; padding: 14px; margin-bottom: 8px; font-weight: bold; cursor: pointer; font-size: 16px; text-align: left; color: var(--text-color); transition: transform .1s; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { border-color: var(--correct-color); background: #e8f8f5; color: var(--correct-color); transform: scale(1.01); }
        .option-btn.wrong { border-color: var(--wrong-color); background: #fdedec; color: var(--wrong-color); }
        .img-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
        .img-options .option-btn { margin: 0; padding: 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .img-options img { width: 100%; height: 170px; object-fit: contain; }

        .feedback { display: none; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 15px; line-height: 1.5; text-align: left; }
        .feedback.good { background: #e8f8f5; border-left: 4px solid var(--correct-color); }
        .feedback.bad { background: #fff0f0; border-left: 4px solid var(--wrong-color); }
        .feedback .why { display: block; margin-top: 6px; color: #555; font-size: 14px; }

        .btn-row { display: flex; gap: 8px; }
        .icon-btn { background:#95a5a6; color:white; border:none; border-radius:12px; width:50px; cursor:pointer; font-size: 20px; display: flex; justify-content: center; align-items: center; }
        .main-btn { flex: 1; background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 13px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .main-btn:disabled { opacity: .45; cursor: default; }

        .history-item { display: grid; grid-template-columns: 0.7fr 0.9fr 1.6fr 0.7fr 0.4fr; gap: 4px; padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-size: 12px; align-items: center; }
        .review-item { text-align: left; border-bottom: 1px dashed #eee; padding: 8px 0; font-size: 14px; line-height: 1.5; }
        .review-item b { color: var(--correct-color); }
        .hidden { display: none !important; }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; justify-content: center; align-items: center; padding: 10px; z-index: 10; cursor: zoom-out; }
        #lightbox img { max-width: 100%; max-height: 100%; background: white; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 主選單 -->
        <div id="main-menu">
            <h1>🎼 G3 音樂欣賞溫習 🎻</h1>

            <div class="ui-card">
                <div class="setup-row">
                    <label for="name-input">👤 學生姓名：</label>
                    <input type="text" id="name-input" maxlength="12" value="G3 學生" oninput="updateName()">
                </div>
                <div class="setup-row">
                    <span>🎭 界面主題：</span>
                    <div style="display:flex; gap:5px;">
                        <button class="theme-btn" onclick="setTheme('girl')" id="girl-btn">🧸 粉紅</button>
                        <button class="theme-btn" onclick="setTheme('boy')" id="boy-btn">🚗 藍色</button>
                    </div>
                </div>
                <div class="setup-row" style="margin:5px 0 0;">
                    <span>📢 自動朗讀題目：</span>
                    <label class="switch">
                        <input type="checkbox" id="auto-read-toggle" onchange="saveAutoRead()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid var(--baroque-gold);">
                <div class="menu-content" onclick="startLesson('lesson1')" style="background: #fffdf5;">
                    <span class="menu-btn-title" style="color:#b38f00">🏰 第一課：巴洛克時期的音樂特色 (<span id="count-lesson1"></span> 題)</span>
                    <span class="menu-btn-sub" style="color:#8a6d00;">語源、藝術風格、四大音樂特色、三大作曲家、金句</span>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid var(--accent-orange);">
                <div class="menu-content" onclick="startLesson('lesson2')" style="background: #fffbf5;">
                    <span class="menu-btn-title" style="color:var(--accent-orange)">🌸 第二課：《四季協奏曲‧春天》(<span id="count-lesson2"></span> 題)</span>
                    <span class="menu-btn-sub" style="color:#d35400;">韋瓦第生平、獨奏協奏曲、音樂與詩、閱譜、唱名、金句</span>
                </div>
                <a href="https://www.youtube.com/watch?v=kPaUtnJTMn8&t=53s" target="_blank" rel="noopener" class="yt-btn" title="聽《春天》第一樂章">▶️</a>
            </div>

            <div class="menu-item-box" style="border: 2px solid var(--accent-purple);">
                <div class="menu-content" onclick="startLesson('mock')" style="background: #faf5ff;">
                    <span class="menu-btn-title" style="color:var(--accent-purple)">🎯 模擬測驗：兩課隨機抽 <span id="count-mock"></span> 題</span>
                    <span class="menu-btn-sub" style="color:#8e44ad;">每次題目都不同，挑戰滿分！</span>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid #16a085;">
                <div class="menu-content" onclick="startLesson('all')" style="background: #f2fbf9;">
                    <span class="menu-btn-title" style="color:#16a085">📚 全部題目大挑戰 (<span id="count-all"></span> 題)</span>
                    <span class="menu-btn-sub" style="color:#0e6655;">考試前一晚做一次，全部重溫！</span>
                </div>
            </div>

            <div class="ui-card">
                <div style="font-size:13px; font-weight:bold; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                    <span>📊 溫習紀錄 (日期 | 姓名 | 課題 | 得分)</span>
                    <button onclick="clearHistory()" style="color:red; background:none; border:none; cursor:pointer;" title="清除紀錄">🗑️</button>
                </div>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- 遊戲介面 -->
        <div id="game-play" class="hidden ui-card">
            <div id="lesson-header" class="header-box"></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px; font-weight:bold;">
                <span id="progress-text">0 / 0</span>
                <div style="color:#f39c12">⭐ <span id="star-count">0</span></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

            <div id="image-area" class="q-img-box hidden"></div>
            <div id="zoom-tip" class="zoom-tip hidden">🔍 點擊圖片可以放大</div>

            <div class="question-box" id="question-text"></div>
            <div id="options-grid"></div>
            <div id="feedback" class="feedback"></div>
            <div class="btn-row">
                <button class="icon-btn" onclick="goBack()" title="返回主頁">🏠</button>
                <button class="icon-btn" onclick="speakCurrent()" style="background:#f39c12;" title="朗讀題目">📢</button>
                <button id="next-btn" class="main-btn" onclick="nextQuestion()" disabled>下一題 👉</button>
            </div>
        </div>

        <!-- 結算 -->
        <div id="game-over" class="hidden ui-card" style="text-align:center;">
            <div id="medal-emoji" style="font-size:60px;">🏆</div>
            <h2 id="medal-title" style="margin:8px 0;"></h2>
            <p id="medal-msg" style="color:var(--sub-text); margin-top:0;"></p>
            <div id="review-box" class="hidden" style="margin-bottom:15px;">
                <div style="font-weight:bold; text-align:left; margin-bottom:4px;">📝 要再溫習的題目：</div>
                <div id="review-list"></div>
            </div>
            <div class="btn-row" style="flex-direction:column;">
                <button id="retry-btn" class="main-btn hidden" onclick="retryWrong()" style="background:#e67e22;">🔁 重做答錯的題目</button>
                <button class="main-btn" onclick="goBack()">返回主選單</button>
            </div>
        </div>
    </div>

    <div id="lightbox" class="hidden" onclick="this.classList.add('hidden')"><img id="lightbox-img" alt=""></div>

<script>
    // 題庫：根據 2026-27 G3 MUA 第一、二課工作紙 (答案版) 整理
    // q 題目 | options 選項 (第一個不一定是答案，會隨機排列) | ans 正確答案 | img 圖片 | why 答完後顯示的工作紙重點
    // 圖片選項題：options 為 [{ img, label }]，ans 填 label
    const questionBank = {
        lesson1: {
            header: "【第一課：巴洛克時期的音樂特色】 Baroque Period (1600-1750)",
            title: "第一課：巴洛克音樂特色",
            questions: [
                { q: "「巴洛克時期」是哪一段時間？", options: ["1600 – 1750 年", "1750 – 1820 年", "1820 – 1900 年"], ans: "1600 – 1750 年",
                  img: "G3A_MUA_images/baroque-church.jpg", why: "巴洛克時期 Baroque Period (1600-1750)" },
                { q: "「巴洛克」(Baroque) 一詞源於哪一種語言？", options: ["葡萄牙文 (Barroco)", "意大利文", "德文"], ans: "葡萄牙文 (Barroco)",
                  why: "巴洛克 (Baroque) 源於葡萄牙文 Barroco。" },
                { q: "葡萄牙文「Barroco」原本的意思是甚麼？", options: ["形狀不規則的珍珠", "完美無瑕的寶石", "金光閃閃的皇冠"], ans: "形狀不規則的珍珠",
                  why: "Barroco 意思是『形狀不規則的珍珠』，用來形容巴洛克時期的藝術風格。" },
                { q: "巴洛克時期的「建築」(Architecture) 有甚麼特點？", img: "G3A_MUA_images/art-architecture.jpg",
                  options: ["富麗堂皇，極富裝飾", "簡單樸素，沒有裝飾", "線條簡潔，只用玻璃和鋼鐵"], ans: "富麗堂皇，極富裝飾" },
                { q: "巴洛克時期的「繪畫」(Painting) 有甚麼特點？", img: "G3A_MUA_images/art-painting.jpg",
                  options: ["光暗分明，具戲劇化", "顏色平淡，畫面安靜", "只畫簡單的幾何圖形"], ans: "光暗分明，具戲劇化" },
                { q: "巴洛克時期的「雕塑」(Sculpture) 有甚麼特點？", img: "G3A_MUA_images/art-sculpture.jpg",
                  options: ["滿有動感，具戲劇化", "安靜站立，沒有動作", "抽象，看不出是甚麼"], ans: "滿有動感，具戲劇化" },
                { q: "以下哪一幅是巴洛克時期的建築？",
                  options: [{ img: "G3A_MUA_images/quiz-a-church.jpg", label: "A" }, { img: "G3A_MUA_images/quiz-b-rotunda.jpg", label: "B" }], ans: "A",
                  why: "A 富麗堂皇，極富裝飾，是巴洛克建築。" },
                { q: "以下哪一件是巴洛克時期的藝術？",
                  options: [{ img: "G3A_MUA_images/quiz-c-statue.jpg", label: "C" }, { img: "G3A_MUA_images/quiz-d-painting.jpg", label: "D" }], ans: "D",
                  why: "D 光暗分明、滿有動感、具戲劇化，是巴洛克藝術。" },
                { q: "巴洛克音樂在「旋律」(Melody) 方面的特色是？", img: "G3A_MUA_images/score-ornaments.jpg",
                  options: ["大量裝飾音 (ornaments)", "完全沒有裝飾音", "旋律只有一個音"], ans: "大量裝飾音 (ornaments)",
                  why: "樂譜上圈着的 tr 就是裝飾音。" },
                { q: "巴洛克音樂在「節奏」(Rhythm) 方面的特色是？", img: "G3A_MUA_images/score-rhythm.jpg",
                  options: ["節奏模式不斷重覆，有連續不斷的感覺", "節奏忽快忽慢，沒有規律", "每一小節的節奏都不同"], ans: "節奏模式不斷重覆，有連續不斷的感覺" },
                { q: "巴洛克音樂在「力度強弱」(Dynamics) 方面的特色是？", img: "G3A_MUA_images/score-dynamics.jpg",
                  options: ["強音 (forte) 與弱音 (piano) 不斷交替", "聲音慢慢變強，再慢慢變弱", "全首樂曲都是同一個音量"], ans: "強音 (forte) 與弱音 (piano) 不斷交替",
                  why: "強音與弱音不斷交替，形成台階式力度強弱 (terraced dynamics)。" },
                { q: "巴洛克音樂在「配器」(Orchestration) 方面的特色是？", img: "G3A_MUA_images/score-continuo.jpg",
                  options: ["通奏低音 (basso continuo)，以弦樂團為主", "以敲擊樂器為主", "以銅管樂團為主"], ans: "通奏低音 (basso continuo)，以弦樂團為主" },
                { q: "「通奏低音」用甚麼樂器演奏低音部份？", img: ["G3A_MUA_images/harpsichord.jpg", "G3A_MUA_images/cello.jpg"],
                  options: ["鍵盤樂器 (如古鍵琴) 及低音樂器 (如大提琴)", "小號及定音鼓", "長笛及單簧管"], ans: "鍵盤樂器 (如古鍵琴) 及低音樂器 (如大提琴)" },
                { q: "看圖：這位作曲家是誰？", img: "G3A_MUA_images/vivaldi.jpg", options: ["韋瓦第 (Vivaldi)", "巴哈 (Bach)", "韓德爾 (Händel)"], ans: "韋瓦第 (Vivaldi)",
                  why: "韋瓦第手上拿着他最擅長的小提琴。" },
                { q: "看圖：這位作曲家是誰？", img: "G3A_MUA_images/bach.jpg", options: ["巴哈 (Bach)", "韋瓦第 (Vivaldi)", "韓德爾 (Händel)"], ans: "巴哈 (Bach)" },
                { q: "看圖：這位作曲家是誰？", img: "G3A_MUA_images/handel.jpg", options: ["韓德爾 (Händel)", "巴哈 (Bach)", "韋瓦第 (Vivaldi)"], ans: "韓德爾 (Händel)" },
                { q: "被稱為「音樂之父」的作曲家是？", options: ["巴哈 (Bach)", "韓德爾 (Händel)", "韋瓦第 (Vivaldi)"], ans: "巴哈 (Bach)" },
                { q: "被稱為「神劇之父」的作曲家是？", options: ["韓德爾 (Händel)", "巴哈 (Bach)", "韋瓦第 (Vivaldi)"], ans: "韓德爾 (Händel)" },
                { q: "被稱為「紅髮神父」的作曲家是？", options: ["韋瓦第 (Vivaldi)", "巴哈 (Bach)", "韓德爾 (Händel)"], ans: "韋瓦第 (Vivaldi)" },
                { q: "巴哈和韓德爾出生於哪一個國家？", options: ["德國", "意大利", "英國"], ans: "德國",
                  why: "巴哈和韓德爾出生於德國；韋瓦第出生於意大利。" },
                { q: "巴哈和韓德爾創作音樂的目的是甚麼？", options: ["為了榮耀神", "為了賺很多錢", "為了變得出名"], ans: "為了榮耀神",
                  why: "我們也應以榮耀神作為學習音樂的最終目標，並好好裝備自己以音樂事奉神。" },
                { q: "天父的教導：「你們應當彈琴稱謝耶和華，用十弦瑟歌頌祂。應當向祂唱新歌，＿＿＿＿，聲音洪亮。」", options: ["彈得巧妙", "跳得歡樂", "唱得高亢"], ans: "彈得巧妙",
                  why: "詩篇 33:2-3" }
            ]
        },
        lesson2: {
            header: "【第二課：《四季協奏曲‧春天》】 韋瓦第 Antonio Vivaldi (1678-1741)",
            title: "第二課：四季協奏曲‧春天",
            questions: [
                { q: "韋瓦第出生於哪一個國家？", options: ["意大利", "德國", "英國"], ans: "意大利" },
                { q: "韋瓦第是著名的甚麼演奏家？", img: "G3A_MUA_images/violin.jpg", options: ["小提琴", "鋼琴", "長笛"], ans: "小提琴" },
                { q: "韋瓦第因為頭髮的顏色，被稱為甚麼？", options: ["「紅髮神父」", "「音樂之父」", "「神劇之父」"], ans: "「紅髮神父」" },
                { q: "韋瓦第最著名的作品是？", options: ["《四季協奏曲》", "《彌賽亞》", "《水上音樂》"], ans: "《四季協奏曲》",
                  why: "《彌賽亞》和《水上音樂》是韓德爾的作品。" },
                { q: "《四季協奏曲》屬於哪一種樂曲種類？", img: ["G3A_MUA_images/violin.jpg", "G3A_MUA_images/orchestra.jpg"],
                  options: ["獨奏協奏曲", "交響曲", "合唱曲"], ans: "獨奏協奏曲",
                  why: "獨奏協奏曲 ─ 一種獨奏樂器與樂團一起演奏的樂曲。" },
                { q: "《四季協奏曲》由哪一種獨奏樂器與哪一個樂團一起演奏？", options: ["小提琴 + 弦樂團", "長笛 + 管樂團", "大提琴 + 敲擊樂團"], ans: "小提琴 + 弦樂團" },
                { q: "《四季協奏曲》共有多少首？", options: ["四首：春天、夏天、秋天、冬天", "兩首：春天、秋天", "三首：春天、夏天、冬天"], ans: "四首：春天、夏天、秋天、冬天" },
                { q: "《四季協奏曲》每一個季節都配以甚麼？", options: ["一首詩", "一幅畫", "一支舞"], ans: "一首詩",
                  why: "例：《春天》第一樂章詩詞：春臨大地，眾鳥歡唱，和風吹拂，溪流低語……" },
                { q: "第一首《春天》共有三個樂章，速度分別是？", options: ["快 - 慢 - 快", "慢 - 快 - 慢", "快 - 快 - 慢"], ans: "快 - 慢 - 快" },
                { q: "《春天》第一樂章的速度記號是 Allegro，意思是？", img: "G3A_MUA_images/spring-theme.jpg", options: ["快板", "慢板", "中板"], ans: "快板" },
                { q: "樂譜上圈着的「Violino principale」是第一樂章的獨奏樂器。它是甚麼樂器？", img: "G3A_MUA_images/spring-solo-score.jpg",
                  options: ["小提琴", "中提琴", "大提琴"], ans: "小提琴" },
                { q: "《春天》第一樂章的強弱記號是怎樣的？", img: "G3A_MUA_images/spring-theme.jpg",
                  options: ["以強音 (forte) 開始，後轉為弱音 (piano)", "以弱音 (piano) 開始，後轉為強音 (forte)", "由頭到尾都是強音 (forte)"],
                  ans: "以強音 (forte) 開始，後轉為弱音 (piano)" },
                { q: "樂曲用甚麼描繪「眾鳥歡唱」的情景？", img: "G3A_MUA_images/birds.jpg",
                  options: ["裝飾音", "上下移動的旋律線條", "重覆的節奏模式"], ans: "裝飾音" },
                { q: "樂曲用甚麼描繪「溪流流動」的情景？", img: "G3A_MUA_images/stream.jpg",
                  options: ["上下移動的旋律線條", "裝飾音", "重覆的節奏模式"], ans: "上下移動的旋律線條" },
                { q: "樂曲用甚麼描繪「雷鳴和閃電」？", img: "G3A_MUA_images/lightning.jpg",
                  options: ["重覆的節奏模式", "裝飾音", "上下移動的旋律線條"], ans: "重覆的節奏模式" },
                { q: "古鍵琴和大提琴一起演奏低音部份，這叫做甚麼？", img: ["G3A_MUA_images/harpsichord.jpg", "G3A_MUA_images/cello.jpg"],
                  options: ["通奏低音", "獨奏樂器", "弦樂團"], ans: "通奏低音" },
                { q: "樂譜上 X 的部分代表以下哪一個巴洛克時期的音樂特色？", img: "G3A_MUA_images/spring-x-score.jpg",
                  options: ["台階式力度強弱", "複調織體", "大量裝飾音"], ans: "台階式力度強弱",
                  why: "X 的地方由強音 (f) 轉為弱音 (p)。" },
                { q: "樂譜最下方圈着的「Organo (o Cembalo)」部份是甚麼？", img: "G3A_MUA_images/spring-x-score.jpg",
                  options: ["通奏低音", "獨奏樂器", "敲擊樂器"], ans: "通奏低音" },
                { q: "這段樂曲的節奏模式是不是不斷重覆呢？", img: "G3A_MUA_images/spring-x-score.jpg", options: ["是", "不是"], ans: "是" },
                { q: "在 ( ) 內填上正確的唱名：\nd (①) m m r d (②)   s f m m m (③) d s   s (④) m f s f m r t, s,", img: "G3A_MUA_images/spring-theme.jpg",
                  options: ["① m　② s　③ r　④ f", "① r　② s　③ m　④ f", "① m　② d　③ r　④ s"], ans: "① m　② s　③ r　④ f",
                  why: "完整唱名：d m m m r d s　s f m m m r d s　s f m f s f m r t, s," },
                { q: "天父的教導：「我們務要認識耶和華，竭力追求認識他。他出現確如晨光，他必臨到我們像甘雨，像＿＿＿＿。」", options: ["滋潤田地的春雨", "吹過山谷的秋風", "照亮大地的陽光"], ans: "滋潤田地的春雨",
                  why: "何西阿書 6:3" }
            ]
        }
    };
    const MOCK_SIZE = 20;
    const DEFAULT_NAME = "G3 學生";

    let currentQList = [], currentIndex = 0, stars = 0, wrongList = [], childName = DEFAULT_NAME, currentKey = "", currentTitle = "";
    let history = loadJSON('g3_mua_hist_v3', []);
    let audioCtx = null;

    function loadJSON(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
    function save(key, val) { try { localStorage.setItem(key, typeof val === 'string' ? val : JSON.stringify(val)); } catch (e) {} }
    function $(id) { return document.getElementById(id); }
    function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function allQuestions() { return [...questionBank.lesson1.questions, ...questionBank.lesson2.questions]; }

    window.onload = () => {
        let n = null; try { n = localStorage.getItem('g3_mua_name'); } catch (e) {}
        if (n) { childName = n; $('name-input').value = n; }
        let t = 'girl'; try { t = localStorage.getItem('g3_mua_theme') || 'girl'; } catch (e) {}
        setTheme(t);
        $('auto-read-toggle').checked = loadJSON('g3_mua_autoread', true);
        $('count-lesson1').innerText = questionBank.lesson1.questions.length;
        $('count-lesson2').innerText = questionBank.lesson2.questions.length;
        $('count-all').innerText = allQuestions().length;
        $('count-mock').innerText = MOCK_SIZE;
        renderHistory();
    };

    function updateName() { childName = $('name-input').value.trim() || DEFAULT_NAME; save('g3_mua_name', childName); }
    function saveAutoRead() { save('g3_mua_autoread', $('auto-read-toggle').checked); }
    function setTheme(t) {
        document.body.className = t === 'boy' ? 'boy-theme' : '';
        save('g3_mua_theme', t);
        $('girl-btn').classList.toggle('active', t !== 'boy');
        $('boy-btn').classList.toggle('active', t === 'boy');
    }

    // iPad / iPhone 要在使用者點擊後才可以播放聲音
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        } catch (e) { return; }
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), t0 = audioCtx.currentTime;
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, t0);
            osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.3);
            gain.gain.setValueAtTime(0.1, t0); gain.gain.exponentialRampToValueAtTime(0.01, t0 + 0.3);
            osc.start(); osc.stop(t0 + 0.3);
        } else {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, t0);
            osc.frequency.exponentialRampToValueAtTime(100, t0 + 0.2);
            gain.gain.setValueAtTime(0.05, t0); gain.gain.linearRampToValueAtTime(0, t0 + 0.2);
            osc.start(); osc.stop(t0 + 0.2);
        }
    }

    function startLesson(key) {
        currentKey = key;
        if (key === 'mock') {
            currentQList = shuffle(allQuestions()).slice(0, MOCK_SIZE);
            currentTitle = "模擬測驗"; $('lesson-header').innerText = `🎯 模擬測驗：兩課隨機 ${MOCK_SIZE} 題`;
        } else if (key === 'all') {
            currentQList = shuffle(allQuestions());
            currentTitle = "全部題目"; $('lesson-header').innerText = `📚 全部題目大挑戰 (共 ${currentQList.length} 題)`;
        } else {
            currentQList = shuffle([...questionBank[key].questions]);
            currentTitle = questionBank[key].title; $('lesson-header').innerText = questionBank[key].header;
        }
        beginRound();
    }

    function retryWrong() {
        currentQList = shuffle([...wrongList]);
        currentTitle = currentTitle.replace(/ \(重做\)$/, '') + " (重做)";
        $('lesson-header').innerText = `🔁 重做答錯的題目 (共 ${currentQList.length} 題)`;
        beginRound();
    }

    function beginRound() {
        currentIndex = 0; stars = 0; wrongList = [];
        $('main-menu').classList.add('hidden');
        $('game-over').classList.add('hidden');
        $('game-play').classList.remove('hidden');
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQList[currentIndex];
        $('progress-text').innerText = `第 ${currentIndex + 1} / ${currentQList.length} 題`;
        $('progress-fill').style.width = `${currentIndex / currentQList.length * 100}%`;
        $('star-count').innerText = stars;
        $('question-text').innerText = q.q;
        $('next-btn').disabled = true;
        $('next-btn').innerText = currentIndex === currentQList.length - 1 ? '看結果 🏁' : '下一題 👉';
        $('feedback').style.display = 'none';

        const imgs = q.img ? [].concat(q.img) : [];
        const area = $('image-area');
        area.innerHTML = '';
        area.classList.toggle('hidden', imgs.length === 0);
        area.classList.toggle('multi', imgs.length > 1);
        $('zoom-tip').classList.toggle('hidden', imgs.length === 0);
        imgs.forEach(src => {
            const im = document.createElement('img'); im.src = src; im.alt = '題目圖片';
            im.onclick = () => openLightbox(src);
            area.appendChild(im);
        });

        const grid = $('options-grid'); grid.innerHTML = '';
        const isImgOpt = typeof q.options[0] === 'object';
        grid.className = isImgOpt ? 'img-options' : '';
        shuffle([...q.options]).forEach(opt => {
            const value = isImgOpt ? opt.label : opt;
            const btn = document.createElement('button');
            btn.className = 'option-btn'; btn.dataset.value = value;
            if (isImgOpt) {
                const im = document.createElement('img'); im.src = opt.img; im.alt = value;
                btn.appendChild(im); btn.appendChild(document.createTextNode(value));
            } else {
                btn.innerText = opt;
            }
            btn.onclick = () => answer(btn, value, q);
            grid.appendChild(btn);
        });
        // 圖片選項題的答案是字母，按次序排好比較易看
        if (isImgOpt) [...grid.children].sort((a, b) => a.dataset.value.localeCompare(b.dataset.value)).forEach(b => grid.appendChild(b));

        if ($('auto-read-toggle').checked) setTimeout(speakCurrent, 400);
    }

    // 只計第一次作答：答錯會即時顯示正確答案，並記入「要再溫習的題目」
    function answer(btn, value, q) {
        const buttons = [...$('options-grid').children];
        buttons.forEach(b => { b.disabled = true; if (b.dataset.value === q.ans) b.classList.add('correct'); });
        const fb = $('feedback');
        const why = q.why ? `<span class="why">📖 ${escapeHTML(q.why)}</span>` : '';
        if (value === q.ans) {
            stars++; playSound('correct');
            fb.className = 'feedback good';
            fb.innerHTML = `✅ 答對了！${why}`;
            speakText('答對了！');
        } else {
            btn.classList.add('wrong'); playSound('wrong');
            wrongList.push(q);
            fb.className = 'feedback bad';
            fb.innerHTML = `💡 沒關係，記住工作紙重點喔！正確答案是：<b style="color:var(--correct-color)">${escapeHTML(q.ans)}</b>${why}`;
            speakText(`不對喔，正確答案是：${q.ans}`);
        }
        fb.style.display = 'block';
        $('star-count').innerText = stars;
        $('next-btn').disabled = false;
    }

    function speakCurrent() { speakText(currentQList[currentIndex].q.replace(/[＿_]{2,}/g, '空格').replace(/[①②③④]/g, '空格')); }

    function speakText(msg) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(msg);
        u.lang = 'zh-HK';
        const v = window.speechSynthesis.getVoices().find(v => /zh[-_]HK|yue/i.test(v.lang));
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
    }

    function nextQuestion() {
        window.speechSynthesis && window.speechSynthesis.cancel();
        currentIndex++;
        if (currentIndex < currentQList.length) loadQuestion(); else showEnd();
    }

    function showEnd() {
        $('game-play').classList.add('hidden');
        $('game-over').classList.remove('hidden');

        const total = currentQList.length, ratio = stars / total;
        const medal = ratio === 1 ? "🏆" : ratio >= 0.8 ? "🥇" : ratio >= 0.6 ? "🥈" : "🥉";
        $('medal-emoji').innerText = medal;
        $('medal-title').innerText = `${childName} 得到 ${stars} / ${total} 顆星！`;
        $('medal-msg').innerText = ratio === 1 ? "全部答對，太厲害了！🎉" : ratio >= 0.8 ? "做得很好！再溫一溫錯的題目就完美了！" : "加油！先重做答錯的題目，再試一次！";
        if (ratio === 1) speakText('全部答對，太厲害了！');

        $('review-box').classList.toggle('hidden', wrongList.length === 0);
        $('retry-btn').classList.toggle('hidden', wrongList.length === 0);
        $('review-list').innerHTML = wrongList.map(q =>
            `<div class="review-item">${escapeHTML(q.q.split('\n')[0])}<br>👉 <b>${escapeHTML(q.ans)}</b></div>`).join('');

        const now = new Date();
        history.unshift({ date: `${now.getMonth() + 1}/${now.getDate()}`, name: childName, lesson: currentTitle, score: `${stars}/${total}`, medal });
        history = history.slice(0, 20);
        save('g3_mua_hist_v3', history);
        renderHistory();
    }

    function renderHistory() {
        $('history-list').innerHTML = history.length === 0
            ? '<div style="font-size:12px; color:var(--sub-text);">還沒有紀錄，快來挑戰吧！</div>'
            : history.map(h => `<div class="history-item"><span>${escapeHTML(h.date)}</span><span style="font-weight:bold;color:var(--primary-color)">${escapeHTML(h.name)}</span><span>${escapeHTML(h.lesson)}</span><span style="color:#f39c12;font-weight:bold">${escapeHTML(h.score)}</span><span>${escapeHTML(h.medal)}</span></div>`).join('');
    }
    function clearHistory() { if (confirm("確定要清除所有溫習紀錄嗎？")) { history = []; save('g3_mua_hist_v3', history); renderHistory(); } }

    function openLightbox(src) { $('lightbox-img').src = src; $('lightbox').classList.remove('hidden'); }

    function goBack() {
        window.speechSynthesis && window.speechSynthesis.cancel();
        $('game-play').classList.add('hidden'); $('game-over').classList.add('hidden'); $('main-menu').classList.remove('hidden');
    }
</script>
</body>
</html>
