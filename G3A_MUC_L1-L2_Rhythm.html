<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G3 音樂創作溫習</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff5f8 0%, #ffeef2 100%);
            --card-bg: #ffffff;
            --primary-color: #ff69b4;
            --primary-hover: #ff1493;
            --primary-light: #fff0f5;
            --speak-bg: #e3c8ee;
            --text-color: #2c3e50;
            --sub-text: #7f8c8d;
            --correct-color: #27ae60;
            --wrong-color: #e74c3c;
            --yt-red: #FF0000;
            --baroque-gold: #d4af37;
            --accent-purple: #9b59b6;
            --accent-orange: #e67e22;
        }
        .boy-theme {
            --bg-gradient: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
            --primary-color: #1976d2;
            --primary-hover: #0d47a1;
            --primary-light: #e8f0fe;
            --speak-bg: #c5dcf5;
        }
        * { box-sizing: border-box; font-family: 'PingFang HK', 'Microsoft JhengHei', 'Heiti TC', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); color: var(--text-color); margin: 0; padding: 12px; display: flex; justify-content: center; min-height: 100vh; }
        .game-container { width: 100%; max-width: 640px; text-align: center; }
        h1 { font-size: 22px; color: var(--primary-color); margin: 10px 0 15px; }
        .ui-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: left; }
        button { font-size: inherit; color: inherit; }

        .setup-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        input[type="text"] { width: 130px; padding: 6px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-weight: bold; font-size: 15px; }
        .theme-btn { padding: 5px 12px; border-radius: 12px; border: none; cursor: pointer; background: #eee; color: #4a4a4a; }
        .theme-btn.active { background: var(--primary-color); color: white; }

        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); }

        .menu-item-box { background: white; border-radius: 15px; margin-bottom: 12px; display: flex; overflow: hidden; }
        .menu-content { flex: 1; padding: 15px; cursor: pointer; text-align: left; }
        .menu-content:active { filter: brightness(0.96); }
        .yt-btn { width: 60px; background: var(--yt-red); display: flex; justify-content: center; align-items: center; color: white; font-size: 20px; text-decoration: none; }
        .menu-btn-title { font-size: 16px; font-weight: bold; display: block; }
        .menu-btn-sub { font-size: 12px; margin-top: 4px; display: block; font-weight: bold; }

        .header-box { font-size: 12px; color: var(--sub-text); border-bottom: 2px solid var(--primary-light); padding-bottom: 10px; margin-bottom: 12px; line-height: 1.4; font-weight: bold; }
        .progress-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .progress-fill { height: 100%; background: var(--primary-color); width: 0; transition: width .3s; }
        .page-tag { font-size: 12px; color: var(--sub-text); font-weight: bold; margin-bottom: 6px; }
        .page-tag .exam { background: #8e44ad; color: white; border-radius: 8px; padding: 1px 8px; margin-right: 6px; }

        /* 🔊 朗讀按鈕 */
        .speak-btn { flex: none; width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--speak-bg); cursor: pointer; font-size: 20px; display: inline-flex; justify-content: center; align-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
        .speak-btn:active { transform: scale(.92); }
        .speak-btn.small { width: 34px; height: 34px; font-size: 15px; }

        .question-box { display: flex; gap: 10px; align-items: center; font-size: 18px; font-weight: bold; line-height: 1.6; padding: 14px; border-left: 5px solid var(--primary-color); background: var(--primary-light); margin-bottom: 15px; border-radius: 0 16px 16px 0; }
        .question-box .q-text { flex: 1; white-space: pre-line; }

        .q-img-box { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 6px; background: #fff; padding: 10px; border-radius: 15px; border: 1px solid #eee; }
        .q-img-box img { max-width: 100%; max-height: 240px; object-fit: contain; border-radius: 8px; cursor: zoom-in; min-width: 0; }
        .q-img-box.multi img { max-width: calc(50% - 5px); }
        .q-img-box.wide img { max-height: none; }
        .zoom-tip { font-size: 11px; color: var(--sub-text); text-align: center; margin-bottom: 12px; }

        .option-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
        .option-btn { flex: 1; background: white; border: 2px solid #e6d3ee; border-radius: 14px; padding: 14px; font-weight: bold; cursor: pointer; font-size: 16px; text-align: left; color: var(--text-color); transition: transform .1s; }
        .option-btn:disabled { cursor: default; }
        .option-btn.correct { border-color: var(--correct-color); background: #e8f8f5; color: var(--correct-color); transform: scale(1.01); }
        .option-btn.wrong { border-color: var(--wrong-color); background: #fdedec; color: var(--wrong-color); }

        /* 圖片選擇 (丙部) */
        .pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .pick-card { position: relative; background: white; border: 3px solid #eee; border-radius: 14px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .pick-card img { width: 100%; height: 160px; object-fit: contain; }
        .pick-card .pick-label { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; }
        .pick-card .letter { width: 40px; height: 40px; display: inline-flex; justify-content: center; align-items: center; border-radius: 50%; border: 3px solid transparent; }
        .pick-card.selected { border-color: var(--wrong-color); }
        .pick-card.selected .letter { border-color: var(--wrong-color); color: var(--wrong-color); }
        .pick-card.good { border-color: var(--correct-color); background: #e8f8f5; }
        .pick-card.bad { border-color: var(--wrong-color); background: #fdedec; }
        .pick-card .verdict { position: absolute; top: 6px; right: 10px; font-size: 22px; }

        /* 填字母 / 配對 / 唱名 */
        .bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 14px; padding: 10px; background: #fafafa; border-radius: 14px; border: 1px dashed #ddd; }
        .bank.short { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); }
        .bank-item { display: flex; align-items: center; gap: 6px; }
        .bank-btn { flex: 1; background: white; border: 2px solid #e6d3ee; border-radius: 12px; padding: 10px 8px; font-weight: bold; font-size: 15px; cursor: pointer; text-align: left; }
        .bank.short .bank-btn { text-align: center; font-size: 20px; }
        .bank-btn:disabled { opacity: .55; cursor: default; }
        .fill-rows { margin-bottom: 10px; }
        .fill-row { display: flex; gap: 8px; align-items: center; padding: 10px 4px; border-bottom: 1px dashed #eee; font-size: 17px; font-weight: bold; line-height: 2.1; }
        .fill-row .row-text { flex: 1; }
        .card-rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .card-rows .fill-row { flex-direction: column; border: 1px solid #eee; border-radius: 14px; padding: 8px; line-height: 1.4; }
        .card-rows img { width: 100%; height: 120px; object-fit: contain; cursor: zoom-in; }
        .chip { display: inline-block; min-width: 58px; padding: 0 10px; margin: 0 3px; border: 3px dashed #bbb; border-radius: 10px; background: white; text-align: center; cursor: pointer; font-size: 18px; font-weight: bold; line-height: 1.7; color: #999; }
        .chip.filled { border-style: solid; border-color: #9b59b6; color: #6c3483; }
        .chip.active { border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-light); }
        .chip.good { border: 3px solid var(--correct-color); background: #e8f8f5; color: var(--correct-color); }
        .chip.bad { border: 3px solid var(--wrong-color); background: #fdedec; color: var(--wrong-color); }
        .chip .fix { color: var(--correct-color); margin-left: 4px; }

        /* 圈譜 */
        .circle-wrap { position: relative; margin-bottom: 6px; border: 1px solid #eee; border-radius: 12px; overflow: hidden; touch-action: manipulation; cursor: crosshair; }
        .circle-wrap img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
        .mark { position: absolute; width: 11%; aspect-ratio: 1.4; transform: translate(-50%, -50%); border: 4px solid var(--wrong-color); border-radius: 50%; pointer-events: none; }
        .mark.good { border-color: var(--correct-color); }
        .mark.pending { border-color: #e74c3c; }
        .answer-box { position: absolute; border: 3px dashed var(--correct-color); border-radius: 10px; background: rgba(39,174,96,.12); pointer-events: none; }
        .circle-tip { font-size: 13px; color: var(--sub-text); text-align: center; margin-bottom: 10px; }

        /* 洗腦模式：答錯震一震，錯第二次閃出正確答案 */
        #game-play { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
        .shake { animation: shake .45s; }
        .mark.shake { animation: none; opacity: .9; }
        @keyframes hint { 0%, 100% { box-shadow: 0 0 0 0 rgba(39,174,96,.0); } 50% { box-shadow: 0 0 0 7px rgba(39,174,96,.55); } }
        .hint { border-color: var(--correct-color) !important; background: #e8f8f5 !important; animation: hint 1s infinite; }
        .bank-btn { touch-action: none; }
        .drag-ghost { position: fixed; z-index: 20; pointer-events: none; opacity: .9; transform: scale(1.06); box-shadow: 0 8px 20px rgba(0,0,0,.25); }
        .chip.drop-over { border-color: var(--primary-color); background: var(--primary-light); transform: scale(1.12); }

        .feedback { display: none; gap: 8px; align-items: flex-start; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 15px; line-height: 1.5; text-align: left; }
        .feedback.good { background: #e8f8f5; border-left: 4px solid var(--correct-color); }
        .feedback.bad { background: #fff0f0; border-left: 4px solid var(--wrong-color); }
        .feedback .fb-text { flex: 1; }
        .feedback .why { display: block; margin-top: 6px; color: #555; font-size: 14px; }

        .btn-row { display: flex; gap: 8px; }
        .icon-btn { background:#95a5a6; color:white; border:none; border-radius:12px; width:50px; cursor:pointer; font-size: 20px; display: flex; justify-content: center; align-items: center; }
        .main-btn { flex: 1; background: var(--primary-color); color: white; border: none; border-radius: 12px; padding: 13px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .main-btn:disabled { opacity: .45; cursor: default; }

        .history-item { display: grid; grid-template-columns: 0.7fr 0.9fr 1.6fr 0.7fr 0.4fr; gap: 4px; padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-size: 12px; align-items: center; }
        .review-item { text-align: left; border-bottom: 1px dashed #eee; padding: 8px 0; font-size: 14px; line-height: 1.5; }
        .review-item b { color: var(--correct-color); }
        .hidden { display: none !important; }

        #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; justify-content: center; align-items: center; padding: 10px; z-index: 10; cursor: zoom-out; }
        #lightbox img { max-width: 100%; max-height: 100%; background: white; border-radius: 8px; }

        /* 選項附圖 (節奏 / 音符) */
        .option-btn img { display: block; max-width: 100%; max-height: 70px; margin-top: 6px; pointer-events: none; }
        .option-btn .opt-label { font-size: 18px; }
        .q-img { max-width: 100%; }
        .note-img { height: 54px; }

        /* 聆聽：播放節奏 */
        .play-btn { display: block; width: 100%; margin-bottom: 12px; padding: 14px; border: none; border-radius: 14px; background: #16a085; color: white; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
        .play-btn:active { transform: scale(.98); }
        .play-btn.playing { background: #0e6655; }

        /* 填充：每行附圖、答案卡附音符圖 */
        .fill-row .row-img { display: block; width: 100%; max-height: 110px; object-fit: contain; object-position: left; margin-bottom: 4px; cursor: zoom-in; }
        .bank-btn img { height: 34px; vertical-align: middle; margin-right: 6px; pointer-events: none; }
        .bank.notes { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
        .chip img { height: 30px; vertical-align: middle; margin-right: 4px; }
        .pick-grid.small .pick-card img { height: 70px; }

        /* 點譜：小節線記號、例子 */
        .mark.bar { width: 7px; height: 78%; aspect-ratio: auto; border: none; border-radius: 4px; background: var(--wrong-color); top: 50% !important; }
        .mark.bar.good { background: var(--correct-color); }
        .order-tip { font-size: 18px; font-weight: bold; text-align: center; color: #6c3483; margin-bottom: 8px; }

        @media (max-width: 480px) {
            .card-rows img { height: 90px; }
            .pick-card img { height: 120px; }
            .pick-grid.small .pick-card img { height: 54px; }
            .mark { border-width: 3px; }
            .option-btn img { max-height: 56px; }
            .bank.notes { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 主選單 -->
        <div id="main-menu">
            <h1>🎼 G3 音樂創作溫習 🥁</h1>

            <div class="ui-card">
                <div class="setup-row">
                    <label for="name-input">👤 學生姓名：</label>
                    <input type="text" id="name-input" maxlength="12" value="G3 學生" oninput="updateName()">
                </div>
                <div class="setup-row">
                    <span>🎭 界面主題：</span>
                    <div style="display:flex; gap:5px;">
                        <button class="theme-btn" onclick="setTheme('girl')" id="girl-btn">🧸 粉紅</button>
                        <button class="theme-btn" onclick="setTheme('boy')" id="boy-btn">🚗 藍色</button>
                    </div>
                </div>
                <div class="setup-row" style="margin:5px 0 0;">
                    <span>📢 自動朗讀題目：</span>
                    <label class="switch">
                        <input type="checkbox" id="auto-read-toggle" onchange="saveAutoRead()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid var(--baroque-gold);">
                <div class="menu-content" onclick="startLesson('lesson1')" style="background: #fffdf5;">
                    <span class="menu-btn-title" style="color:#b38f00">🎵 第一課：音符、附點音符和連結線</span>
                    <span class="menu-btn-sub" style="color:#8a6d00;" id="sub-lesson1"></span>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid var(--accent-orange);">
                <div class="menu-content" onclick="startLesson('lesson2')" style="background: #fffbf5;">
                    <span class="menu-btn-title" style="color:var(--accent-orange)">🍎 第二課：單拍子和複拍子</span>
                    <span class="menu-btn-sub" style="color:#d35400;" id="sub-lesson2"></span>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid #2980b9;">
                <div class="menu-content" onclick="startLesson('rhythm')" style="background: #f4f9fd;">
                    <span class="menu-btn-title" style="color:#2980b9">🥁 節奏創作</span>
                    <span class="menu-btn-sub" style="color:#1f618d;" id="sub-rhythm"></span>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid var(--accent-purple);">
                <div class="menu-content" onclick="startLesson('mock')" style="background: #faf5ff;">
                    <span class="menu-btn-title" style="color:var(--accent-purple)">🎯 模擬測驗</span>
                    <span class="menu-btn-sub" style="color:#8e44ad;" id="sub-mock"></span>
                </div>
            </div>

            <div class="menu-item-box" style="border: 2px solid #16a085;">
                <div class="menu-content" onclick="startLesson('all')" style="background: #f2fbf9;">
                    <span class="menu-btn-title" style="color:#16a085">📚 全部題目大挑戰</span>
                    <span class="menu-btn-sub" style="color:#0e6655;" id="sub-all"></span>
                </div>
            </div>

            <div class="ui-card">
                <div style="font-size:13px; font-weight:bold; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                    <span>📊 溫習紀錄 (日期 | 姓名 | 課題 | 得分)</span>
                    <button onclick="clearHistory()" style="color:red; background:none; border:none; cursor:pointer;" title="清除紀錄">🗑️</button>
                </div>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- 遊戲介面 -->
        <div id="game-play" class="hidden ui-card">
            <div id="lesson-header" class="header-box"></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:14px; font-weight:bold;">
                <span id="progress-text">0 / 0</span>
                <div style="color:#f39c12">⭐ <span id="star-count">0</span></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
            <div id="page-tag" class="page-tag"></div>

            <div class="question-box">
                <div class="q-text" id="question-text"></div>
                <button class="speak-btn" onclick="speakCurrent()" title="朗讀題目">🔊</button>
            </div>
            <div id="q-body"></div>
            <div id="feedback" class="feedback"></div>
            <div class="btn-row">
                <button class="icon-btn" onclick="goBack()" title="返回主頁">🏠</button>
                <button id="next-btn" class="main-btn" onclick="nextQuestion()" disabled>下一題 👉</button>
            </div>
        </div>

        <!-- 結算 -->
        <div id="game-over" class="hidden ui-card" style="text-align:center;">
            <div id="medal-emoji" style="font-size:60px;">🏆</div>
            <h2 id="medal-title" style="margin:8px 0;"></h2>
            <p id="medal-msg" style="color:var(--sub-text); margin-top:0;"></p>
            <div id="review-box" class="hidden" style="margin-bottom:15px;">
                <div style="font-weight:bold; text-align:left; margin-bottom:4px;">📝 要再溫習的題目：</div>
                <div id="review-list"></div>
            </div>
            <div class="btn-row" style="flex-direction:column;">
                <button id="retry-btn" class="main-btn hidden" onclick="retryWrong()" style="background:#e67e22;">🔁 重做答錯的題目</button>
                <button class="main-btn" onclick="goBack()">返回主選單</button>
            </div>
        </div>
    </div>

    <div id="lightbox" class="hidden" onclick="this.classList.add('hidden')"><img id="lightbox-img" alt=""></div>

<script>
    // 題庫：根據 2026-27 G3 MUC 第一、二課及節奏創作的工作紙和筆記整理
    // page = 學生版頁數；src = '筆記' 或 '工作紙'
    //
    // 單選題 (questions)：q 題目 | options 選項 (會隨機排列) | ans 答案 | img 圖片 | why 答完後顯示的重點
    // 考試格式 (exam)：按工作紙次序放在最後
    //   type 'mc'     ：選項次序跟工作紙一樣，不打亂；optImg 是選項附圖；play 是聆聽題要播的節奏
    //   type 'blanks' ：配對 / 填充。bank 是可選的答案 (可附 img)，rows 裡的 {ans} 是要填的格，每格 1 粒星；{img} 是該行的圖
    //   type 'pick'   ：圈出正確的圖片，每張圖判斷正確得 1 粒星
    //   type 'circle' ：在樂譜上點一下。targets 每個 1 粒星；rects 是正確位置 [左%, 上%, 闊%, 高%]；
    //                   ignore 是已經圈好的例子；marker 'bar' 畫小節線；ordered 要按提示次序點
    const I = 'G3A_MUC_images/';
    const NOTE = {
        全: { text: '全音符', img: I + 'note-whole.png' },
        二分: { text: '二分音符', img: I + 'note-half.png' },
        附二分: { text: '附點二分音符', img: I + 'note-dotted-half.png' },
        四分: { text: '四分音符', img: I + 'note-quarter.png' },
        八分: { text: '八分音符', img: I + 'note-eighth.png' },
        十六分: { text: '十六分音符', img: I + 'note-16th.png' }
    };
    const noteBank = keys => keys.map(k => ({ key: k, ...NOTE[k] }));
    const letters = s => s.split('').map(k => ({ key: k }));
    // 小節線位置 (由答案紙紅線計出來)：每條線一個目標
    const bars = (xs, names) => xs.map((x, i) => ({ name: names ? names[i] : '小節線', rects: [[x - 3.5, 0, 7, 100]] }));
    const BEAT_RHYTHM = { unit: 0.5, bar: 4, accents: [0] };  // 四分音符 = 0.5 秒

    const questionBank = {
        lesson1: {

    function playSound(type) {
        if (!getAudio()) return;
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(), t0 = audioCtx.currentTime;
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'correct') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, t0);
            osc.frequency.exponentialRampToValueAtTime(880, t0 + 0.3);
            gain.gain.setValueAtTime(0.1, t0); gain.gain.exponentialRampToValueAtTime(0.01, t0 + 0.3);
            osc.start(); osc.stop(t0 + 0.3);
        } else {
            osc.type = 'square'; osc.frequency.setValueAtTime(150, t0);
            osc.frequency.exponentialRampToValueAtTime(100, t0 + 0.2);
            gain.gain.setValueAtTime(0.05, t0); gain.gain.linearRampToValueAtTime(0, t0 + 0.2);
            osc.start(); osc.stop(t0 + 0.2);
        }
    }

    // 聆聽題：用「噠噠」聲奏出節奏。seq 是每個音的長度 (負數 = 休止)，unit 是每單位多少秒，
    // bar 是每小節多少單位，accents 是小節內強拍的位置 (第一個最強)
    let rhythmTimer = null;
    function playRhythm(p, btn) {
        const ctx = getAudio();
        if (!ctx) return;
        window.speechSynthesis && window.speechSynthesis.cancel();
        let t = ctx.currentTime + 0.15, pos = 0;
        p.seq.forEach(d => {
            const len = Math.abs(d);
            if (d > 0) {
                const inBar = Math.round(pos * 100) % Math.round(p.bar * 100) / 100;
                const acc = p.accents.indexOf(inBar);
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(acc === 0 ? 1046 : acc > 0 ? 932 : 784, t);
                const vol = acc === 0 ? 0.5 : acc > 0 ? 0.32 : 0.2;
                // 長音會響得長一點，聽得出長短
                const ring = Math.min(len * p.unit * 0.85, 1.2);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, t + Math.max(ring, 0.1));
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(t); osc.stop(t + Math.max(ring, 0.1) + 0.02);
            }
            t += len * p.unit; pos += len;
        });
        if (btn) {
            btn.classList.add('playing'); btn.innerText = '🔊 播放中…';
            clearTimeout(rhythmTimer);
            rhythmTimer = setTimeout(() => { btn.classList.remove('playing'); btn.innerText = '▶️ 再聽一次'; }, (t - ctx.currentTime) * 1000);
        }
    }

            .replace(/(\d)½/g, '$1個半').replace(/½/g, '半')
            .replace(/¼/g, '四分之一').replace(/⅛/g, '八分之一').replace(/¾/g, '四分之三')
            .replace(/\*/g, '星號').replace(/☆/g, '星星')
            .replace(/[＿_]{2,}/g, '，').replace(/[｜|→]/g, '，')
            .replace(/\b([A-H])\. /g, '$1，')
            .replace(/[()（）]/g, ' ');
    }
    function speakText(msg) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(toSpeech(msg));
        u.lang = 'zh-HK';
        const v = window.speechSynthesis.getVoices().find(v => /zh[-_]HK|yue/i.test(v.lang));
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
    }
    function speakBtn(getText, small) {
        const b = el('button', 'speak-btn' + (small ? ' small' : ''), '🔊');
        b.title = '朗讀';
        b.onclick = e => { e.stopPropagation(); speakText(typeof getText === 'function' ? getText() : getText); };
        return b;
    }
    function speakCurrent() {
        const q = currentQList[currentIndex];
        const i = q.ordered && state.order ? state.order.find(n => !state.found.has(n)) : null;
        speakText(q.q + (i != null ? `。請點出音符 ${q.targets[i].name}` : ''));
    }

    // ---------- 開始 ----------
    function startLesson(key) {
        if (key === 'mock') {
            const singles = shuffle(allSingles()).slice(0, MOCK_SINGLE);
            const exams = allExams();
            const picked = new Set(shuffle([...exams]).slice(0, MOCK_EXAM));
            currentQList = [...singles, ...exams.filter(q => picked.has(q))];
            currentTitle = "模擬測驗";
        } else if (key === 'all') {
            currentQList = [...shuffle(allSingles()), ...allExams()];
            currentTitle = "全部題目";
        } else {
            const L = questionBank[key];
            currentQList = [...shuffle([...L.questions]), ...L.exam];
            currentTitle = L.title;
        }
        $('lesson-header').innerText = key === 'mock' ? `🎯 模擬測驗：${MOCK_SINGLE} 題單選 + ${MOCK_EXAM} 題考試格式`
            : key === 'all' ? '📚 全部題目大挑戰' : questionBank[key].header;
        beginRound();
    }

    function retryWrong() {
        const exams = wrongList.filter(q => q.isExam);
        currentQList = [...shuffle(wrongList.filter(q => !q.isExam)), ...exams];
        currentTitle = currentTitle.replace(/ \(重做\)$/, '') + " (重做)";
        $('lesson-header').innerText = `🔁 重做答錯的題目 (共 ${currentQList.length} 題)`;
        beginRound();
    }

    function beginRound() {
        currentIndex = 0; stars = 0; wrongList = []; maxStars = totalStars(currentQList);
        $('main-menu').classList.add('hidden');
        $('game-over').classList.add('hidden');
        $('game-play').classList.remove('hidden');
        loadQuestion();
    }

    // ---------- 載入題目 ----------
    function loadQuestion() {
        const q = currentQList[currentIndex];
        state = {};
        $('progress-text').innerText = `第 ${currentIndex + 1} / ${currentQList.length} 題`;
        $('progress-fill').style.width = `${currentIndex / currentQList.length * 100}%`;
        $('star-count').innerText = stars;
        $('page-tag').innerHTML = (q.isExam ? '<span class="exam">📝 考試格式</span>' : '') + `📄 ${q.lesson} ${q.src} P.${escapeHTML(q.page)}`;
        $('question-text').innerText = q.q;
        $('next-btn').disabled = true;
        $('next-btn').innerText = currentIndex === currentQList.length - 1 ? '看結果 🏁' : '下一題 👉';
        $('feedback').style.display = 'none';

        const body = $('q-body');
        body.innerHTML = '';
        if (q.type !== 'circle') renderImages(body, q.img);
        if (q.play) {
            const pb = el('button', 'play-btn', '▶️ 播放節奏');
            pb.onclick = () => playRhythm(q.play, pb);
            body.appendChild(pb);
        }
        if (q.type === 'blanks') renderBlanks(body, q);
        else if (q.type === 'pick') renderPick(body, q);
        else if (q.type === 'circle') renderCircle(body, q);
        else renderOptions(body, q);

        window.scrollTo(0, 0);
        if ($('auto-read-toggle').checked) setTimeout(speakCurrent, 400);
    }

    function renderImages(body, img) {
        const imgs = img ? [].concat(img) : [];
        if (!imgs.length) return;
        const box = el('div', 'q-img-box' + (imgs.length > 1 ? ' multi' : ''));
        imgs.forEach(src => {
            const im = el('img'); im.src = src; im.alt = '題目圖片';
            im.onclick = () => openLightbox(src);
            box.appendChild(im);
        });
        body.appendChild(box);
        body.appendChild(el('div', 'zoom-tip', '🔍 點擊圖片可以放大'));
    }

    // 單選題 (考試格式 'mc' 不打亂次序)
    function renderOptions(body, q) {
        const opts = q.type === 'mc' ? [...q.options] : shuffle([...q.options]);
        opts.forEach(opt => {
            const row = el('div', 'option-row');
            const btn = el('button', 'option-btn');
            btn.appendChild(el('span', 'opt-label', opt));
            if (q.optImg && q.optImg[opt]) { const im = el('img'); im.src = q.optImg[opt]; im.alt = opt; btn.appendChild(im); }
            btn.dataset.value = opt;
            btn.onclick = () => answerOption(btn, opt, q);
            row.append(btn, speakBtn(opt));
            body.appendChild(row);
        });
    }

    // ---------- 洗腦模式 ----------
    // 答錯即時變紅，要答對才可以進入下一題；只有第一次就答對才有 ⭐。
    // 同一個位置錯第一次只變紅；錯第二次就閃出正確答案並讀出來。
    function missed(times, hintText, showHint) {
        playSound('wrong');
        state.anyMiss = true;
        if (times >= 2) { showHint(); speakText(hintText); }
        else speakText('再試一次！');
    }
    function flash(node, cls) {
        node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls);
        setTimeout(() => node.classList.remove(cls), 900);
    }

    function answerOption(btn, value, q) {
        if (state.done || btn.disabled) return;
        if (value === q.ans) {
            state.done = true;
            document.querySelectorAll('#q-body .option-btn').forEach(b => { b.disabled = true; b.classList.remove('hint'); });
            btn.classList.add('correct');
            playSound('correct');
            if (!state.anyMiss) stars++; else wrongList.push(q);
            showFeedback(true, state.anyMiss ? '✅ 做到了！記住這個答案喔！' : '✅ 答對了！', q);
            speakText(`答對了！正確答案是：${q.ans}`);
            finishQuestion();
        } else {
            btn.classList.add('wrong'); btn.disabled = true; flash(btn, 'shake');
            state.misses = (state.misses || 0) + 1;
            const right = [...document.querySelectorAll('#q-body .option-btn')].find(b => b.dataset.value === q.ans);
            missed(state.misses, `正確答案是：${q.ans}`, () => right.classList.add('hint'));
        }
    }

    // 答案卡上的字：音符卡顯示圖 + 名稱；英文字母卡顯示「A. 內容」；其他只顯示內容
    const isLetter = k => /^[A-H]$/.test(k);
    function bankLabel(b) { return b.img ? b.text : b.text ? (isLetter(b.key) ? `${b.key}. ${b.text}` : b.text) : b.key; }
    function bankSay(b) { return b.img ? b.text : b.text ? (isLetter(b.key) ? `${b.key}，${b.text}` : b.text) : b.key; }
    function fillChip(chip, b) {
        chip.textContent = '';
        if (b && b.img) { const im = el('img'); im.src = b.img; im.alt = b.text; chip.appendChild(im); }
        chip.appendChild(document.createTextNode(b ? b.key : '?'));
    }

    // 配對 / 填充：拖答案卡到格上（或先點格，再點答案卡）
    function renderBlanks(body, q) {
        const bank = el('div', 'bank' + (q.bank.some(b => b.img) ? ' notes' : q.bank.every(b => !b.text) ? ' short' : ''));
        state.chips = []; state.cards = {};
        q.bank.forEach(b => {
            const item = el('div', 'bank-item');
            const btn = el('button', 'bank-btn');
            if (b.img) { const im = el('img'); im.src = b.img; im.alt = b.text; btn.appendChild(im); }
            btn.appendChild(document.createTextNode(bankLabel(b)));
            btn.addEventListener('pointerdown', e => startDrag(e, b.key, btn));
            state.cards[b.key] = btn;
            item.appendChild(btn);
            item.appendChild(speakBtn(bankSay(b), true));
            bank.appendChild(item);
        });
        body.appendChild(bank);
        body.appendChild(el('div', 'circle-tip', '✋ 按住答案卡拖到格上；或者先點格，再點答案卡'));

        const rows = el('div', q.layout === 'cards' ? 'card-rows' : 'fill-rows');
        q.rows.forEach(parts => {
            const row = el('div', 'fill-row');
            const text = el('div', 'row-text');
            parts.forEach(p => {
                if (typeof p === 'string') text.appendChild(document.createTextNode(` ${p} `));
                else if (p.img) { const im = el('img', 'row-img'); im.src = p.img; im.alt = '樂譜'; im.onclick = () => openLightbox(p.img); text.appendChild(im); }
                else {
                    const chip = el('span', 'chip', '?');
                    chip.dataset.ans = p.ans; chip.misses = 0;
                    chip.onclick = () => selectChip(chip);
                    state.chips.push(chip);
                    text.appendChild(chip);
                }
            });
            row.appendChild(text);
            const words = parts.filter(p => typeof p === 'string').join('＿＿');
            if (/[一-鿿]/.test(words)) row.appendChild(speakBtn(words + (typeof parts[parts.length - 1] === 'string' ? '' : '＿＿'), true));
            rows.appendChild(row);
        });
        body.appendChild(rows);
        state.q = q;
        selectChip(state.chips[0]);
    }

    function selectChip(chip) {
        if (!chip || chip.classList.contains('good')) return;
        state.chips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.active = chip;
    }

    // 拖拉：移動少過 8px 就當作「點一下」，填入目前選中的格
    function startDrag(e, key, btn) {
        if (state.done) return;
        e.preventDefault();
        const x0 = e.clientX, y0 = e.clientY;
        let ghost = null, over = null;
        const chipAt = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest('.chip'); };
        const move = ev => {
            if (!ghost && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 8) return;
            if (!ghost) {
                ghost = btn.cloneNode(true); ghost.classList.add('drag-ghost');
                ghost.style.width = btn.offsetWidth + 'px';
                document.body.appendChild(ghost);
            }
            ghost.style.left = (ev.clientX - btn.offsetWidth / 2) + 'px';
            ghost.style.top = (ev.clientY - 28) + 'px';
            const c = chipAt(ev.clientX, ev.clientY);
            if (over && over !== c) over.classList.remove('drop-over');
            over = c && !c.classList.contains('good') ? c : null;
            if (over) over.classList.add('drop-over');
        };
        const up = ev => {
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            window.removeEventListener('pointercancel', up);
            if (over) over.classList.remove('drop-over');
            if (ghost) {
                ghost.remove();
                const c = chipAt(ev.clientX, ev.clientY);
                if (c && !c.classList.contains('good')) dropKey(key, c);
            } else if (state.active) dropKey(key, state.active);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
    }

    function dropKey(key, chip) {
        if (state.done || chip.classList.contains('good')) return;
        const q = state.q;
        state.chips.forEach(c => c.classList.remove('hint'));
        Object.values(state.cards).forEach(c => c.classList.remove('hint'));
        if (key === chip.dataset.ans) {
            fillChip(chip, q.bank.find(b => b.key === key));
            chip.classList.remove('active', 'bad');
            chip.classList.add('good');
            if (chip.misses === 0) stars++;
            $('star-count').innerText = stars;
            playSound('correct');
            const next = state.chips.find(c => !c.classList.contains('good'));
            if (next) { selectChip(next); speakText('答對了！'); }
            else finishParts(q);
        } else {
            chip.misses++;
            chip.textContent = key; chip.classList.add('bad'); flash(chip, 'shake');
            setTimeout(() => { if (!chip.classList.contains('good')) { chip.textContent = '?'; chip.classList.remove('bad'); } }, 900);
            selectChip(chip);
            const right = q.bank.find(b => b.key === chip.dataset.ans);
            const say = bankSay(right);
            missed(chip.misses, `正確答案是：${say}`, () => state.cards[right.key].classList.add('hint'));
        }
    }

    // 圈出圖片 (丙部)：要圈的點了變綠 ⭕，不用圈的點了變紅 ✖️
    function renderPick(body, q) {
        const grid = el('div', 'pick-grid' + (q.small ? ' small' : ''));
        state.misses = 0; state.tapped = new Set();
        state.cards = q.items.map(it => {
            const card = el('div', 'pick-card');
            const im = el('img'); im.src = it.img; im.alt = it.label;
            const label = el('div', 'pick-label');
            label.append(el('span', 'letter', it.label), speakBtn(it.label, true));
            card.append(im, label);
            card.onclick = () => tapPick(q, card, it);
            grid.appendChild(card);
            return { card, it };
        });
        body.appendChild(grid);
        body.appendChild(el('div', 'circle-tip', `👆 點選要圈的圖片（共 ${q.items.filter(i => i.ans).length} 張）`));
    }

    function tapPick(q, card, it) {
        if (state.done || card.classList.contains('good')) return;
        state.cards.forEach(c => c.card.classList.remove('hint'));
        if (it.ans) {
            card.classList.add('good'); card.appendChild(el('span', 'verdict', '⭕'));
            playSound('correct');
            if (state.misses === 0) stars++;
            $('star-count').innerText = stars;
            if (state.cards.every(c => !c.it.ans || c.card.classList.contains('good'))) {
                // 不用圈而又沒有點錯的圖，每張 1 粒星
                state.cards.forEach(c => { if (!c.it.ans && !state.tapped.has(c.it.label)) stars++; });
                finishParts(q);
            } else speakText('答對了！');
        } else {
            state.misses++; state.tapped.add(it.label);
            flash(card, 'shake'); card.classList.add('bad');
            setTimeout(() => card.classList.remove('bad'), 900);
            const left = state.cards.filter(c => c.it.ans && !c.card.classList.contains('good'));
            missed(state.misses, `${it.label} ${q.badText}。要圈 ${left.map(c => c.it.label).join(' 和 ')}`, () => left.forEach(c => c.card.classList.add('hint')));
        }
    }

    // 在樂譜上點一下畫圈 (或畫小節線)：點中就變綠色留下，點錯就閃紅色然後消失
    // ordered：按提示一個一個點 (例如先點 B，再點 G…)，次序每次隨機
    function renderCircle(body, q) {
        const isBar = q.marker === 'bar';
        const orderTip = el('div', 'order-tip');
        if (q.ordered) {
            state.order = shuffle(q.targets.map((t, i) => i));
            body.appendChild(orderTip);
        }
        const current = () => q.ordered ? state.order.find(i => !state.found.has(i)) : null;
        const showOrder = () => {
            const i = current();
            if (i == null) return;
            orderTip.textContent = `👉 請點出音符：${q.targets[i].name}`;
        };
        const wrap = el('div', 'circle-wrap');
        const im = el('img'); im.src = q.img; im.alt = '樂譜'; im.draggable = false;
        wrap.appendChild(im);
        state.found = new Set(); state.misses = 0;
        if (q.ordered) showOrder();
        const need = q.targets.length;
        const inRect = (x, y, rects) => (rects || []).some(([rx, ry, rw, rh]) => x >= rx - 1.5 && x <= rx + rw + 1.5 && y >= ry - 2 && y <= ry + rh + 2);
        const inside = (x, y, t) => inRect(x, y, t.rects);
        wrap.onclick = e => {
            if (state.done) return;
            const r = wrap.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width * 100, y = (e.clientY - r.top) / r.height * 100;
            if (inRect(x, y, q.ignore)) { speakText('這個是例子，已經圈好了！'); return; }
            const m = el('div', 'mark' + (isBar ? ' bar' : '')); m.style.left = x + '%'; m.style.top = y + '%';
            wrap.appendChild(m);
            if (q.targets.some((t, i) => state.found.has(i) && inside(x, y, t))) { m.remove(); return; }
            const ti = q.ordered ? (inside(x, y, q.targets[current()]) ? current() : -1)
                : q.targets.findIndex((t, i) => !state.found.has(i) && inside(x, y, t));
            if (ti >= 0) {
                state.found.add(ti); m.classList.add('good');
                if (isBar) m.style.left = (q.targets[ti].rects[0][0] + q.targets[ti].rects[0][2] / 2) + '%';
                wrap.querySelectorAll('.answer-box').forEach(b => b.remove());
                playSound('correct');
                if (state.misses === 0) stars++;
                $('star-count').innerText = stars;
                if (state.found.size === need) { orderTip.textContent = ''; finishParts(q); }
                else if (q.ordered) { showOrder(); speakText(`答對了！再點 ${q.targets[current()].name}`); }
                else speakText(isBar ? '答對了！再加一條！' : '答對了！再圈一個！');
            } else {
                state.misses++;
                flash(m, 'shake');
                setTimeout(() => m.remove(), 900);
                missed(state.misses, '看看綠色虛線框，正確答案在這裡！', () => {
                    wrap.querySelectorAll('.answer-box').forEach(b => b.remove());
                    q.targets.forEach((t, i) => {
                        if (state.found.has(i) || (q.ordered && i !== current())) return;
                        t.rects.forEach(([rx, ry, rw, rh]) => {
                            const b = el('div', 'answer-box');
                            Object.assign(b.style, { left: rx + '%', top: ry + '%', width: rw + '%', height: rh + '%' });
                            wrap.appendChild(b);
                        });
                    });
                });
            }
        };
        body.appendChild(wrap);
        body.appendChild(el('div', 'circle-tip', isBar ? `👆 點樂譜上要加線的位置（共 ${need} 條）`
            : q.ordered ? `👆 按提示點樂譜上的音符（共 ${need} 個）` : `👆 用手指點樂譜畫圈（要圈 ${need} 個）`));
    }

    // 多格題目全部做對後
    function finishParts(q) {
        state.done = true;
        $('star-count').innerText = stars;
        if (state.anyMiss) {
            wrongList.push(q);
            showFeedback(false, '✅ 全部做到了！有錯過的地方，記住正確答案喔！', q);
            speakText('全部做到了！記住正確答案喔！');
        } else {
            showFeedback(true, '✅ 全部一次答對，太厲害了！', q);
            speakText('全部一次答對，太厲害了！');
        }
        finishQuestion();
    }

    function showFeedback(good, html, q) {
        const fb = $('feedback');
        fb.className = 'feedback ' + (good ? 'good' : 'bad');
        fb.innerHTML = '';
        const t = el('div', 'fb-text');
        t.innerHTML = html + (q.why ? `<span class="why">📖 ${escapeHTML(q.why)}</span>` : '');
        fb.appendChild(t);
        if (q.why) fb.appendChild(speakBtn(q.why, true));
        fb.style.display = 'flex';
    }

    function finishQuestion() {
        $('star-count').innerText = stars;
        $('next-btn').disabled = false;
    }

    function nextQuestion() {
        window.speechSynthesis && window.speechSynthesis.cancel();
        currentIndex++;
        if (currentIndex < currentQList.length) loadQuestion(); else showEnd();
    }

    // ---------- 結算 ----------
    function showEnd() {
        $('game-play').classList.add('hidden');
        $('game-over').classList.remove('hidden');

        const ratio = stars / maxStars;
        const medal = ratio === 1 ? "🏆" : ratio >= 0.8 ? "🥇" : ratio >= 0.6 ? "🥈" : "🥉";
        $('medal-emoji').innerText = medal;
        $('medal-title').innerText = `${childName} 得到 ${stars} / ${maxStars} 粒星！`;
        $('medal-msg').innerText = ratio === 1 ? "全部答對，太厲害了！🎉" : ratio >= 0.8 ? "做得很好！再溫一溫錯的題目就完美了！" : "加油！先重做答錯的題目，再試一次！";
        if (ratio === 1) speakText('全部答對，太厲害了！');

        $('review-box').classList.toggle('hidden', wrongList.length === 0);
        $('retry-btn').classList.toggle('hidden', wrongList.length === 0);
        $('review-list').innerHTML = wrongList.map(q =>
            `<div class="review-item">📄 P.${escapeHTML(q.page)}　${escapeHTML(q.q.split('\n')[0])}${q.ans ? `<br>👉 <b>${escapeHTML(q.ans)}</b>` : ''}</div>`).join('');

        const now = new Date();
        history.unshift({ date: `${now.getMonth() + 1}/${now.getDate()}`, name: childName, lesson: currentTitle, score: `${stars}/${maxStars}`, medal });
        history = history.slice(0, 20);
        save('g3_muc_hist_v3', history);
        renderHistory();
    }

    function renderHistory() {
        $('history-list').innerHTML = history.length === 0
            ? '<div style="font-size:12px; color:var(--sub-text);">還沒有紀錄，快來挑戰吧！</div>'
            : history.map(h => `<div class="history-item"><span>${escapeHTML(h.date)}</span><span style="font-weight:bold;color:var(--primary-color)">${escapeHTML(h.name)}</span><span>${escapeHTML(h.lesson)}</span><span style="color:#f39c12;font-weight:bold">${escapeHTML(h.score)}</span><span>${escapeHTML(h.medal)}</span></div>`).join('');
    }
    function clearHistory() { if (confirm("確定要清除所有溫習紀錄嗎？")) { history = []; save('g3_muc_hist_v3', history); renderHistory(); } }

    function openLightbox(src) { $('lightbox-img').src = src; $('lightbox').classList.remove('hidden'); }

    function goBack() {
        window.speechSynthesis && window.speechSynthesis.cancel();
        $('game-play').classList.add('hidden'); $('game-over').classList.add('hidden'); $('main-menu').classList.remove('hidden');
    }
</script>
