<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 F.2 English Glossary 溫習系統 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff758c;
            --primary-hover: #ff5277;
            --bg-color: #fff0f3;
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
            --accent-color: #ff9a9e;
            --badge-bg: #ffe3e8;
            --border-color: #ffccd5;
            --shadow: 0 8px 20px rgba(255, 117, 140, 0.15);
            --font-family: 'Nunito', 'M PLUS Rounded 1c', 'PingFang HK', 'Microsoft JhengHei', sans-serif;
        }

        body.theme-matcha {
            --primary-color: #70a13d;
            --primary-hover: #5a852e;
            --bg-color: #f4f8f0;
            --card-bg: #ffffff;
            --text-color: #334228;
            --accent-color: #8bc34a;
            --badge-bg: #e8f5e9;
            --border-color: #c8e6c9;
            --shadow: 0 8px 20px rgba(112, 161, 61, 0.15);
        }

        * { box-sizing: border-box; font-family: var(--font-family); }
        body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); transition: all 0.3s ease; }
        
        .container { max-width: 880px; margin: 0 auto; padding: 20px 15px; text-align: center; }
        .hidden { display: none !important; }

        h1 { font-size: 26px; color: var(--primary-color); margin-bottom: 8px; font-weight: 800; letter-spacing: 0.5px; }
        h2 { font-size: 20px; margin-bottom: 15px; color: #555; font-weight: 700; }
        
        .user-settings { margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap;}
        .user-settings label { font-size: 16px; font-weight: 700; }
        .user-settings input { 
            font-size: 16px; padding: 8px 16px; border-radius: 20px; border: 2px solid var(--primary-color); 
            width: 150px; text-align: center; outline: none; font-weight: 700; color: var(--text-color);
            background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; min-height: 45px; }
        .home-btn { 
            font-size: 15px; font-weight: 700; cursor: pointer; 
            background: #fff; border: 2px solid var(--primary-color); border-radius: 20px; padding: 6px 18px; 
            box-shadow: var(--shadow); color: var(--primary-color); transition: all 0.2s;
        }
        .home-btn:hover { background: var(--primary-color); color: white; }

        .settings-panel { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;}
        .toggle-btn { 
            padding: 8px 18px; border-radius: 20px; font-size: 14px; font-weight: 700; 
            cursor: pointer; border: none; box-shadow: var(--shadow); transition: all 0.2s; color: white;
        }
        .btn-theme-sakura { background: linear-gradient(135deg, #ff758c, #ff7eb3); }
        .btn-theme-matcha { background: linear-gradient(135deg, #a8e063, #56ab2f); }
        .btn-audio-on { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-audio-off { background: #b0bec5; }

        button:not(.home-btn):not(.toggle-btn):not(.speaker-icon):not(.unit-tab) {
            background-color: var(--card-bg); color: var(--text-color); border: 2px solid var(--border-color);
            border-radius: 18px; padding: 14px 20px; font-size: 16px; font-weight: 700;
            margin: 6px; cursor: pointer; transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04); touch-action: manipulation;
        }
        button:not(.home-btn):not(.toggle-btn):not(.speaker-icon):not(.unit-tab):hover {
            border-color: var(--primary-color); transform: translateY(-2px); box-shadow: var(--shadow);
        }
        button.btn-primary { background: linear-gradient(135deg, var(--primary-color), var(--accent-color)); color: white; border: none; }
        button.btn-accent { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #555; border: none; }
        button.btn-special { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); color: #444; border: none; }

        .unit-section-title { font-size: 18px; font-weight: 800; text-align: left; margin: 20px 0 10px 5px; color: var(--primary-color); border-left: 5px solid var(--primary-color); padding-left: 10px; }
        .unit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .unit-card { 
            background: var(--card-bg); border-radius: 18px; padding: 15px; 
            border: 2px solid var(--border-color); box-shadow: var(--shadow); 
            text-align: left; cursor: pointer; transition: all 0.2s ease;
        }
        .unit-card:hover { transform: translateY(-3px); border-color: var(--primary-color); }
        .unit-card-title { font-size: 15px; font-weight: 800; color: var(--primary-color); margin-bottom: 6px; }
        .unit-card-desc { font-size: 13px; color: #777; line-height: 1.4; }

        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
        @media (min-width: 600px) { .menu-grid { grid-template-columns: 1fr 1fr; } }
        
        .chapter-btn { font-size: 16px; padding: 14px; width: 100%; border-radius: 18px; background-color: var(--card-bg); margin: 6px 0; text-align: left;}
        .chapter-btn.selected { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .status-bar { font-size: 17px; font-weight: 700; background: white; padding: 12px; border-radius: 15px; margin-bottom: 15px; box-shadow: var(--shadow); }
        .question-box { background: white; padding: 30px 20px; border-radius: 24px; font-size: 20px; line-height: 1.6; margin-bottom: 20px; box-shadow: var(--shadow); position: relative; min-height: 180px; display: flex; align-items: center; justify-content: center; flex-direction: column;}
        .speaker-icon { position: absolute; top: 12px; right: 15px; font-size: 26px; cursor: pointer; background: none; border: none; box-shadow:none; padding: 0;}
        
        .options-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (max-width: 500px) { .options-grid { grid-template-columns: 1fr; } }
        
        .text-input { font-size: 20px; padding: 12px; width: 85%; text-align: center; border: 3px solid var(--primary-color); border-radius: 18px; margin-bottom: 15px; outline: none; font-weight: 700;}

        .unit-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .unit-tab { padding: 8px 16px; border-radius: 20px; background: #fff; border: 2px solid var(--border-color); font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; color: #666;}
        .unit-tab.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .word-list { display: grid; grid-template-columns: repeat(1, 1fr); gap: 12px; padding: 5px; }
        @media (min-width: 600px) { .word-list { grid-template-columns: repeat(2, 1fr); } }
        .word-card { 
            background: white; padding: 16px; border-radius: 18px; border: 2px solid var(--border-color); 
            text-align: left; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow);
        }
        .word-card:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .word-title { font-size: 20px; font-weight: 800; color: var(--primary-color); display: flex; justify-content: space-between; align-items: center;}
        .word-pos { font-size: 13px; background: var(--badge-bg); color: var(--primary-color); padding: 3px 8px; border-radius: 10px; font-weight: 700; }
        .word-cn { font-size: 16px; font-weight: 700; color: #333; margin: 6px 0 4px 0; }
        .word-def { font-size: 13px; color: #666; font-style: italic; margin-bottom: 6px; }
        .word-eg { font-size: 13px; color: #444; background: #f9f9f9; padding: 8px; border-radius: 10px; border-left: 3px solid var(--primary-color); }

        .leaderboard-container { margin-top: 30px; background: white; padding: 20px; border-radius: 24px; box-shadow: var(--shadow); }
        .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .leaderboard-table th, .leaderboard-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
        .leaderboard-table th { background-color: var(--badge-bg); color: var(--primary-color); font-weight: 800; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 28px; text-align: center; max-width: 90%; width: 420px; box-shadow: 0 15px 30px rgba(0,0,0,0.15); }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-6px); } 100% { transform: translateX(0); } }
        .wrong-anim { animation: shake 0.4s; background-color: #ffebee !important; border-color: #ef5350 !important; color: #c62828 !important; }
        .correct-anim { background-color: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
    </style>
</head>
<body class="theme-sakura">

<div class="container">
    <div class="top-bar">
        <button class="home-btn" onclick="goHome()">🌸 主選單</button>
        <div id="score-display" class="hidden" style="font-weight: 800; color: var(--primary-color); font-size: 18px; background: white; padding: 6px 18px; border-radius: 20px; box-shadow: var(--shadow);">🏆 分數: <span id="current-score">0</span></div>
    </div>

    <!-- 主頁 -->
    <div id="view-home">
        <h1>🌸 F.2 English Glossary 溫習系統 🌸</h1>
        <p style="color: #777; font-size: 14px; margin-top: -5px; margin-bottom: 15px;">St. Rose of Lima's College • Unit 1 & Unit 2</p>
        
        <div class="user-settings">
            <label>🎀 學生姓名：</label>
            <input type="text" id="player-name" value="Heidy">
        </div>

        <div class="settings-panel">
            <button class="toggle-btn btn-theme-sakura" id="btn-theme" onclick="toggleTheme()">🌸 櫻花風</button>
            <button class="toggle-btn btn-audio-off" id="btn-audio" onclick="toggleAudio()">🔇 自動朗讀: OFF</button>
        </div>

        <div class="unit-section-title">📚 Glossary 課文單元總覽 (共 73 詞 × 5例句)</div>
        <div class="unit-grid" id="home-unit-grid"></div>

        <div class="unit-section-title">🎮 選擇溫習挑戰模式</div>
        <div class="menu-grid">
            <button class="btn-special" onclick="openLV0()">📖 LV0 詞卡總覽 (預覽與發音)</button>
            <button class="btn-primary" onclick="openChapterSelect('LV1')">🗣️ LV1 詞語跟讀 (看字朗讀)</button>
            <button class="btn-primary" onclick="openChapterSelect('LV3')">✏️ LV3 例句填空 (四選一)</button>
            <button class="btn-primary" onclick="openChapterSelect('LV4')">🧩 LV4 字母長度挑戰 (首字母提示)</button>
            <button class="btn-primary" onclick="openChapterSelect('LV5')">📖 LV5 英文釋義模式 (Definition Matching)</button>
            <button class="btn-accent" onclick="openChapterSelect('DICT')">🎧 默書測驗模式 (Dictation Mode)</button>
            <button class="btn-special" style="grid-column: 1 / -1;" onclick="openChapterSelect('LV9')">🔥 LV9 不供詞拼寫 (無提示挑戰)</button>
        </div>

        <div class="leaderboard-container">
            <h3>🏆 榮譽排行榜</h3>
            <table class="leaderboard-table">
                <thead><tr><th>玩家</th><th>模式</th><th>範圍</th><th>分數</th></tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <!-- LV0 詞卡點讀 -->
    <div id="view-lv0" class="hidden">
        <h2>📖 點擊詞卡收聽英文發音</h2>
        <div class="unit-tabs" id="lv0-tabs"></div>
        <div class="word-list" id="lv0-word-list"></div>
    </div>

    <!-- 單元選擇 -->
    <div id="view-chapter-select" class="hidden">
        <h2 id="cs-title">請選擇測驗課文範圍</h2>
        <div id="cs-buttons"></div>
        <button class="btn-primary" style="width: 220px; margin-top: 20px;" onclick="startGame()">開始遊戲 🚀</button>
    </div>

    <!-- 遊戲挑戰 -->
    <div id="view-game" class="hidden">
        <div class="status-bar">進度: <span id="progress">0/10</span></div>
        <div class="question-box">
            <button class="speaker-icon" onclick="readQuestionManual()">📢</button>
            <div id="question-text"></div>
            <div id="input-area" class="hidden" style="width:100%; margin-top: 15px;">
                <input type="text" id="answer-input" class="text-input" placeholder="請輸入答案" autocomplete="off">
                <br><button class="btn-primary" onclick="checkInputAnswer()">檢查答案 ✅</button>
            </div>
        </div>
        <div class="options-grid" id="options-area"></div>
    </div>

    <!-- 結算 -->
    <div id="view-results" class="hidden">
        <h1>🎉 完成挑戰！</h1>
        <h2 id="res-name"></h2>
        <div style="font-size: 55px; color: var(--primary-color); font-weight: 800; margin: 15px;" id="final-score">0分</div>
        <button class="btn-primary" onclick="goHome()">返回主選單</button>
    </div>
</div>

<div id="wrong-modal" class="modal hidden">
    <div class="modal-content">
        <h2 style="color: #ef5350; margin:0;">❌ 答錯囉！</h2>
        <p style="font-size: 16px; margin-top: 10px; color: #666;">正確答案是：</p>
        <div id="correct-ans" style="font-size: 28px; color: var(--primary-color); font-weight: 800; margin: 10px 0;"></div>
        <div id="correct-extra" style="font-size: 15px; color: #555; margin-bottom: 15px;"></div>
        <p style="font-size: 13px; color: #ff758c; font-weight:700;">🔄 本題將重排至隊尾，稍後需再次挑戰！</p>
        <button class="btn-primary" onclick="closeModal()">繼續努力 🚀</button>
    </div>
</div>

<script>
    const UNITS = [
        { id: 1, title: 'U1 Text 1: Big Data', desc: 'advertising, bestselling, big data, customize, optimize...' },
        { id: 2, title: 'U1 Text 2: Handcrafted!', desc: 'artisan, bargain, haggle, shop around, sustainable, vendor...' },
        { id: 3, title: 'U2 Text 2: Watching your step', desc: 'assume, bombard, digital footprint, doxing, privacy, trace...' },
        { id: 4, title: 'U2 Life Skill: Social Media', desc: 'at risk of, direct message, hashtag, meme, spark, go viral...' }
    ];

    const WORD_DATA = [
        // Unit 1 Text 1 (19)
        { u: 1, w: 'advertising', pos: 'n. [uncountable]', cn: '廣告；廣告業', def: 'the activity and industry of advertising things to people', q: [
            'Effective ____ can significantly boost a company\'s sales and brand recognition.',
            'The company spent millions of dollars on television ____.',
            'Online ____ has become essential for modern business marketing.',
            'Many children are easily influenced by persuasive ____.',
            'She decided to pursue a career in digital ____ after graduation.'
        ]},
        { u: 1, w: 'bestselling', pos: 'adj.', cn: '熱銷的；最暢銷的', def: 'describing a product bought by large numbers of people', q: [
            'This author\'s latest novel quickly became a ____ book worldwide.',
            'The store put its most ____ products near the front entrance.',
            'Her new album reached the top of the ____ charts this week.',
            'The company released a new edition of their ____ video game.',
            'Toy shops often run out of stock for ____ items during Christmas.'
        ]},
        { u: 1, w: 'big data', pos: 'n. phr.', cn: '大數據', def: 'sets of information too large/complex to handle with standard methods', q: [
            'Companies are increasingly relying on ____ to make informed business decisions.',
            'Modern online platforms use ____ to analyze consumer shopping habits.',
            'Analyzing ____ helps supermarket chains predict what items customers want.',
            'Tech companies hire data scientists to process massive amounts of ____.',
            'The use of ____ has revolutionized how targeted ads are created.'
        ]},
        { u: 1, w: 'bricks-and-mortar', pos: 'adj. / n. phr.', cn: '實體店面的；實體門市', def: 'a business operating from a shop building rather than only online', q: [
            'The new ____ bookstore offers a cozy reading space for local residents.',
            'Many traditional ____ retailers are opening online shops to survive.',
            'Online shopping has caused many ____ stores to lose customers.',
            'Some shoppers still prefer ____ shops because they can try products in person.',
            'Renting a ____ retail space in central business districts is very expensive.'
        ]},
        { u: 1, w: 'coincide with', pos: 'v. phr.', cn: '與…同時發生；巧合', def: 'to take place at the same time', q: [
            'The festival dates will ____ the local holiday celebrations this year.',
            'The product launch was scheduled to ____ the annual trade show.',
            'Her graduation ceremony happened to ____ her birthday.',
            'Heavy rain began to ____ the start of the outdoor concert.',
            'The opening of the new mall will ____ the start of the summer sale.'
        ]},
        { u: 1, w: 'cumbersome', pos: 'adj.', cn: '笨重的；繁瑣複雜的', def: 'large and heavy / slow or complicated', q: [
            'Carrying that ____ luggage up the long flight of stairs was exhausting.',
            'Old desktop computers were heavy and ____ compared to modern laptops.',
            'The safety gear felt heavy and ____ during training.',
            'The traditional registration process was slow and ____ for new users.',
            'She packed her belongings in one large box instead of several ____ packages.'
        ]},
        { u: 1, w: 'customize', pos: 'v.', cn: '客製化；訂製', def: 'to make or change something to suit the needs of the user', q: [
            'Customers can ____ their sneakers by choosing their favorite colors and patterns.',
            'The app allows users to ____ their dashboard for a better user experience.',
            'You can ____ your phone case with your name or favorite photos.',
            'The furniture shop offers options to ____ the size and fabric of sofas.',
            'Online stores often let buyers ____ their orders with personalized gifts.'
        ]},
        { u: 1, w: 'dietary supplement', pos: 'n. phr.', cn: '膳食補充劑；保健食品', def: 'vitamins/foods eaten in addition to what you usually eat', q: [
            'Many athletes take ____s to enhance their performance and recovery.',
            'Taking a daily ____ can help fill nutritional gaps in your diet.',
            'Doctors recommend taking a vitamin C ____ during the winter flu season.',
            'You should consult a doctor before starting any new ____.',
            'Calcium ____s are commonly taken to maintain strong bones.'
        ]},
        { u: 1, w: 'embrace', pos: 'v.', cn: '欣然接受；擁抱（新觀念）', def: 'to accept an idea, proposal, or belief', q: [
            'It\'s important to ____ new ideas to foster innovation in the workplace.',
            'The school decided to ____ technology by giving every student a tablet.',
            'We should learn to ____ changes rather than fear them.',
            'Modern businesses must ____ digital tools to stay competitive.',
            'She was willing to ____ different cultures while studying abroad.'
        ]},
        { u: 1, w: 'formulate', pos: 'v.', cn: '精心構思；制定', def: 'to create or prepare something carefully with attention to detail', q: [
            'The marketing team met to ____ a clear strategy for the upcoming product launch.',
            'Scientists worked tirelessly in the laboratory to ____ a safe vaccine.',
            'Students were asked to ____ a hypothesis before starting the experiment.',
            'The committee will ____ new rules to improve campus safety.',
            'It takes time and careful thought to ____ an effective study plan.'
        ]},
        { u: 1, w: 'generic', pos: 'adj.', cn: '通用的；無品牌的', def: 'shared by or typical of a whole group; not specific', q: [
            'The store sells ____ brands that are often cheaper than name-brand products.',
            'He prefers buying ____ medicine because it contains the same active ingredients.',
            'The document used a ____ template rather than a custom design.',
            'They bought ____ cereal at the supermarket to save money.',
            'The report provided a very ____ response without addressing specific details.'
        ]},
        { u: 1, w: 'individualized', pos: 'adj.', cn: '個人化的；因人而異的', def: 'designed for a particular person or thing', q: [
            'The tutor designed an ____ study schedule to help her focus on her weak subjects.',
            'Patients receive ____ medical care based on their specific health conditions.',
            'Each student in the art class received ____ feedback from the teacher.',
            'The fitness coach created an ____ workout routine for every client.',
            'Special education programs provide ____ support for children with learning needs.'
        ]},
        { u: 1, w: 'lo and behold', pos: 'idiom', cn: '你看！瞧！（表示驚奇）', def: 'used for calling attention to a surprising thing', q: [
            '____, the package arrived just in time for her birthday.',
            'I searched for my missing keys everywhere, and ____, they were in my pocket.',
            'We thought it would rain all day, but ____, the sun came out.',
            'She opened the mysterious door, and ____, a hidden room appeared.',
            'He turned on his old computer, and ____, it still worked perfectly.'
        ]},
        { u: 1, w: 'on-trend', pos: 'adj.', cn: '非常時髦的；引領潮流的', def: 'very fashionable', q: [
            'The fashion line features ____ designs that appeal to modern consumers.',
            'Her outfit was stylish, colourful, and completely ____.',
            'Young teenagers always want to wear ____ clothes to school.',
            'The interior designer picked ____ furniture for the newly renovated cafe.',
            'Social media influencers help popularize ____ hairstyles and cosmetics.'
        ]},
        { u: 1, w: 'optimize', pos: 'v.', cn: '優化；使最佳化', def: 'to make something as good as it can be', q: [
            'We need to ____ our study routine so that we can learn effectively.',
            'Engineers altered the design to ____ the car\'s fuel efficiency.',
            'The software update was created to ____ system performance and speed.',
            'Athletes adjust their diets to ____ their physical energy before competitions.',
            'Website owners try to ____ their content so it ranks higher on search engines.'
        ]},
        { u: 1, w: 'personalized', pos: 'adj.', cn: '個性化的；量身打造的', def: 'designed so that it is suitable for a particular person', q: [
            'The company offers ____ gifts that make each purchase unique.',
            'She received a ____ card with her name printed in gold letters.',
            'Online streaming services provide ____ recommendations based on your history.',
            'The teacher wrote a ____ message of encouragement on every student\'s paper.',
            'The hotel welcomed its guests with ____ gift baskets in their rooms.'
        ]},
        { u: 1, w: 'prominent', pos: 'adj.', cn: '顯眼的；突出的', def: 'easily seen', q: [
            'The brand\'s logo was displayed in a ____ position at the entrance of the store.',
            'She played a ____ role in leading the school fundraising campaign.',
            'The statue stands in a ____ place in the middle of the town square.',
            'His name was listed in ____ letters on the cover of the magazine.',
            'She wore a necklace with a ____ gemstone that caught everyone\'s attention.'
        ]},
        { u: 1, w: 'responsive', pos: 'adj.', cn: '反應敏捷的；積極回應的', def: 'reacting quickly and in a positive way', q: [
            'The customer service desk was very ____ and quickly resolved our issue.',
            'Modern websites must be ____ so they fit properly on mobile screens.',
            'The teacher was very ____ to the students\' questions during class.',

    const synth = window.speechSynthesis;

    function renderHomeUnits() {
        const grid = document.getElementById('home-unit-grid');
        grid.innerHTML = '';
        UNITS.forEach(u => {
            const count = WORD_DATA.filter(w => w.u === u.id).length;
            const card = document.createElement('div');
            card.className = 'unit-card';
            card.onclick = () => { openLV0(u.id); };
            card.innerHTML = `
                <div class="unit-card-title">📌 ${u.title} (${count}字)</div>
                <div class="unit-card-desc">${u.desc}</div>
            `;
            grid.appendChild(card);
        });
    }

    function showView(id) {
        document.querySelectorAll('.container > div[id^="view-"]').forEach(v => v.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    function goHome() {
        if(synth.speaking) synth.cancel();
        showView('view-home');
        updateLeaderboardDisplay();
        document.getElementById('score-display').classList.add('hidden');
    }

    function toggleTheme() {
        isSakuraTheme = !isSakuraTheme;
        const btn = document.getElementById('btn-theme');
        if(isSakuraTheme) {
            document.body.className = 'theme-sakura';
            btn.innerText = '🌸 櫻花風';
            btn.className = 'toggle-btn btn-theme-sakura';
        } else {
            document.body.className = 'theme-matcha';
            btn.innerText = '🍵 抹茶風';
            btn.className = 'toggle-btn btn-theme-matcha';
        }
    }

    function toggleAudio() {
        isAutoAudio = !isAutoAudio;
        const btn = document.getElementById('btn-audio');
        if(isAutoAudio) {
            btn.innerText = '🔊 自動朗讀: ON';
            btn.className = 'toggle-btn btn-audio-on';
        } else {
            btn.innerText = '🔇 自動朗讀: OFF';
            btn.className = 'toggle-btn btn-audio-off';
        }
    }

    function openLV0(unitId = 0) {
        showView('view-lv0');
        renderLV0Tabs(unitId);
        loadLV0Words(unitId);
    }

    function renderLV0Tabs(activeUnitId) {
        const tabsDiv = document.getElementById('lv0-tabs');
        tabsDiv.innerHTML = `<button class="unit-tab ${activeUnitId === 0 ? 'active' : ''}" onclick="openLV0(0)">✨ 全部單詞 (${WORD_DATA.length})</button>`;
        UNITS.forEach(u => {
            tabsDiv.innerHTML += `<button class="unit-tab ${activeUnitId === u.id ? 'active' : ''}" onclick="openLV0(${u.id})">${u.title.split(':')[0]}</button>`;
        });
    }

    function loadLV0Words(unitId) {
        const listDiv = document.getElementById('lv0-word-list');
        listDiv.innerHTML = '';
        let filtered = unitId === 0 ? WORD_DATA : WORD_DATA.filter(w => w.u === unitId);
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'word-card';
            card.onclick = () => speakText(item.w, 'en-US');
            let sampleSentence = Array.isArray(item.q) ? item.q[0] : item.q;
            card.innerHTML = `
                <div class="word-title">
                    <span>${item.w}</span>
                    <span class="word-pos">${item.pos}</span>
                </div>
                <div class="word-cn">💡 ${item.cn}</div>
                <div class="word-def">📖 ${item.def}</div>
                <div class="word-eg">💬 ${sampleSentence.replace('____', `<b><u>${item.w}</u></b>`)}</div>
            `;
            listDiv.appendChild(card);
        });
    }

    function openChapterSelect(mode) {
        currentMode = mode;
        selectedUnitId = 0;
        
        const btnArea = document.getElementById('cs-buttons');
        btnArea.innerHTML = '';

        UNITS.forEach(u => {
            btnArea.innerHTML += `<button class="chapter-btn" id="btn-u${u.id}" onclick="selectUnit(${u.id})">📌 ${u.title}</button>`;
        });
        btnArea.innerHTML += `<button class="chapter-btn selected" id="btn-u0" onclick="selectUnit(0)">🌟 全範圍總溫習 (${WORD_DATA.length}個單詞)</button>`;

        showView('view-chapter-select');
    }

    function selectUnit(uId) {
        selectedUnitId = uId;
        document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('btn-u' + uId).classList.add('selected');
    }

    function startGame() {
        if (selectedUnitId === null || selectedUnitId === undefined) { alert('請先選擇溫習單元！'); return; }
        
        let rawWords = selectedUnitId === 0 ? WORD_DATA : WORD_DATA.filter(w => w.u === selectedUnitId);

        gameQueue = rawWords.map(item => ({
            w: item.w, 
            pos: item.pos,
            cn: item.cn,
            def: item.def,
            qSentences: Array.isArray(item.q) ? item.q : [item.q],
            requeued: false
        })).sort(() => Math.random() - 0.5);

        score = 0; currentQIndex = 0;
        document.getElementById('score-display').classList.remove('hidden');
        document.getElementById('current-score').innerText = score;
        showView('view-game');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentQIndex >= gameQueue.length) { finishGame(); return; }
        
        currentQFailed = false;
        let q = gameQueue[currentQIndex];
        // 每次載入題目時從該詞的 5 組例句中隨機抽取 1 條
        q.currentSentence = q.qSentences[Math.floor(Math.random() * q.qSentences.length)];

        document.getElementById('progress').innerText = `${currentQIndex + 1} / ${gameQueue.length}`;
        
        let textDiv = document.getElementById('question-text');
        let optArea = document.getElementById('options-area');
        let inputArea = document.getElementById('input-area');
        
        optArea.innerHTML = '';
        inputArea.classList.add('hidden');
        textDiv.style.fontSize = "20px";

        if (currentMode === 'LV1') {
            textDiv.innerHTML = `
                <div style="font-size: 42px; font-weight:800; color:var(--primary-color);">${q.w}</div>
                <div style="font-size: 16px; color:#888; margin-top:5px;">${q.pos}</div>
                <div style="font-size: 20px; font-weight:700; color:#333; margin-top:10px;">💡 ${q.cn}</div>
            `;
            optArea.innerHTML = `<button class="btn-primary" onclick="handleCorrectAnswer()" style="grid-column: 1/-1">唸完了，下一題 ➡️</button>`;
        } else if (currentMode === 'LV3') {
            textDiv.innerHTML = `
                <div style="font-size: 18px; color:#555; margin-bottom:10px;">💬 例句填空：</div>
                <div>${q.currentSentence}</div>
            `;
            renderOptions(q.w);
        } else if (currentMode === 'LV4') {
            let firstLetterHint = q.w.substring(0, 2) + "... (" + q.w.length + " letters)";
            textDiv.innerHTML = `
                <div style="font-size: 18px; color:#555; margin-bottom:10px;">🧩 首字母/長度提示填空：</div>
                <div>${q.currentSentence.replace('____', `<u>${firstLetterHint}</u>`)}</div>
            `;
            inputArea.classList.remove('hidden');
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').placeholder = '請輸入完整英文單詞';
            document.getElementById('answer-input').focus();
        } else if (currentMode === 'LV5') {
            textDiv.innerHTML = `
                <div style="font-size: 18px; color:#555; margin-bottom:10px;">📖 English Definition Matching:</div>
                <div style="font-weight:700; font-style:italic; color:#333; margin-bottom:8px;">"${q.def}"</div>
                <div style="font-size: 14px; color:#888;">Part of speech: <b>${q.pos}</b></div>
            `;
            renderOptions(q.w);
        } else if (currentMode === 'DICT') {
            textDiv.innerHTML = `
                <div style="font-size: 22px; font-weight:800; color:var(--primary-color); margin-bottom:10px;">🎧 Dictation Mode</div>
                <div style="font-size: 16px; color:#666; margin-bottom:10px;">請點擊右上角 📢 按鈕聽發音並拼寫單詞</div>
                <div style="font-size: 14px; color:#888;">Part of speech: <b>${q.pos}</b></div>
            `;
            inputArea.classList.remove('hidden');
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').placeholder = 'Type the word here';
            document.getElementById('answer-input').focus();
        } else if (currentMode === 'LV9') {
            textDiv.innerHTML = `
                <div style="font-size: 18px; color:#555; margin-bottom:10px;">🔥 挑戰無提示填空：</div>
                <div>${q.currentSentence}</div>
            `;
            inputArea.classList.remove('hidden');
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').placeholder = '請輸入英文單詞/短語';
            document.getElementById('answer-input').focus();
        }
        
        if(isAutoAudio) {
            readQuestionAuto();
        }
    }

    function renderOptions(correctW) {
        let opts = [correctW];
        while(opts.length < Math.min(4, WORD_DATA.length)) {
            let rand = WORD_DATA[Math.floor(Math.random()*WORD_DATA.length)].w;
            if(!opts.includes(rand)) opts.push(rand);
        }
        opts.sort(() => Math.random() - 0.5).forEach(o => {
            let b = document.createElement('button');
            b.innerText = o;
            b.onclick = () => {
                if(o === correctW) {
                    b.classList.add('correct-anim');
                    handleCorrectAnswer();
                } else {
                    b.classList.add('wrong-anim');
                    setTimeout(() => b.classList.remove('wrong-anim'), 500);
                    currentQFailed = true;
                    showWrong(correctW);
                }
            };
            document.getElementById('options-area').appendChild(b);
        });
    }

    function normalize(str) {
        return str.trim().toLowerCase().replace(/[\s\-_,.'"]+/g, '');
    }

    function checkInputAnswer() {
        let val = document.getElementById('answer-input').value;
        let q = gameQueue[currentQIndex];
        
        if(normalize(val) === normalize(q.w)) {
            document.getElementById('answer-input').classList.add('correct-anim');
            handleCorrectAnswer();
        } else {
            document.getElementById('answer-input').classList.add('wrong-anim');
            setTimeout(() => document.getElementById('answer-input').classList.remove('wrong-anim'), 500);
            currentQFailed = true;
            showWrong(q.w);
        }
    }

    function showWrong(ans) {
        let q = gameQueue[currentQIndex];
        document.getElementById('correct-ans').innerText = ans;
        document.getElementById('correct-extra').innerText = `💡 ${q.pos} - ${q.cn}`;
        document.getElementById('wrong-modal').classList.remove('hidden');

        // 錯題自動重練：若尚未重排，將錯題加入隊尾
        if (!q.requeued) {
            q.requeued = true;
            gameQueue.push({
                w: q.w,
                pos: q.pos,
                cn: q.cn,
                def: q.def,
                qSentences: q.qSentences,
                requeued: true
            });
        }

        if(isAutoAudio) speakText("Incorrect. The answer is " + ans, 'en-US');
    }

    function closeModal() {
        document.getElementById('wrong-modal').classList.add('hidden');
    }

    function handleCorrectAnswer() {
        let pts = currentMode === 'LV9' ? 20 : 10;
        let q = gameQueue[currentQIndex];
        
        speakText(q.w, 'en-US');

        // 僅首考答對給分（重排題不重複得分）
        if (!currentQFailed && !q.requeued && currentMode !== 'LV1') {
            score += pts;
            document.getElementById('current-score').innerText = score;
        }

        setTimeout(() => {
            currentQIndex++;
            loadQuestion();
        }, 1100);
    }

    function readQuestionAuto() {
        let q = gameQueue[currentQIndex];
        if (currentMode === 'LV1' || currentMode === 'DICT') {
            speakText(q.w, 'en-US');
        } else if (currentMode === 'LV5') {
            speakText(q.def, 'en-US');
        } else if (currentMode === 'LV3' || currentMode === 'LV4' || currentMode === 'LV9') {
            speakText(q.currentSentence.replace('____', 'blank'), 'en-US');
        }
    }

    function readQuestionManual() {
        let q = gameQueue[currentQIndex];
        if (currentMode === 'LV1' || currentMode === 'DICT') {
            speakText(q.w, 'en-US');
        } else if (currentMode === 'LV5') {
            speakText(q.def, 'en-US');
        } else {
            speakText(q.currentSentence.replace('____', 'blank'), 'en-US');
        }
    }

    function speakText(t, lang = 'en-US') {
        synth.cancel();
        let u = new SpeechSynthesisUtterance(t);
        u.lang = lang;
        u.rate = 0.85;
        synth.speak(u);
    }

    function finishGame() {
        showView('view-results');
        let name = document.getElementById('player-name').value || 'Heidy';
        document.getElementById('res-name').innerText = `太棒了，${name}！完成本次挑戰 🎉`;
        document.getElementById('final-score').innerText = score + "分";
        
        let unitText = selectedUnitId === 0 ? '全範圍' : `Unit ${selectedUnitId}`;
        saveToLeaderboard(name, currentMode, unitText, score);
    }

    function saveToLeaderboard(name, mode, rangeText, score) {
        let list = JSON.parse(localStorage.getItem('f2_glossary_rank') || '[]');
        list.unshift({ name, mode, rangeText, score });
        localStorage.setItem('f2_glossary_rank', JSON.stringify(list.slice(0, 10)));
    }

    function updateLeaderboardDisplay() {
        let list = JSON.parse(localStorage.getItem('f2_glossary_rank') || '[]');
        let html = list.map(i => `<tr><td>${i.name}</td><td>${i.mode}</td><td>${i.rangeText}</td><td><b>${i.score}</b></td></tr>`).join('');
        document.getElementById('leaderboard-body').innerHTML = html || '<tr><td colspan="4">暫無挑戰記錄</td></tr>';
    }

    window.onload = () => {
        renderHomeUnits();
        updateLeaderboardDisplay();
    };
</script>
</body>
</html>
