        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .mode-btn { padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.9em; color: white; transition: 0.2s; }
        .btn-lv0 { background: #9b59b6; } .btn-lv1 { background: #c0392b; } .btn-lv2 { background: #2c3e50; grid-column: span 2; }
        .full-text-box { background: #f8f9fa; border-left: 5px solid var(--accent); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .section-title { font-weight: bold; color: var(--primary); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px;}
        .source-full { font-size: 1.5em; line-height: 2.2; letter-spacing: 1.5px; margin-bottom: 25px; color: #2d3436; }
        .trans-full { font-size: 1.15em; color: #4a5568; line-height: 1.8; }
        .answer-section { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .ans-box { padding: 12px; border-radius: 8px; font-size: 0.85em; line-height: 1.6; }
        .box-note { background: #fff5e6; border: 1px solid #f39c12; }
        .box-exercise { background: #fdf2f2; border: 1px solid #e74c3c; }
        .box-translate { background: #f0fff4; border: 1px solid #27ae60; grid-column: span 2; }
        .char-span { cursor: pointer; padding: 0 1px; border-radius: 4px; transition: 0.2s; display: inline-block; position: relative; }
        .char-span:hover { background: #dfe6e9; }
        
        /* 1. 注釋 (黃/橙字)：圓滑自然下括弧 (︶) */
        .note-orange { 
            color: var(--note-orange); 
            font-weight: bold; 
            position: relative;
            padding-bottom: 5px;
        }
        .note-orange::after {
            content: "";
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: 0;
            height: 4px;
            border-bottom: 2px solid var(--note-orange);
            border-radius: 0 0 50% 50%;
        }

        /* 2. 練習字詞：淺紅色背景高亮 */
        .exercise-red { 
            color: var(--exercise-red); 
            font-weight: bold; 
            background-color: #ffeef0; 
            padding: 2px 0; 
        }

        /* 加點字/關鍵字：圓滑紅色下括弧 (︶) */
        .target-underline {
            position: relative;
            padding-bottom: 5px;
        }
        .target-underline::after {
            content: "";
            position: absolute;
            left: 5%;
            right: 5%;
            bottom: 0;
            height: 4px;
            border-bottom: 2px solid var(--exercise-red);
            border-radius: 0 0 50% 50%;
        }

        .trans-green { color: var(--translate-green); font-weight: bold; background-color: #e6ffed; padding: 2px 0; }
        .blue-highlight { color: var(--highlight-blue); border-bottom: 3px solid var(--highlight-blue); font-weight: bold; }
        
        .opt-btn { display: block; width: 100%; padding: 18px; margin: 12px 0; border: 2px solid #eee; border-radius: 12px; background: white; text-align: left; cursor: pointer; font-size: 1.1em; }
        .correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .wrong { background: var(--error) !important; color: white; border-color: var(--error); }
        .dictation-input { width: 100%; padding: 15px; font-size: 1.2em; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; margin: 20px 0; }
        .feedback-msg { padding: 15px; border-radius: 10px; font-weight: bold; margin-top: 10px; display: none; }
        .hidden { display: none !important; }
        .footer { margin-top: 30px; display: flex; gap: 10px; position: sticky; bottom: 0; background: white; padding: 10px; border-top: 1px solid #eee; }
        .nav-btn { flex: 1; padding: 16px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; background: #bdc3c7; }

</head>

            "不言而色欲之。": { ans: "沒開口而神色上想要這把劍。", o: ["沒開口而神色上想要這把劍。", "不說話但是顏色很好看。", "不說話是因為想要它。"] }, 
            "然其心許之矣。": { ans: "然而他心裏已答應徐君了。", o: ["然而他心裏已答應徐君了。", "然而他心裡允許了。", "雖然心裡稱許他。"] }

    },

            "歲亦無恙": { target: "歲、恙", ans: "年成、災害", o: ["年成、災害", "歲數、生病", "歲月、恙蟲"] }, 
            "使者不說": { target: "說", ans: "同「悅」", o: ["同「悅」", "不說話", "說服"] },

        },
        translations: { 
            "苟無歲，何以有民？": { ans: "如果沒有好的年成，怎樣能保住百姓。", o: ["如果沒有好的年成，怎樣能保住百姓。", "如果沒有歲月，怎麼會有人民？", "苟且偷生，如何面對百姓？"] }, 
            "故有舍本而問末者耶？": { ans: "所以哪有拋棄根本而詢問次要的呢？", o: ["所以哪有拋棄根本而詢問次要的呢？", "所以有捨棄本子去問末尾的嗎？", "故意捨本逐末難道對嗎？"] }

};

let currentChapter = null, quizPool = [], qIdx = 0, isDictationMode = false;

function init() {
    const list = document.getElementById('chapter-list'); list.innerHTML = '';
    for (let id in chaptersData) {
        const item = chaptersData[id]; const card = document.createElement('div');
        card.className = 'chapter-card'; card.innerHTML = `<div style="font-weight:bold;">${item.t}</div><div class="btn-group">
            <button class="mode-btn btn-lv0" onclick="startLV0(${id})">LV0 全篇對照</button>
            <button class="mode-btn btn-lv1" onclick="startQuiz(${id}, false)">LV1 選擇挑戰</button>
            <button class="mode-btn btn-lv2" onclick="startQuiz(${id}, true)">LV2 默寫挑戰</button></div>`;
        list.appendChild(card);
    }
}

function startLV0(id) {
    const c = chaptersData[id]; currentChapter = c;
    document.getElementById('lv0-head').innerText = c.t; document.getElementById('source-tag').innerText = `(${c.tag})`;
    
    let s = c.fullSource;
    let charMap = Array(s.length).fill(null);

    // 1. 處理綠色翻譯
    for(let k in c.translations) {
        let start = 0, idx = -1;
        while((idx = s.indexOf(k, start)) !== -1) {
            for(let i = idx; i < idx + k.length; i++) {
                charMap[i] = { type: 'trans' };
            }
            start = idx + 1;
        }
    }

    // 2. 處理橙/黃色注釋 (圓滑下括弧 ︶)
    for(let k in c.notes) {
        let start = 0, idx = -1;
        while((idx = s.indexOf(k, start)) !== -1) {
            for(let i = idx; i < idx + k.length; i++) {
                if(!charMap[i]) charMap[i] = { type: 'note' };
            }
            start = idx + 1;
        }
    }

    // 3. 處理紅色練習字詞（紅色背景高亮 + 加點字加圓滑下括弧 ︶）
    for(let phrase in c.exercises) {
        let target = c.exercises[phrase].target;
        let targets = target ? target.split('、') : [];
        let start = 0, idx = -1;
        
        while((idx = s.indexOf(phrase, start)) !== -1) {
            for(let i = idx; i < idx + phrase.length; i++) {
                let char = s[i];
                let isTarget = targets.includes(char);
                if(!charMap[i] || charMap[i].type !== 'trans') {
                    charMap[i] = { type: 'exercise', isTarget: isTarget };
                }
            }
            start = idx + 1;
        }
    }

    // 渲染 HTML
    let html = "";
    for(let i = 0; i < s.length; i++) {
        let char = s[i];
        let map = charMap[i];
        let cls = "char-span";

        if(map) {
            if(map.type === 'trans') cls += " trans-green";
            else if(map.type === 'note') cls += " note-orange";
            else if(map.type === 'exercise') {
                cls += " exercise-red";
                if(map.isTarget) cls += " target-underline";
            }
        }

        html += `<span class="${cls}" onclick="speak('${char}')">${char}</span>`;
    }

    document.getElementById('lv0-source').innerHTML = html; 
    document.getElementById('lv0-trans').innerText = c.fullTrans;

    // 渲染列表
    let nH = ""; 
    for(let k in c.notes) nH += `• <b>${k}</b>: ${c.notes[k].ans}<br>`; 
    document.getElementById('lv0-notes-list').innerHTML = nH;

    let eH = ""; 
    for(let phrase in c.exercises) {
        let ex = c.exercises[phrase];
        let formattedPhrase = phrase;
        if(ex.target) {
            ex.target.split('、').forEach(t => {
                formattedPhrase = formattedPhrase.replace(new RegExp(t, 'g'), `<u>${t}</u>`);
            });
        }
        eH += `• <b>${formattedPhrase}</b>: ${ex.ans}<br>`; 
    }
    document.getElementById('lv0-ex-list').innerHTML = eH;

    let tH = ""; 
    for(let k in c.translations) tH += `• <b>${k}</b><br> 👉 ${c.translations[k].ans}<br>`; 
    document.getElementById('lv0-trans-list').innerHTML = tH;

    window.curRaw = c.fullSource; window.curTrans = c.fullTrans; switchScreen('screen-lv0');
}

function startQuiz(id, dictation) {
    const c = chaptersData[id]; currentChapter = c; isDictationMode = dictation; quizPool = [];
    
    // 建立題目池
    for(let k in c.notes) {
        quizPool.push({ type: "注釋", q: `「${k}」的意思是？`, a: c.notes[k].ans, o: c.notes[k].o, kw: [k] });
    }
    for(let phrase in c.exercises) {
        let ex = c.exercises[phrase];
        let formattedQ = phrase;
        if(ex.target) {
            ex.target.split('、').forEach(t => {
                formattedQ = formattedQ.replace(new RegExp(t, 'g'), `<u>${t}</u>`);
            });
        }
        quizPool.push({ type: "練習", q: `「${formattedQ}」中加點/底線字的意思是？`, a: ex.ans, o: ex.o, kw: [phrase] });
    }
    for(let k in c.translations) {
        quizPool.push({ type: "翻譯/理解", q: `題目：「${k}」`, a: c.translations[k].ans, o: c.translations[k].o, kw: [k] });
    }

    quizPool.sort(() => Math.random() - 0.5); qIdx = 0; window.curRaw = c.fullSource; switchScreen('screen-quiz');
    const b = document.getElementById('mode-badge'); b.innerText = isDictationMode ? "LV2 默寫挑戰" : "LV1 選擇挑戰"; b.style.background = isDictationMode ? "#2c3e50" : "#c0392b"; renderQ();
}

function renderQ() {
    const q = quizPool[qIdx]; document.getElementById('quiz-progress').innerText = `${qIdx+1} / ${quizPool.length}`;
    document.getElementById('quiz-question').innerHTML = `【${q.type}題】${q.q}`;
    let context = window.curRaw;
    q.kw.forEach(k => { if(context.indexOf(k) !== -1) context = context.replace(new RegExp(k, 'g'), `<span class="blue-highlight">${k}</span>`); });
    document.getElementById('quiz-source-context').innerHTML = context;
    document.getElementById('feedback-msg').style.display = "none"; document.getElementById('next-btn').classList.add('hidden');
    
    const optContainer = document.getElementById('quiz-options');
    const dictContainer = document.getElementById('quiz-dictation');

    if(isDictationMode) {
        optContainer.classList.add('hidden'); dictContainer.classList.remove('hidden');
        document.getElementById('user-input').value = ""; document.getElementById('user-input').disabled = false; document.getElementById('user-input').focus();
    } else {
        dictContainer.classList.add('hidden'); optContainer.classList.remove('hidden');
        optContainer.innerHTML = '';
        [...q.o].sort(() => Math.random() - 0.5).forEach(o => {
            const btn = document.createElement('button'); btn.className = 'opt-btn'; btn.innerText = o;
            btn.onclick = () => handleAnswer(o === q.a, q.a, btn); optContainer.appendChild(btn);
        });
    }
    if(document.getElementById('auto-read-toggle').checked) {
        let speakText = q.q.replace(/<[^>]+>/g, '');
        speak(speakText);
    }
}

function handleAnswer(isCorrect, correctAns, btn = null) {
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
    if(isCorrect) { if(btn) btn.classList.add('correct'); speakFeedback(true); } 
    else { if(btn) btn.classList.add('wrong'); document.querySelectorAll('.opt-btn').forEach(b => { if(b.innerText === correctAns) b.classList.add('correct'); }); speakFeedback(false, correctAns); }
    document.getElementById('next-btn').classList.remove('hidden');
}

function checkDictation() {
    const q = quizPool[qIdx], input = document.getElementById('user-input').value.trim();
    const clean = (s) => s.replace(/[，。！？：、()（）_]/g, "");
    const isCorrect = clean(input) === clean(q.a), fb = document.getElementById('feedback-msg');
    fb.style.display = "block"; document.getElementById('user-input').disabled = true;
    if(isCorrect) { fb.innerText = "答對了！"; fb.style.background = "#e6ffed"; fb.style.color = "#27ae60"; speakFeedback(true); } 
    else { fb.innerText = `答錯了。正確答案係：${q.a}`; fb.style.background = "#fdf2f2"; fb.style.color = "#e74c3c"; speakFeedback(false, q.a); }
    document.getElementById('next-btn').classList.remove('hidden');
}

function nextQ() { 
    qIdx++; 
    if(qIdx < quizPool.length) renderQ(); 
    else { alert("🎉 完成挑戰！"); showMenu(); } 
}

function speak(t) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='zh-HK'; u.rate=0.9; window.speechSynthesis.speak(u); }
function speakFeedback(isC, ans = "") { window.speechSynthesis.cancel(); let msg = isC ? "答對了" : `答錯了，正確答案係 ${ans}`; const u = new SpeechSynthesisUtterance(msg); u.lang='zh-HK'; u.rate=0.9; window.speechSynthesis.speak(u); }
function speakTextId(type) { speak(type==='raw'?window.curRaw:window.curTrans); }
function switchScreen(id) { ['menu','screen-lv0','screen-quiz'].forEach(s => document.getElementById(s).classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); window.speechSynthesis.cancel(); }
function showMenu() { switchScreen('menu'); }
window.onload = init;
</script>
