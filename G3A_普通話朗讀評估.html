<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小公主普通話朗讀館 - 《水調歌頭》</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fde8ef 0%, #e9d5ff 50%, #c4e0e5 100%);
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* High Visibility Enlarged Ruby Pinyin Styling */
        ruby {
            ruby-position: over;
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            margin: 2px 5px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 4px 8px;
            border-radius: 14px;
        }
        
        rt {
            font-size: 1.25rem !important; /* Substantially enlarged for easy reading & printing */
            font-weight: 800 !important;
            color: #6b21a8 !important; /* Deep contrast purple for legibility */
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
            line-height: 1.3;
            margin-bottom: 3px;
            font-family: 'Fredoka', Arial, sans-serif;
            letter-spacing: 0.5px;
        }

        .char-box {
            font-size: var(--poem-font-size, 2.2rem);
            font-weight: 800;
            color: #3b0764;
            display: inline-block;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        ruby:hover {
            background-color: rgba(255, 255, 255, 0.9);
            transform: translateY(-4px) scale(1.12);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.25);
        }

        ruby.active-speech {
            background: linear-gradient(135deg, #fef08a, #fde047);
            border: 2px solid #eab308;
            transform: scale(1.22);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.8);
            animation: pulse-glow 0.8s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px #facc15, 0 0 18px #f43f5e; }
            100% { box-shadow: 0 0 22px #facc15, 0 0 35px #ec4899; }
        }

        /* Glassmorphism containers */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 32px rgba(236, 72, 153, 0.15);
        }

        .glass-btn {
            background: linear-gradient(135deg, #ffffff 0%, #fce7f3 100%);
            border: 2px solid #f472b6;
            transition: all 0.2s ease;
        }

        .glass-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 18px rgba(244, 114, 182, 0.35);
        }

        .sentence-row.highlight-sentence {
            background-color: rgba(253, 242, 248, 0.98);
            border-color: #ec4899 !important;
            box-shadow: 0 0 18px rgba(236, 72, 153, 0.3);
        }

        body.hide-pinyin rt {
            display: none !important;
        }

        /* Sparkle Background Canvas */
        .sparkle-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
            }
            header, nav, .no-print, #gameArena, #rewardsGrid, .sparkle-bg, button, select {
                display: none !important;
            }
            .tab-content {
                display: block !important;
            }
            .glass-card {
                background: none !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            .print-header {
                display: block !important;
                text-align: center;
                margin-bottom: 25px;
                border-bottom: 2px dashed #f472b6;
                padding-bottom: 15px;
            }
            .sentence-row {
                border: none !important;
                border-bottom: 1px solid #e2e8f0 !important;
                padding: 8px 0 !important;
                box-shadow: none !important;
            }
            rt {
                font-size: 1.35rem !important;
                color: #4c1d95 !important;
                font-weight: 900 !important;
            }
            .char-box {
                font-size: 2.3rem !important;
                color: #1e1b4b !important;
            }
        }

        .print-header {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col relative pb-12">
    <!-- Background Canvas -->
    <canvas id="sparkleCanvas" class="sparkle-bg"></canvas>

    <header class="sticky top-0 z-40 bg-white/85 backdrop-blur-md border-b-2 border-pink-200 px-4 py-3 shadow-md no-print">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-pink-400 to-purple-500 flex items-center justify-center text-white text-2xl shadow-md transform hover:rotate-12 transition">
                    👑
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent">
                        小公主普通話朗讀館
                    </h1>
                    <p class="text-xs font-semibold text-pink-500">《水調歌頭》 • 蘇軾 (三年級普通話朗讀評估)</p>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="flex items-center gap-2 md:gap-4 bg-pink-50/90 border border-pink-200 px-4 py-1.5 rounded-full shadow-inner">
                <div class="flex items-center gap-1.5" title="魔法星星">
                    <span class="text-xl animate-bounce">⭐</span>
                    <span id="starCount" class="font-black text-pink-600 text-lg">0</span>
                </div>
                <div class="w-px h-6 bg-pink-200"></div>
                <div class="flex items-center gap-1.5" title="皇家皇冠">
                    <span class="text-xl">👑</span>
                    <span id="crownCount" class="font-black text-purple-600 text-lg">0</span>
                </div>
                <div class="w-px h-6 bg-pink-200"></div>
                <div class="flex items-center gap-1.5">
                    <span id="princessTitle" class="text-xs font-bold text-pink-700 bg-pink-200 px-2 py-0.5 rounded-full">
                        朗讀小騎士
                    </span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full px-3 md:px-6 pt-4 flex-1 z-10">
        <!-- Navigation Tabs -->
        <nav class="flex justify-center flex-wrap gap-2 md:gap-3 mb-6 no-print">
            <button onclick="switchTab('reading')" id="tabBtn-reading" class="tab-btn glass-btn px-4 md:px-5 py-2.5 rounded-2xl font-bold text-xs md:text-sm text-pink-700 flex items-center gap-1.5 shadow-sm border-2 border-pink-400 bg-pink-100">
                <span>🌸</span> 朗讀與點讀
            </button>
            <button onclick="switchTab('match')" id="tabBtn-match" class="tab-btn glass-btn px-4 md:px-5 py-2.5 rounded-2xl font-bold text-xs md:text-sm text-purple-700 flex items-center gap-1.5 shadow-sm border-2 border-transparent">
                <span>💎</span> 字音配對遊戲
            </button>
            <button onclick="switchTab('fill')" id="tabBtn-fill" class="tab-btn glass-btn px-4 md:px-5 py-2.5 rounded-2xl font-bold text-xs md:text-sm text-indigo-700 flex items-center gap-1.5 shadow-sm border-2 border-transparent">
                <span>✏️</span> 填空小高手
            </button>
            <button onclick="switchTab('assess')" id="tabBtn-assess" class="tab-btn glass-btn px-4 md:px-5 py-2.5 rounded-2xl font-bold text-xs md:text-sm text-rose-700 flex items-center gap-1.5 shadow-sm border-2 border-transparent">
                <span>🎙️</span> 朗讀評估
            </button>
            <button onclick="switchTab('trophy')" id="tabBtn-trophy" class="tab-btn glass-btn px-4 md:px-5 py-2.5 rounded-2xl font-bold text-xs md:text-sm text-amber-700 flex items-center gap-1.5 shadow-sm border-2 border-transparent">
                <span>🏰</span> 皇冠寶物庫
            </button>
        </nav>

        <!-- ================= TAB 1: READING & AUDIO ================= -->
        <section id="page-reading" class="tab-content space-y-6">
            
            <!-- Controls Toolbar -->
            <div class="glass-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4 no-print">
                <div class="flex flex-wrap items-center gap-2 md:gap-3">
                    <!-- Toggle Pinyin -->
                    <button onclick="togglePinyin()" id="pinyinToggleBtn" class="px-3.5 py-2 rounded-xl bg-pink-500 text-white font-bold text-xs md:text-sm shadow-sm hover:bg-pink-600 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-eye"></i> 拼音顯示：開
                    </button>
                    
                    <!-- Font Size Controls -->
                    <div class="flex items-center bg-white/90 rounded-xl px-2 py-1.5 border border-pink-200">
                        <span class="text-xs font-bold text-pink-600 mr-1.5">字體:</span>
                        <button onclick="changeFontSize(-0.15)" class="px-2 py-0.5 rounded text-pink-600 hover:bg-pink-100 font-bold text-xs">-A</button>
                        <button onclick="resetFontSize()" class="px-2 py-0.5 rounded text-pink-600 hover:bg-pink-100 font-bold text-xs">重置</button>
                        <button onclick="changeFontSize(0.15)" class="px-2 py-0.5 rounded text-pink-600 hover:bg-pink-100 font-bold text-xs">+A</button>
                    </div>

                    <!-- Speech Speed Rate Selector (0.5x added) -->
                    <div class="flex items-center bg-white/90 rounded-xl px-2.5 py-1.5 border border-purple-200">
                        <span class="text-xs font-bold text-purple-700 mr-1.5"><i class="fa-solid fa-gauge-high"></i> 語速:</span>
                        <select id="speechRateSelect" class="bg-transparent text-xs font-bold text-purple-800 focus:outline-none cursor-pointer">
                            <option value="0.5">0.5x (超慢速)</option>
                            <option value="0.8">0.8x (慢速)</option>
                            <option value="1.0" selected>1.0x (標準)</option>
                            <option value="1.2">1.2x (快速)</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <!-- Print Button -->
                    <button onclick="triggerPrint()" class="px-3.5 py-2 rounded-xl bg-purple-600 text-white font-bold text-xs md:text-sm shadow-md hover:bg-purple-700 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-print"></i> 🖨️ 列印/打印詩詞
                    </button>

                    <!-- Play All & Stop -->
                    <button onclick="playFullPoem()" id="fullReadBtn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-xs md:text-sm shadow-md hover:opacity-90 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-play"></i> 全文朗讀
                    </button>
                    <button onclick="stopSpeech()" class="px-3 py-2 rounded-xl bg-slate-200 text-slate-700 font-bold text-xs md:text-sm hover:bg-slate-300 transition" title="停止">
                        <i class="fa-solid fa-square"></i>
                    </button>
                </div>
            </div>

            <!-- Print Banner Header -->
            <div class="print-header">
                <h1 class="text-3xl font-black text-purple-900">《水調歌頭》 蘇軾</h1>
                <p class="text-sm text-pink-700 font-bold mt-1">小公主普通話朗讀與評估專用工作紙 (特大拼音對照本)</p>
            </div>

            <!-- Poem Card Container -->
            <div class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl relative border-2 border-pink-200">
                <!-- Poem Title Header -->
                <div class="text-center mb-8 pb-4 border-b-2 border-dashed border-pink-200">
                    <div class="inline-block text-center py-2 px-6 rounded-2xl bg-pink-50/80 border border-pink-200 shadow-sm">
                        <div id="poemTitle" class="flex justify-center items-end flex-wrap gap-1">
                            <!-- Populated by JS -->
                        </div>
                        <div id="poemAuthor" class="flex justify-center items-end flex-wrap gap-1 mt-2 text-sm">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Poem Body -->
                <div id="poemBody" class="space-y-6 max-w-3xl mx-auto">
                    <!-- Populated by JS -->
                </div>
            </div>
        </section>

        <!-- ================= TAB 2: PINYIN MATCH GAME ================= -->
        <section id="page-match" class="tab-content hidden space-y-6">
            <div class="glass-card rounded-3xl p-6 md:p-8 border-2 border-purple-200">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-black text-purple-800">💎 字音配對遊戲</h2>
                        <p class="text-xs text-slate-600 mt-1">請點擊正確的拼音與漢字配對，賺取魔法寶石！</p>
                    </div>
                    <span id="matchScore" class="bg-purple-100 text-purple-800 font-black px-4 py-1.5 rounded-full text-sm">
                        得分: 0
                    </span>
                </div>
                <div id="matchGameContainer" class="min-h-[320px] flex flex-col justify-center">
                    <!-- Dynamic Match Game Rendered Here -->
                </div>
            </div>
        </section>

        <!-- ================= TAB 3: FILL IN BLANKS ================= -->
        <section id="page-fill" class="tab-content hidden space-y-6">
            <div class="glass-card rounded-3xl p-6 md:p-8 border-2 border-indigo-200">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-black text-indigo-800">✏️ 填空小高手</h2>
                        <p class="text-xs text-slate-600 mt-1">選出詩句中缺少的正確漢字！</p>
                    </div>
                </div>
                <div id="fillGameContainer" class="min-h-[320px] flex flex-col justify-center">
                    <!-- Dynamic Fill Game Rendered Here -->
                </div>
            </div>
        </section>

        <!-- ================= TAB 4: READING ASSESSMENT ================= -->
        <section id="page-assess" class="tab-content hidden space-y-6">
            <div class="glass-card rounded-3xl p-6 md:p-8 border-2 border-rose-200 text-center">
                <h2 class="text-xl font-black text-rose-800 mb-1">🎙️ 小公主朗讀評估測試</h2>
                <p class="text-xs text-slate-600 mb-6">請聆聽標準示範後，按麥克風進行朗讀跟讀測驗！</p>
                <div id="assessContainer">
                    <!-- Assessment UI rendered via JS -->
                </div>
            </div>
        </section>

        <!-- ================= TAB 5: TROPHY & CROWNS ================= -->
        <section id="page-trophy" class="tab-content hidden space-y-6">
            <div class="glass-card rounded-3xl p-6 md:p-8 border-2 border-amber-200 text-center">
                <h2 class="text-2xl font-black text-amber-800 flex items-center justify-center gap-2">
                    <span>👑</span> 小公主的皇冠寶物庫 <span>🏰</span>
                </h2>
                <p class="text-xs text-slate-600 mt-1">積攢魔法星星，解鎖皇家夢幻寶物！</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 mt-6" id="rewardsGrid">
                    <!-- Rewards rendered via JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Dialog -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 no-print">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center border-4 border-pink-300 shadow-2xl">
            <div id="modalIcon" class="text-5xl mb-3">✨</div>
            <h3 id="modalTitle" class="text-xl font-black text-pink-700 mb-2">標題</h3>
            <p id="modalMessage" class="text-xs md:text-sm text-slate-600 mb-6">訊息...</p>
            <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold shadow-md hover:opacity-90">
                好棒！知道了
            </button>
        </div>
    </div>

                        { char: '月', pinyin: 'yuè' },
                        { char: '有', pinyin: 'yǒu' },
                        { char: '陰', pinyin: 'yīn' },
                        { char: '晴', pinyin: 'qíng' },
                        { char: '圓', pinyin: 'yuán' },
                        { char: '缺', pinyin: 'quē' },
                        { char: '，', pinyin: '' },
                        { char: '此', pinyin: 'cǐ' },
                        { char: '事', pinyin: 'shì' },
                        { char: '古', pinyin: 'gǔ' },
                        { char: '難', pinyin: 'nán' },
                        { char: '全', pinyin: 'quán' },
                        { char: '。', pinyin: '' }
                    ]
                },
                {
                    id: 7,
                    text: '但願人長久，千里共嬋娟。',
                    words: [
                        { char: '但', pinyin: 'dàn' },
                        { char: '願', pinyin: 'yuàn' },
                        { char: '人', pinyin: 'rén' },
                        { char: '長', pinyin: 'cháng' },
                        { char: '久', pinyin: 'jiǔ' },
                        { char: '，', pinyin: '' },
                        { char: '千', pinyin: 'qiān' },
                        { char: '里', pinyin: 'lǐ' },
                        { char: '共', pinyin: 'gòng' },
                        { char: '嬋', pinyin: 'chán' },
                        { char: '娟', pinyin: 'juān' },
                        { char: '。', pinyin: '' }
                    ]
                }
            ]
        };

        const REWARDS = [
            { id: 'wand', name: '仙女水晶魔法棒', cost: 15, icon: '🪄', desc: '散發夢幻微光', unlocked: false },
            { id: 'crown', name: '璀璨鑽石皇冠', cost: 30, icon: '👑', desc: '高貴榮譽標誌', unlocked: false },
            { id: 'shoes', name: '夢幻琉璃水晶鞋', cost: 50, icon: '👠', desc: '優雅舞蹈舞鞋', unlocked: false },
            { id: 'castle', name: '粉紅雲端城堡', cost: 80, icon: '🏰', desc: '夢幻公主城堡', unlocked: false },
            { id: 'unicorn', name: '星光飛天獨角獸', cost: 110, icon: '🦄', desc: '星空飛行夥伴', unlocked: false },
            { id: 'throne', name: '皇家金典玉座', cost: 150, icon: '🪑', desc: '朗讀大師象徵', unlocked: false }
        ];

        let appState = {
            stars: parseInt(localStorage.getItem('p3_stars') || '0'),
            crowns: parseInt(localStorage.getItem('p3_crowns') || '0'),
            showPinyin: true,
            fontSizeScale: 1.0,
            isPlayingFull: false,
            unlockedRewards: JSON.parse(localStorage.getItem('p3_rewards') || '[]')
        };

        let synth = window.speechSynthesis;
        let selectedVoice = null;

        function loadMandarinVoice() {
            if (!synth) return;
            const voices = synth.getVoices();
            selectedVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh_CN')) ||
                            voices.find(v => v.lang.startsWith('zh')) || null;
        }

        if (synth) {
            loadMandarinVoice();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = loadMandarinVoice;
            }
        }

        function speakText(text, onEndCallback = null) {
            if (!synth) {
                if (onEndCallback) onEndCallback();
                return;
            }
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            if (selectedVoice) utterance.voice = selectedVoice;

            const rateSelect = document.getElementById('speechRateSelect');
            utterance.rate = rateSelect ? parseFloat(rateSelect.value) : 1.0;
            utterance.pitch = 1.1;

            if (onEndCallback) {
                utterance.onend = onEndCallback;
                utterance.onerror = onEndCallback;
            }

            synth.speak(utterance);
        }

        function stopSpeech() {
            if (synth) synth.cancel();
            appState.isPlayingFull = false;
            clearHighlights();
        }

        function renderPoem() {
            const titleContainer = document.getElementById('poemTitle');
            const authorContainer = document.getElementById('poemAuthor');
            const bodyContainer = document.getElementById('poemBody');

            titleContainer.innerHTML = POEM_DATA.title.map(item => `
                <ruby onclick="speakWord('${item.char}')">
                    <span class="char-box">${item.char}</span>
                    <rt>${item.pinyin}</rt>
                </ruby>
            `).join('');

            authorContainer.innerHTML = '~~ ' + POEM_DATA.author.map(item => `
                <ruby onclick="speakWord('${item.char}')">
                    <span class="char-box" style="font-size:1.3rem;">${item.char}</span>
                    <rt>${item.pinyin}</rt>
                </ruby>
            `).join('');

            bodyContainer.innerHTML = POEM_DATA.sentences.map((sentence, sIdx) => {
                const rubyWords = sentence.words.map((w, wIdx) => {
                    if (!w.pinyin) {
                        return `<span class="text-2xl font-bold text-pink-400 mx-0.5">${w.char}</span>`;
                    }
                    return `
                        <ruby id="ruby-${sIdx}-${wIdx}" onclick="speakWord('${w.char}', ${sIdx}, ${wIdx})">
                            <span class="char-box">${w.char}</span>
                            <rt>${w.pinyin}</rt>
                        </ruby>
                    `;
                }).join('');

                return `
                    <div id="sentence-row-${sIdx}" class="sentence-row border-2 border-pink-100 bg-white/70 p-3.5 md:p-4 rounded-2xl flex items-center justify-between gap-3 shadow-sm hover:border-pink-300 transition">
                        <div class="flex-1 flex flex-wrap items-center">
                            ${rubyWords}
                        </div>
                        <button onclick="speakSentence(${sIdx})" class="no-print w-10 h-10 rounded-full bg-pink-100 hover:bg-pink-200 text-pink-600 flex items-center justify-center text-lg shadow-sm transition flex-shrink-0" title="朗讀此句">
                            <i class="fa-solid fa-volume-high"></i>
                        </button>
                    </div>
                `;
            }).join('');

            updateFontSize();
        }

        function speakWord(char, sIdx = -1, wIdx = -1) {
            clearHighlights();
            if (sIdx >= 0 && wIdx >= 0) {
                const el = document.getElementById(`ruby-${sIdx}-${wIdx}`);
                if (el) el.classList.add('active-speech');
            }
            speakText(char, () => clearHighlights());
        }

        function speakSentence(sIdx) {
            clearHighlights();
            const sentenceObj = POEM_DATA.sentences[sIdx];
            const rowEl = document.getElementById(`sentence-row-${sIdx}`);
            if (rowEl) rowEl.classList.add('highlight-sentence');

            const rateSelect = document.getElementById('speechRateSelect');
            const currentRate = rateSelect ? parseFloat(rateSelect.value) : 1.0;
            const highlightDelay = Math.max(260, Math.round(400 / currentRate));

            let currentWIdx = 0;
            const highlightInterval = setInterval(() => {
                while (currentWIdx < sentenceObj.words.length && !sentenceObj.words[currentWIdx].pinyin) {
                    currentWIdx++;
                }
                if (currentWIdx < sentenceObj.words.length) {
                    clearHighlights(false);
                    if (rowEl) rowEl.classList.add('highlight-sentence');
                    const rubyEl = document.getElementById(`ruby-${sIdx}-${currentWIdx}`);
                    if (rubyEl) rubyEl.classList.add('active-speech');
                    currentWIdx++;
                } else {
                    clearInterval(highlightInterval);
                }
            }, highlightDelay);

            speakText(sentenceObj.text, () => {
                clearInterval(highlightInterval);
                clearHighlights();
                addStars(1);
            });
        }

        function playFullPoem() {
            appState.isPlayingFull = true;
            let sentenceIdx = 0;

            function playNext() {
                if (!appState.isPlayingFull || sentenceIdx >= POEM_DATA.sentences.length) {
                    appState.isPlayingFull = false;
                    clearHighlights();
                    addStars(5);
                    addCrowns(1);
                    showModal('全文朗讀完成！👑', '太棒了小公主！完成一次完整《水調歌頭》朗讀！獲得 5 星星 + 1 皇冠！');
                    return;
                }

                const currentObj = POEM_DATA.sentences[sentenceIdx];
                speakSentence(sentenceIdx);
                sentenceIdx++;

                const rateSelect = document.getElementById('speechRateSelect');
                const currentRate = rateSelect ? parseFloat(rateSelect.value) : 1.0;
                const estimatedDuration = Math.max(2800, Math.round((currentObj.words.length * 400 + 1300) / currentRate));

                setTimeout(() => {
                    if (appState.isPlayingFull) playNext();
                }, estimatedDuration);
            }

            playNext();
        }

        function clearHighlights(clearRows = true) {
            document.querySelectorAll('ruby.active-speech').forEach(el => el.classList.remove('active-speech'));
            if (clearRows) {
                document.querySelectorAll('.sentence-row.highlight-sentence').forEach(el => el.classList.remove('highlight-sentence'));
            }
        }

        function togglePinyin() {
            appState.showPinyin = !appState.showPinyin;
            document.body.classList.toggle('hide-pinyin', !appState.showPinyin);
            const btn = document.getElementById('pinyinToggleBtn');
            btn.innerHTML = appState.showPinyin ?
                '<i class="fa-solid fa-eye"></i> 拼音顯示：開' :
                '<i class="fa-solid fa-eye-slash"></i> 拼音顯示：關';
        }

        function changeFontSize(delta) {
            appState.fontSizeScale = Math.max(0.8, Math.min(1.5, appState.fontSizeScale + delta));
            updateFontSize();
        }

        function resetFontSize() {
            appState.fontSizeScale = 1.0;
            updateFontSize();
        }

        function updateFontSize() {
            document.documentElement.style.setProperty('--poem-font-size', `${2.2 * appState.fontSizeScale}rem`);
        }

        function triggerPrint() {
            window.print();
        }

        function switchTab(tabKey) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-pink-400', 'bg-pink-100');
                btn.classList.add('border-transparent');
            });

            document.getElementById(`page-${tabKey}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tabBtn-${tabKey}`);
            if (activeBtn) activeBtn.classList.add('border-pink-400', 'bg-pink-100');

            if (tabKey === 'match') initMatchGame();
            else if (tabKey === 'fill') initFillGame();
            else if (tabKey === 'assess') initAssessGame();
            else if (tabKey === 'trophy') renderTrophyRoom();
        }

        // Tab 2: Pinyin Match Game
        let matchScore = 0;
        function initMatchGame() {
            const pairs = [
                { char: '闕', pinyin: 'què' },
                { char: '瓊', pinyin: 'qióng' },
                { char: '綺', pinyin: 'qǐ' },
                { char: '嬋', pinyin: 'chán' },
                { char: '娟', pinyin: 'juān' },
                { char: '勝', pinyin: 'shèng' }
            ];

            let selectedChar = null;
            let currentPairs = [...pairs].sort(() => Math.random() - 0.5).slice(0, 4);

            const charList = [...currentPairs].sort(() => Math.random() - 0.5);
            const pinyinList = [...currentPairs].sort(() => Math.random() - 0.5);

            const container = document.getElementById('matchGameContainer');
            container.innerHTML = `
                <div class="grid grid-cols-2 gap-8 max-w-xl mx-auto w-full">
                    <div class="space-y-3">
                        <p class="text-xs font-bold text-purple-600 text-center mb-2">① 點擊漢字</p>
                        ${charList.map(item => `
                            <button onclick="selectMatchChar('${item.char}', this)" class="match-char-btn w-full p-3.5 rounded-2xl bg-white border-2 border-purple-200 text-2xl font-black text-purple-900 shadow-sm hover:border-purple-400">
                                ${item.char}
                            </button>
                        `).join('')}
                    </div>
                    <div class="space-y-3">
                        <p class="text-xs font-bold text-pink-600 text-center mb-2">② 點擊對應拼音</p>
                        ${pinyinList.map(item => `
                            <button onclick="selectMatchPinyin('${item.pinyin}', '${item.char}', this)" class="match-pinyin-btn w-full p-3.5 rounded-2xl bg-white border-2 border-pink-200 text-xl font-bold text-pink-600 shadow-sm hover:border-pink-400">
                                ${item.pinyin}
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            window.selectMatchChar = function(char, btn) {
                document.querySelectorAll('.match-char-btn').forEach(b => b.classList.remove('ring-4', 'ring-purple-400', 'bg-purple-100'));
                btn.classList.add('ring-4', 'ring-purple-400', 'bg-purple-100');
                selectedChar = char;
                speakText(char);
            };

            window.selectMatchPinyin = function(pinyin, targetChar, btn) {
                if (!selectedChar) {
                    showModal('請先選擇漢字', '請先點擊左邊的漢字，再選擇配對的拼音喔！', '💡');
                    return;
                }
                if (selectedChar === targetChar) {
                    matchScore += 10;
                    document.getElementById('matchScore').innerText = `得分: ${matchScore}`;
                    addStars(2);
                    showModal('配對成功！💎', `「${selectedChar}」的拼音就是「${pinyin}」！`, '✨');
                    btn.disabled = true;
                    btn.style.opacity = '0.3';
                    selectedChar = null;
                } else {
                    showModal('再試一次', '拼音不吻合喔，再仔細看一看！', '🌸');
                }
            };
        }

        // Tab 3: Fill Blanks Game
        function initFillGame() {
            const questions = [
                { text: '把酒問___天。', answer: '青', options: ['青', '晴', '輕'] },
                { text: '今夕是___年。', answer: '何', options: ['何', '河', '和'] },
                { text: '千里共___娟。', answer: '嬋', options: ['嬋', '蟬', '纏'] }
            ];
            let qIdx = 0;

            function renderQ() {
                const q = questions[qIdx];
                const container = document.getElementById('fillGameContainer');
                container.innerHTML = `
                    <div class="text-center py-6">
                        <p class="text-2xl font-bold text-slate-800 mb-8">${q.text.replace('___', '<span class="inline-block w-12 h-12 border-b-4 border-indigo-500 bg-indigo-50 rounded-xl text-indigo-600 text-center font-black">?</span>')}</p>
                        <div class="flex justify-center gap-4">
                            ${q.options.map(opt => `
                                <button onclick="checkFillAnswer('${opt}', '${q.answer}')" class="px-6 py-4 rounded-2xl bg-white border-2 border-indigo-300 font-black text-2xl text-indigo-700 hover:bg-indigo-50 shadow-md">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            window.checkFillAnswer = function(selected, ans) {
                if (selected === ans) {
                    addStars(3);
                    showModal('回答正確！✏️', `填入「${ans}」字完全正確！`, '🌟');
                    qIdx = (qIdx + 1) % questions.length;
                    setTimeout(renderQ, 1000);
                } else {
                    showModal('再試一次', '字的字形不正確喔，加油！', '💡');
                }
            };

            renderQ();
        }

        // Tab 4: Assessment
        function initAssessGame() {
            const container = document.getElementById('assessContainer');
            container.innerHTML = `
                <div class="max-w-md mx-auto space-y-6">
                    <div class="p-4 bg-rose-50 border-2 border-rose-200 rounded-2xl">
                        <p class="text-xs text-rose-500 font-bold mb-1">bǎ jiǔ wèn qīng tiān</p>
                        <p class="text-2xl font-black text-rose-900">把酒問青天</p>
                    </div>

                    <div class="flex justify-center gap-3">
                        <button onclick="speakText('把酒問青天')" class="px-4 py-2 rounded-xl bg-rose-100 text-rose-700 font-bold text-xs hover:bg-rose-200">
                            <i class="fa-solid fa-volume-high"></i> 聽示範
                        </button>
                    </div>

                    <button id="micAssessBtn" onclick="runSimulatedAssess()" class="w-20 h-20 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white text-3xl shadow-xl hover:scale-105 transition flex items-center justify-center mx-auto">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <p id="assessStatus" class="text-xs font-bold text-slate-500">點擊麥克風開始錄音跟讀測驗...</p>
                </div>
            `;

            window.runSimulatedAssess = function() {
                const btn = document.getElementById('micAssessBtn');
                const status = document.getElementById('assessStatus');

                btn.classList.add('animate-pulse', 'ring-4', 'ring-rose-300');
                status.innerText = '🔴 錄音中... 請朗讀「把酒問青天」';

                setTimeout(() => {
                    btn.classList.remove('animate-pulse', 'ring-4', 'ring-rose-300');
                    status.innerText = '✨ 評估分析中...';

                    setTimeout(() => {
                        addStars(5);
                        addCrowns(1);
                        showModal('朗讀評估：★★★★★ 5顆星滿分！', '聲調標準！咬字非常清晰！愛麗絲公主給你頒發最佳朗讀證書！👑', '👑');
                        status.innerText = '點擊麥克風開始錄音跟讀測驗...';
                    }, 1000);
                }, 3000);
            };
        }

        // Tab 5: Trophy Room
        function renderTrophyRoom() {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = REWARDS.map(r => {
                const isUnlocked = appState.unlockedRewards.includes(r.id);
                const canAfford = appState.stars >= r.cost;

                return `
                    <div class="glass-card rounded-2xl p-5 border-2 ${isUnlocked ? 'border-amber-300 bg-amber-50/80' : 'border-slate-200'} flex flex-col items-center text-center justify-between">
                        <div>
                            <div class="text-5xl mb-2 ${isUnlocked ? '' : 'filter grayscale opacity-50'}">
                                ${r.icon}
                            </div>
                            <h4 class="font-bold text-slate-800 text-sm">${r.name}</h4>
                            <p class="text-xs text-slate-500 mt-1">${r.desc}</p>
                        </div>

                        <div class="mt-4 w-full">
                            ${isUnlocked ? `
                                <span class="inline-block w-full py-1 rounded-xl bg-amber-200 text-amber-800 font-bold text-xs">
                                    ✨ 已擁有
                                </span>
                            ` : `
                                <button onclick="unlockReward('${r.id}', ${r.cost})" class="w-full py-1.5 rounded-xl text-xs font-bold transition shadow-sm ${canAfford ? 'bg-gradient-to-r from-pink-500 to-purple-500 text-white hover:opacity-90' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}" ${!canAfford ? 'disabled' : ''}>
                                    解鎖: ⭐ ${r.cost}
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function unlockReward(id, cost) {
            if (appState.stars >= cost && !appState.unlockedRewards.includes(id)) {
                appState.stars -= cost;
                appState.unlockedRewards.push(id);
                saveState();
                updateStatsUI();
                renderTrophyRoom();
                showModal('成功解鎖寶物！✨', '恭喜獲得專屬皇家收藏品！', '🏰');
            }
        }

        function addStars(num) {
            appState.stars += num;
            saveState();
            updateStatsUI();
        }

        function addCrowns(num) {
            appState.crowns += num;
            saveState();
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('starCount').innerText = appState.stars;
            document.getElementById('crownCount').innerText = appState.crowns;

            let title = '朗讀小騎士';
            if (appState.crowns >= 8) title = '皇家詩詞女王 👸🏻';
            else if (appState.crowns >= 4) title = '優雅小公主 👑';
            else if (appState.crowns >= 2) title = '朗讀小明星 🌟';
            document.getElementById('princessTitle').innerText = title;
        }

        function saveState() {
            localStorage.setItem('p3_stars', appState.stars);
            localStorage.setItem('p3_crowns', appState.crowns);
            localStorage.setItem('p3_rewards', JSON.stringify(appState.unlockedRewards));
        }

        function showModal(title, msg, icon = '✨') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() - 0.5) * 1.2;
                this.color = `hsla(${Math.random() * 60 + 300}, 100%, 75%, ${Math.random() * 0.6 + 0.2})`;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 35; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        window.onload = function() {
            renderPoem();
            updateStatsUI();
            animateParticles();
        };
    </script>
</body>
</html>
