<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小公主普通話朗讀館 - 《水調歌頭》</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', 'Fredoka', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #ffd1dc 0%, #e8c5ff 50%, #c4e0e5 100%);
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        /* Ruby Pinyin custom styling */
        ruby {
            ruby-position: over;
            display: inline-flex;
            flex-direction: column-reverse;
            align-items: center;
            margin: 0 3px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 4px 6px;
            border-radius: 12px;
        }
        
        rt {
            font-size: 0.52em;
            font-weight: 600;
            color: #d946ef;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
            line-height: 1.2;
            margin-bottom: 2px;
            font-family: Arial, sans-serif;
        }

        /* Character interaction styling */
        .char-box {
            font-size: var(--poem-font-size, 2rem);
            font-weight: 700;
            color: #3b0764;
            display: inline-block;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        ruby:hover {
            background-color: rgba(255, 255, 255, 0.85);
            transform: translateY(-4px) scale(1.12);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.25);
        }

        ruby.active-speech {
            background: linear-gradient(135deg, #fef08a, #fde047);
            border: 2px solid #eab308;
            transform: scale(1.2);
            box-shadow: 0 0 18px rgba(234, 179, 8, 0.7);
            animation: pulse-glow 1s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px #facc15, 0 0 20px #f43f5e; }
            100% { box-shadow: 0 0 20px #facc15, 0 0 35px #ec4899; }
        }

        /* Floating background sparkles */
        .sparkle-bg {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism containers */
        .glass-card {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 12px 32px rgba(236, 72, 153, 0.15);
        }

        .glass-btn {
            background: linear-gradient(135deg, #ffffff 0%, #fce7f3 100%);
            border: 2px solid #f472b6;
            transition: all 0.2s ease;
        }

        .glass-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 18px rgba(244, 114, 182, 0.35);
        }

        .glass-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fbcfe8;
        }
        ::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 10px;
        }

        /* Hide Pinyin mode */
        body.hide-pinyin rt {
            display: none !important;
        }

        .sentence-row {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .sentence-row.highlight-sentence {
            background-color: rgba(253, 242, 248, 0.95);
            border-color: #ec4899 !important;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.25);
        }

        /* Floating sparkles particle effect */
        .magic-particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col relative pb-12">
    <canvas id="sparkleCanvas" class="sparkle-bg"></canvas>

    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b-2 border-pink-200 px-4 py-3 shadow-md">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <!-- App Logo -->
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-gradient-to-tr from-pink-400 to-purple-500 flex items-center justify-center text-white text-2xl shadow-md transform hover:rotate-12 transition">
                    👑
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-black bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 bg-clip-text text-transparent">
                        小公主普通話朗讀館
                    </h1>
                    <p class="text-xs font-semibold text-pink-500">《水調歌頭》 • 蘇軾 (三年級評估專用)</p>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="flex items-center gap-2 md:gap-4 bg-pink-50/90 border border-pink-200 px-4 py-1.5 rounded-full shadow-inner">
                <div class="flex items-center gap-1.5" title="魔法星星">
                    <span class="text-xl animate-bounce">⭐</span>
                    <span id="starCount" class="font-black text-pink-600 text-lg">0</span>
                </div>
                <div class="w-px h-6 bg-pink-200"></div>
                <div class="flex items-center gap-1.5" title="皇家皇冠">
                    <span class="text-xl">👑</span>
                    <span id="crownCount" class="font-black text-purple-600 text-lg">0</span>
                </div>
                <div class="w-px h-6 bg-pink-200"></div>
                <div class="flex items-center gap-1.5" title="稱號">
                    <span id="princessTitle" class="text-xs font-bold text-pink-700 bg-pink-200 px-2 py-0.5 rounded-full">
                        練習見習生
                    </span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto w-full px-3 md:px-6 pt-4 flex-1 z-10">
        <!-- Navigation Buttons -->
        <nav class="flex justify-center gap-2 md:gap-4 mb-6">
            <button onclick="switchTab('reading')" id="tabBtn-reading" class="tab-btn glass-btn px-4 md:px-6 py-2.5 rounded-2xl font-bold text-sm md:text-base text-pink-700 flex items-center gap-2 shadow-sm border-2 border-pink-400 bg-pink-100">
                <span>🌸</span> 點讀與朗讀館
            </button>
            <button onclick="switchTab('games')" id="tabBtn-games" class="tab-btn glass-btn px-4 md:px-6 py-2.5 rounded-2xl font-bold text-sm md:text-base text-purple-700 flex items-center gap-2 shadow-sm border-2 border-transparent">
                <span>🎮</span> 魔法小遊戲
            </button>
            <button onclick="switchTab('trophy')" id="tabBtn-trophy" class="tab-btn glass-btn px-4 md:px-6 py-2.5 rounded-2xl font-bold text-sm md:text-base text-indigo-700 flex items-center gap-2 shadow-sm border-2 border-transparent">
                <span>🏰</span> 公主寶物庫
            </button>
        </nav>

        <!-- ================= PAGE 1: READING HALL ================= -->
        <section id="page-reading" class="tab-content space-y-6">
            
            <!-- Controls Toolbar -->
            <div class="glass-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-2 md:gap-3">
                    <button onclick="togglePinyin()" id="pinyinToggleBtn" class="px-3.5 py-1.5 rounded-xl bg-pink-500 text-white font-semibold text-xs md:text-sm shadow-sm hover:bg-pink-600 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-eye"></i> 拼音顯示：開
                    </button>
                    
                    <div class="flex items-center bg-white/80 rounded-xl px-2 py-1 border border-pink-200">
                        <span class="text-xs font-bold text-pink-600 mr-2">字體:</span>
                        <button onclick="changeFontSize(-0.2)" class="px-2 py-0.5 rounded text-pink-600 hover:bg-pink-100 font-bold text-xs">-A</button>
                        <button onclick="resetFontSize()" class="px-2 py-0.5 rounded text-pink-600 hover:bg-pink-100 font-bold text-xs">重置</button>
                        <button onclick="changeFontSize(0.2)" class="px-2 py-0.5 rounded text-pink-600 hover:bg-pink-100 font-bold text-xs">+A</button>
                    </div>

                    <div class="flex items-center bg-white/80 rounded-xl px-2 py-1 border border-pink-200">
                        <span class="text-xs font-bold text-purple-600 mr-1.5">語速:</span>
                        <select id="speechRateSelect" class="bg-transparent text-xs font-bold text-purple-700 focus:outline-none">
                            <option value="0.8">0.8x (慢速)</option>
                            <option value="1.0" selected>1.0x (標準)</option>
                        </select>
                    </div>
                </div>

                <!-- Main Speech Controls -->
                <div class="flex items-center gap-2">
                    <button onclick="playFullPoem()" id="fullReadBtn" class="px-4 py-2 rounded-xl bg-gradient-to-r from-pink-500 to-purple-600 text-white font-bold text-sm shadow-md hover:opacity-90 transition flex items-center gap-2">
                        <i class="fa-solid fa-play"></i> 全文朗讀
                    </button>
                    <button onclick="stopSpeech()" class="px-3 py-2 rounded-xl bg-slate-200 text-slate-700 font-bold text-sm hover:bg-slate-300 transition" title="停止播放">
                        <i class="fa-solid fa-square"></i>
                    </button>
                </div>
            </div>

            <!-- Princess Mascot Tip -->
            <div class="flex items-start gap-3 bg-gradient-to-r from-pink-100/90 to-purple-100/90 border-2 border-pink-300 rounded-2xl p-4 shadow-sm relative overflow-hidden">
                <div class="w-14 h-14 rounded-full bg-pink-200 border-2 border-white shadow flex-shrink-0 flex items-center justify-center text-3xl">
                    👸🏻
                </div>
                <div class="flex-1">
                    <div class="flex items-center justify-between">
                        <h4 class="font-bold text-pink-700 text-sm md:text-base">愛麗絲公主的小提示：</h4>
                        <span class="text-xs bg-pink-200 text-pink-800 px-2 py-0.5 rounded-full font-bold">小音箱</span>
                    </div>
                    <p id="mascotSpeech" class="text-xs md:text-sm text-slate-700 font-medium mt-1">
                        點擊任何一個漢字可以聽「逐字點讀」；點擊句子旁邊的 <i class="fa-solid fa-volume-high text-pink-500"></i> 可以「逐句朗讀」喔！加油小公主！
                    </p>
                </div>
            </div>

            <!-- Poem Display Card -->
            <div class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl relative border-2 border-pink-200">
                <!-- Title Header -->
                <div class="text-center mb-8 pb-4 border-b-2 border-dashed border-pink-200">
                    <div class="inline-block text-center py-2 px-6 rounded-2xl bg-pink-50 border border-pink-200 shadow-sm">
                        <div id="poemTitle" class="flex justify-center items-end flex-wrap gap-1">
                            <!-- JS Populated Ruby Title -->
                        </div>
                        <div id="poemAuthor" class="flex justify-center items-end flex-wrap gap-1 mt-2 text-sm">
                            <!-- JS Populated Ruby Author -->
                        </div>
                    </div>
                </div>

                <!-- Poem Sentences Body -->
                <div id="poemBody" class="space-y-6 max-w-3xl mx-auto">
                    <!-- Sentences generated via JS for precise sync -->
                </div>
            </div>
        </section>

        <!-- ================= PAGE 2: MINI GAMES ================= -->
        <section id="page-games" class="tab-content hidden space-y-6">
            <!-- Game Selector Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                <button onclick="startMiniGame(1)" id="gameTab-1" class="glass-card p-4 rounded-2xl text-center hover:border-pink-400 transition border-2 border-pink-400 bg-pink-50">
                    <div class="text-3xl mb-1">💎</div>
                    <h3 class="font-bold text-sm md:text-base text-pink-700">魔法寶石填空</h3>
                    <p class="text-xs text-slate-500 mt-1">字詞填空測驗</p>
                </button>
                <button onclick="startMiniGame(2)" id="gameTab-2" class="glass-card p-4 rounded-2xl text-center hover:border-purple-400 transition border-2 border-transparent">
                    <div class="text-3xl mb-1">👑</div>
                    <h3 class="font-bold text-sm md:text-base text-purple-700">皇冠句序重組</h3>
                    <p class="text-xs text-slate-500 mt-1">詩句重組挑戰</p>
                </button>
                <button onclick="startMiniGame(3)" id="gameTab-3" class="glass-card p-4 rounded-2xl text-center hover:border-indigo-400 transition border-2 border-transparent">
                    <div class="text-3xl mb-1">🎵</div>
                    <h3 class="font-bold text-sm md:text-base text-indigo-700">聽音尋寶遊戲</h3>
                    <p class="text-xs text-slate-500 mt-1">普通話聽力測驗</p>
                </button>
                <button onclick="startMiniGame(4)" id="gameTab-4" class="glass-card p-4 rounded-2xl text-center hover:border-rose-400 transition border-2 border-transparent">
                    <div class="text-3xl mb-1">🎙️</div>
                    <h3 class="font-bold text-sm md:text-base text-rose-700">朗讀評估跟讀</h3>
                    <p class="text-xs text-slate-500 mt-1">小公主發音測試</p>
                </button>
            </div>

            <!-- Active Game Display Box -->
            <div class="glass-card rounded-3xl p-6 md:p-8 border-2 border-purple-200 min-h-[420px] flex flex-col justify-between relative" id="gameArena">
                <!-- Dynamic Content Rendered Here -->
            </div>
        </section>

        <!-- ================= PAGE 3: TROPHY ROOM ================= -->
        <section id="page-trophy" class="tab-content hidden space-y-6">
            <div class="glass-card rounded-3xl p-6 md:p-8 border-2 border-indigo-200 text-center">
                <h2 class="text-2xl font-black text-indigo-800 flex items-center justify-center gap-2">
                    <span>👑</span> 小公主的夢幻寶物庫 <span>🏰</span>
                </h2>
                <p class="text-sm text-slate-600 mt-1">完成朗讀與遊戲挑戰，積攢魔法星星，解鎖皇家專屬寶物！</p>

                <!-- Reward Collection Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-8" id="rewardsGrid">
                    <!-- Dynamic Rewards populated by JS -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Dialog for Messages -->
    <div id="modalOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full text-center border-4 border-pink-300 shadow-2xl transform scale-95 transition-transform" id="modalBox">
            <div id="modalIcon" class="text-5xl mb-3">✨</div>
            <h3 id="modalTitle" class="text-xl font-black text-pink-700 mb-2">標題</h3>
            <p id="modalMessage" class="text-sm text-slate-600 mb-6">內容訊息...</p>
            <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-pink-500 to-purple-500 text-white font-bold shadow-md hover:opacity-90">
                太棒了！
            </button>
        </div>
    </div>

            title: [

                { char: '調', pinyin: 'diào' },
                { char: '歌', pinyin: 'gē' },
                { char: '頭', pinyin: 'tóu' }

            author: [
                { char: '蘇', pinyin: 'sū' },
                { char: '軾', pinyin: 'shì' }
            ],
            sentences: [
                {
                    id: 0,
                    text: '明月幾時有？把酒問青天。',

                        { char: '知', pinyin: 'zhī' },
                        { char: '天', pinyin: 'tiān' },
                        { char: '上', pinyin: 'shàng' },

                        { char: '。', pinyin: '' }
                    ]
                },
                {
                    id: 2,
                    text: '我欲乘風歸去，唯恐瓊樓玉宇，高處不勝寒。',
                    words: [

                        { char: '欲', pinyin: 'yù' },

                        { char: '處', pinyin: 'chù' },

                        { char: '勝', pinyin: 'shèng' },

        // Web Audio API Synth Effects
        let audioCtx = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChimeSFX(type = 'click') {
            try {
                initAudioContext();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'success') {
                    // Major triad
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'triangle';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.2, now + idx * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                        o.start(now + idx * 0.08);
                        o.stop(now + idx * 0.08 + 0.3);
                    });
                } else if (type === 'fanfare') {
                    [440, 554.37, 659.25, 880].forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'sine';
                        o.frequency.value = freq;
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        g.gain.setValueAtTime(0.25, now + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.4);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.4);
                    });
                }
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        let synth = window.speechSynthesis;
        let selectedVoice = null;

        function loadMandarinVoice() {
            if (!synth) return;
            const voices = synth.getVoices();
            // Prioritize Mandarin Chinese voices (zh-CN, zh-TW, zh)
            selectedVoice = voices.find(v => v.lang.includes('zh-CN') || v.lang.includes('zh_CN')) ||
                            voices.find(v => v.lang.startsWith('zh')) || null;
        }

        if (synth) {
            loadMandarinVoice();
            if (synth.onvoiceschanged !== undefined) {
                synth.onvoiceschanged = loadMandarinVoice;
            }
        }

        function speakText(text, onEndCallback = null) {
            if (!synth) {
                if (onEndCallback) onEndCallback();
                return;
            }
            synth.cancel(); // Stop ongoing speech

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            if (selectedVoice) utterance.voice = selectedVoice;

            const rateSelect = document.getElementById('speechRateSelect');
            utterance.rate = rateSelect ? parseFloat(rateSelect.value) : 1.0;
            utterance.pitch = 1.1; // Cute slightly higher pitch

            if (onEndCallback) {
                utterance.onend = onEndCallback;
                utterance.onerror = onEndCallback;
            }

            synth.speak(utterance);
        }

            const highlightInterval = setInterval(() => {
                while (currentWIdx < sentenceObj.words.length && !sentenceObj.words[currentWIdx].pinyin) {

            const evalLines = [
                { line: '明月幾時有？把酒問青天。', pinyin: 'míng yuè jǐ shí yǒu？bǎ jiǔ wèn qīng tiān。' },
                { line: '不知天上宮闕，今夕是何年。', pinyin: 'bù zhī tiān shàng gōng què，jīn xī shì hé nián。' },
                { line: '但願人長久，千里共嬋娟。', pinyin: 'dàn yuàn rén cháng jiǔ，qiān lǐ gòng chán juān。' }
            ];

            let lineIdx = 0;
            let isRecording = false;

            function showEvalUI() {
                const current = evalLines[lineIdx];
                container.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-bold bg-rose-100 text-rose-700 px-3 py-1 rounded-full">
                                🎙️ 朗讀評估與跟讀 (第 ${lineIdx + 1} / ${evalLines.length} 關)
                            </span>
                        </div>

                        <div class="text-center py-6 space-y-3">
                            <p class="text-xs text-rose-500 font-bold">請先點擊示範朗讀，然後按麥克風進行跟讀評估：</p>
                            
                            <div class="bg-rose-50 border-2 border-rose-200 rounded-2xl p-4 inline-block max-w-lg w-full">
                                <p class="text-xs text-pink-500 mb-1">${current.pinyin}</p>
                                <p class="text-2xl font-black text-rose-900">${current.line}</p>
                            </div>

                            <div class="flex items-center justify-center gap-3 pt-2">
                                <button onclick="demoReadG4()" class="px-4 py-2 rounded-xl bg-rose-100 text-rose-700 font-bold text-xs hover:bg-rose-200 flex items-center gap-1.5">
                                    <i class="fa-solid fa-volume-high"></i> 聽示範讀音
                                </button>
                            </div>
                        </div>

                        <!-- Simulated Voice Waveform & Record Button -->
                        <div class="text-center space-y-4">
                            <div id="micStatus" class="text-xs font-bold text-slate-500">
                                點擊下方麥克風，開始錄音跟讀...
                            </div>
                            
                            <button id="recordBtn" onclick="toggleRecordG4()" class="w-20 h-20 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white text-3xl shadow-xl hover:scale-105 transition flex items-center justify-center mx-auto relative">
                                <i id="micIcon" class="fa-solid fa-microphone"></i>
                            </button>
                        </div>
                    </div>
                `;
            }

            window.demoReadG4 = function() {
                playChimeSFX('click');
                speakText(evalLines[lineIdx].line);
            };

            window.toggleRecordG4 = function() {
                playChimeSFX('click');
                const micIcon = document.getElementById('micIcon');
                const status = document.getElementById('micStatus');
                const btn = document.getElementById('recordBtn');

                if (!isRecording) {
                    isRecording = true;
                    btn.classList.add('animate-pulse', 'ring-4', 'ring-rose-300');
                    micIcon.className = 'fa-solid fa-stop';
                    status.innerText = '🔴 正在錄音跟讀中... 請大聲朗讀！';
                    
                    // Simulate 3 seconds speech check
                    setTimeout(() => {
                        if (isRecording) {
                            toggleRecordG4();
                        }
                    }, 3500);
                } else {
                    isRecording = false;
                    btn.classList.remove('animate-pulse', 'ring-4', 'ring-rose-300');
                    micIcon.className = 'fa-solid fa-microphone';
                    status.innerText = '✨ 錄音分析評估中...';

                    setTimeout(() => {
                        playChimeSFX('fanfare');
                        addStars(5);
                        showModal('朗讀評估評級：三顆皇冠 👑👑👑', '語音咬字清晰！發音極度標準！愛麗絲公主給你滿分！', '🌟');

                        lineIdx++;
                        if (lineIdx < evalLines.length) {
                            setTimeout(showEvalUI, 1200);
                        } else {
                            setTimeout(() => {
                                addCrowns(2);
                                container.innerHTML = `
                                    <div class="text-center py-10 space-y-4">
                                        <div class="text-6xl animate-bounce">👑👑👑</div>
                                        <h3 class="text-2xl font-black text-rose-700">朗讀評估獲得最高榮譽！</h3>
                                        <p class="text-slate-600">小公主普通話發音十分流利標準！獲得 2 頂皇冠！</p>
                                        <button onclick="startMiniGame(4)" class="px-6 py-2.5 rounded-xl bg-rose-500 text-white font-bold shadow-md hover:bg-rose-600">
                                            重新進行朗讀測試
                                        </button>
                                    </div>
                                `;
                            }, 1200);
                        }
                    }, 1000);
                }
            };

            showEvalUI();
        }

        function renderTrophyRoom() {
            const grid = document.getElementById('rewardsGrid');
            grid.innerHTML = REWARDS.map(r => {
                const isUnlocked = appState.unlockedRewards.includes(r.id);
                const canAfford = appState.stars >= r.cost;

                return `
                    <div class="glass-card rounded-2xl p-5 border-2 ${isUnlocked ? 'border-amber-300 bg-amber-50/70' : 'border-slate-200'} flex flex-col items-center text-center justify-between">
                        <div>
                            <div class="text-5xl mb-2 ${isUnlocked ? 'animate-pulse' : 'filter grayscale opacity-60'}">
                                ${r.icon}
                            </div>
                            <h4 class="font-bold text-slate-800 text-base">${r.name}</h4>
                            <p class="text-xs text-slate-500 mt-1">${r.desc}</p>
                        </div>

                        <div class="mt-4 w-full">
                            ${isUnlocked ? `
                                <span class="inline-block w-full py-1.5 rounded-xl bg-amber-200 text-amber-800 font-bold text-xs">
                                    ✨ 已佩戴收藏
                                </span>
                            ` : `
                                <button onclick="unlockReward('${r.id}', ${r.cost})" class="w-full py-2 rounded-xl text-xs font-bold transition shadow-sm ${canAfford ? 'bg-gradient-to-r from-pink-500 to-purple-500 text-white hover:opacity-90' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}" ${!canAfford ? 'disabled' : ''}>
                                    解鎖需求: ⭐ ${r.cost}
                                </button>
                            `}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function unlockReward(id, cost) {
            if (appState.stars >= cost && !appState.unlockedRewards.includes(id)) {
                playChimeSFX('fanfare');
                appState.stars -= cost;
                appState.unlockedRewards.push(id);
                saveState();
                updateStatsUI();
                renderTrophyRoom();
                showModal('解鎖皇家寶物！', '恭喜小公主擁有新的專屬城堡寶物！', '✨');
            }
        }

        function addStars(num) {
            appState.stars += num;
            saveState();
            updateStatsUI();
        }

        function addCrowns(num) {
            appState.crowns += num;
            saveState();
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById('starCount').innerText = appState.stars;
            document.getElementById('crownCount').innerText = appState.crowns;

            // Title calculation
            let title = '練習見習生';
            if (appState.crowns >= 10) title = '皇家詩詞女王 👸🏻';
            else if (appState.crowns >= 5) title = '優雅小公主 👑';
            else if (appState.crowns >= 2) title = '朗讀小明星 🌟';
            document.getElementById('princessTitle').innerText = title;
        }

        function saveState() {
            localStorage.setItem('princess_stars', appState.stars);
            localStorage.setItem('princess_crowns', appState.crowns);
            localStorage.setItem('princess_rewards', JSON.stringify(appState.unlockedRewards));
        }

        function showModal(title, msg, icon = '✨') {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = msg;
            document.getElementById('modalIcon').innerText = icon;
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function closeModal() {
            playChimeSFX('click');
            document.getElementById('modalOverlay').classList.add('hidden');
        }

        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 1.5;
                this.speedY = (Math.random() - 0.5) * 1.5;
                this.color = `hsla(${Math.random() * 60 + 300}, 100%, 75%, ${Math.random() * 0.7 + 0.3})`;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) {
            particles.push(new Particle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }

        window.addEventListener('pointerdown', (e) => {
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(e.clientX, e.clientY));
                if (particles.length > 60) particles.shift();
            }
        });

        window.onload = function() {
            renderPoem();
            updateStatsUI();
            animateParticles();
        };
    </script>
</body>
</html>
